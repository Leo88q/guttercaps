    <!-- No web-font link here, and that is not an oversight: `ops/deploy/nginx.conf` ships
         font-src 'self' data: and style-src 'self' 'unsafe-inline', so a Google Fonts <link> is a
         render-blocking request the production CSP blocks anyway — a third-party call carrying the
         visitor's IP on every page load, in exchange for nothing. The fonts are self-hosted instead:
         the woff2 files live in client/public/fonts (OFL-1.1 / Apache-2.0, licence texts next to the
         bytes) and the generated client/src/shared/ui/fonts.css is imported by App.tsx; see
         client/public/fonts/README.md. Nothing here needs to be added back. -->
  </head>
