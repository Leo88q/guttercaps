name: G-3 Soak Nightly

# Nightly short soak test to validate G-3 readiness
# Runs a reduced soak test (1 hour, 100 packs) to catch regressions

on:
  schedule:
    # Run nightly at 02:00 UTC
    - cron: '0 2 * * *'
  
  workflow_dispatch:
    inputs:
      duration_hours:
        description: 'Soak duration in hours'
        required: false
        default: '1'
        type: number

jobs:
  nightly-soak:
    name: Nightly G-3 Soak
    runs-on: ubuntu-latest
    timeout-minutes: 120 # 2 hours max
    
    env:
      SOAK_DURATION_DAYS: 0.0417 # ~1 hour
      SOAK_TARGET_PACKS: 100
      SOAK_CONCURRENCY: 3
      SOAK_INTERVAL_MS: 500
      SOAK_LOG_INTERVAL_MS: 30000
      DEVNET_RPC_URL: https://api.devnet.solana.com
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --omit=optional --no-audit --no-fund
      
      - name: Create test wallet
        id: wallet
        run: |
          WALLET_JSON=$(mktemp)
          node -e "
            const { Keypair } = require('@solana/web3.js');
            const fs = require('fs');
            const kp = Keypair.generate();
            fs.writeFileSync('$WALLET_JSON', JSON.stringify(Array.from(kp.secretKey)));
            console.log('PRIVATE_KEY=' + Buffer.from(kp.secretKey).toString('base64'));
          " > wallet.env
          echo "PRIVATE_KEY=$(cat wallet.env | grep PRIVATE_KEY | cut -d= -f2)" >> $GITHUB_ENV
      
      - name: Request devnet airdrop
        run: |
          node -e "
            const { Connection, Keypair, LAMPORTS_PER_SOL } = require('@solana/web3.js');
            const connection = new Connection('https://api.devnet.solana.com');
            const walletJson = require('fs').readFileSync('${{ steps.wallet.outputs.WALLET_FILE }}', 'utf8');
            const secretKey = Uint8Array.from(JSON.parse(walletJson));
            const keypair = Keypair.fromSecretKey(secretKey);
            
            try {
              const signature = await connection.requestAirdrop(keypair.publicKey, 5 * LAMPORTS_PER_SOL);
              await connection.confirmTransaction(signature, 'confirmed');
              console.log('Airdrop received:', signature);
            } catch (error) {
              console.log('Airdrop request failed:', error.message);
            }
          "
        continue-on-error: true
      
      - name: Run nightly soak
        run: |
          echo "Starting nightly G-3 soak test..."
          npm run load:soak-g3
        env:
          DEVNET_RPC_URL: ${{ env.DEVNET_RPC_URL }}
          PRIVATE_KEY: ${{ env.PRIVATE_KEY }}
          SOAK_DURATION_DAYS: ${{ env.SOAK_DURATION_DAYS }}
          SOAK_TARGET_PACKS: ${{ env.SOAK_TARGET_PACKS }}
          SOAK_CONCURRENCY: ${{ env.SOAK_CONCURRENCY }}
          SOAK_INTERVAL_MS: ${{ env.SOAK_INTERVAL_MS }}
          SOAK_LOG_INTERVAL_MS: ${{ env.SOAK_LOG_INTERVAL_MS }}
      
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g3-soak-nightly-${{ github.run_id }}
          path: |
            soak.log
          retention-days: 3
