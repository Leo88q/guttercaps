# ── action pins (SEC-B50) ────────────────────────────────────────────────────────────────────────────
# Every `uses:` in this file is a full commit SHA. A tag (`@v4`) is a ref the action's owner can
# repoint at any commit they like — including one that reads `GITHUB_TOKEN` and the deploy secrets,
# which is the shape of the `tj-actions/changed-files` compromise — and this repository pins npm
# versions by `sha512`, base images by patch tag and Cargo deps by exact version precisely because
# "whatever the ref means today" is not a pin. Updating one is a deliberate edit: resolve the new
# tag, change the SHA *and* the inline comment, and `npm run workflows:check` will notice a
# disagreement. The same mapping is asserted in `tests/security/deploy-artifacts.test.ts`.
#   actions/checkout             v4.4.0   11d5960a326750d5838078e36cf38b85af677262 2026-07-16
#   actions/download-artifact    v4.3.0   d3f86a106a0bac45b974a628896c90dbdf5c8093 2025-04-24
#   actions/upload-artifact      v4.6.2   ea165f8d65b6e75b540449e92b4886f43607fa02 2025-03-19
name: rustfmt

# Why a bot formats this repo instead of a human: `cargo fmt` output is a function of the rustfmt version,
# and the only version we can trust is the one CI uses — the image in `ci.yml`'s `programs` job. Anyone
# formatting on a laptop with a different stable produces a diff that CI then rejects, and the tempting fix
# becomes "make the fmt step advisory", which is the exact false-green we removed from CI (docs/09 §3.3).
# So the gate stays blocking, and the fix comes from the same image the gate calls.
#
# Three rules, each learned the expensive way while writing this file:
#   1. It has to *fire* where the gate is red. A `schedule` only runs from the default branch, so on a
#      feature branch this bot did not exist. Any push to main or `arena/**` now evaluates it — behind a
#      cheap guard job that reads this commit's `programs` check-run and only pays for the multi-gigabyte
#      container when the red is the `fmt` step. A red clippy/test/build is work, not formatting: the bot
#      names the failing steps and stands down instead of piling a diff onto a run that cannot go green.
#   2. The patch goes to whatever is red: a commit on the branch that failed, a PR only for `main`. A fmt
#      patch measured on a feature branch and merged into main formats a tree nobody measured and leaves the
#      feature branch red — the opposite of the point.
#   3. Every external call either works or fails loudly. `gh` reads GH_TOKEN, not GITHUB_TOKEN, and
#      `gh run list` cannot filter by commit: a swallowed error once made this workflow report "no fmt fix
#      needed" about a red fmt job. A bot that silently does nothing is the false-green §3.3 was written about.
#
# A repo setting to know about: «Allow GitHub Actions to create and approve pull requests» is off here, so the
# main-branch PR step exits 1 with the setting and the pushed branch named. That is a one-click finish for a
# human, not a lost patch — the commit is already on the remote when that step runs.
#
# A push made with GITHUB_TOKEN does not start CI — that is GitHub's own loop breaker, and it applies to the
# branch-push path above as much as to a bot PR: the formatting commit lands, and nothing re-runs on it. So the
# proof that the gate went green arrives on whoever's commit follows the bot's, and the loop guard below is
# what keeps "prove it" from becoming "prove it forever" (bot commit → no CI → no second bot commit).
on:
  schedule:
    - cron: '47 3 * * *'   # 30 minutes after ci.yml's nightly, so the two do not fight for the same runner
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']

concurrency:
  group: rustfmt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- the cheap half, on a stock runner
  gate:
    name: is the fmt step actually red?
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      checks: read # read the sibling `programs` check-run of this commit
      actions: read # …and the job/step list of its run, which is where the failing *step* name lives
      contents: read
    env:
      # `gh` reads GH_TOKEN, not GITHUB_TOKEN, and actions/checkout wires neither: without this every call
      # below fails, every failure is swallowed by `|| true`, and the bot answers "no fix needed" forever.
      # A silent no-op is the one outcome worse than a red fmt job, so the step authenticates first or fails.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      needed: ${{ steps.probe.outputs.needed }}
      reason: ${{ steps.probe.outputs.reason }}
    steps:
      - name: ask the check-run this commit produced
        id: probe
        run: |
          set -uo pipefail
          # `gh run list` has no way to select a run by commit — a first version of this step filtered by
          # `--commit`, the flag did not exist, the failure was swallowed, and the bot answered "no fmt fix
          # needed" about a red fmt job. So: the REST endpoint that *does* filter by head_sha, and one local
          # `jq` per fact instead of a chain of swallowed calls.
          api() { gh api "$1" --jq "$2" 2>/dev/null || true; }
          if ! gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --jq '.check_runs | length' >/dev/null 2>&1; then
            echo "::error::cannot read this commit's check-runs with the job token — refusing to conclude \"nothing is red\" from an empty answer"
            exit 1
          fi
          runs="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA"
          status=""; concl=""; fmt=0; run_id=""
          # The two workflows start from the same push, so `programs` is usually still running when this one
          # does. Wait for it, bounded: a bot that blocks on a job that never finishes hides its own outages.
          for i in $(seq 1 40); do
            [ -n "$run_id" ] || run_id="$(api "$runs" '.workflow_runs[0].id // empty')"
            if [ -n "$run_id" ]; then
              jobs="$(api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs" '[.jobs[] | select(.name | startswith("programs"))][0] // empty')"
              if [ -n "$jobs" ]; then
                status="$(printf '%s' "$jobs" | jq -r '.status // "absent"')"
                concl="$(printf '%s' "$jobs" | jq -r '.conclusion // "unknown"')"
                if [ "$status" = "completed" ] && [ "$concl" != "null" ] && [ -n "$concl" ]; then
                  fmt="$(printf '%s' "$jobs" | jq -r '[.steps[]? | select(.name == "fmt" and .conclusion == "failure")] | length')"
                  break
                fi
              fi
            fi
            sleep 15
          done
          # one write per key: relying on "the last duplicate wins" in $GITHUB_OUTPUT for a decision that
          # gates a container run is a documented behaviour, not a local one, and it buys nothing here.
          needed=false
          reason="programs ${status:-never-started}/${concl:-unknown}, fmt-step-failures=${fmt}"
          if [ "$concl" = "failure" ] && [ "${fmt:-0}" != "0" ]; then
            needed=true
            reason="$(printf '%s' "$jobs" | jq -r '[.steps[]? | select(.conclusion == "failure") | .name] | "programs is red at: " + join(", ")')"
            echo "::notice::rustfmt fix needed on ${GITHUB_REF_NAME}"
          fi
          {
            echo "needed=$needed"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"
          if [ "$concl" = "failure" ] && [ "${fmt:-0}" = "0" ]; then
            # A red clippy/test/build is real work. Reformatting a tree that does not compile adds a diff to
            # a red run and greens nothing, so the bot stands down — and says so, instead of vanishing.
            # (clippy and `cargo test` are the `rust-lints` job now; the gate only ever looks at `programs`'
            # `fmt` step, which is where this bot's rustfmt and the gate's are the same binary.)
            echo "::warning::programs failed for a non-fmt reason (steps: $(printf '%s' "$jobs" | jq -r '[.steps[]? | select(.conclusion == "failure") | .name] | join(", ")')); the fmt bot stands down"
          elif [ "$status" != "completed" ]; then
            echo "::warning::no finished \`programs\` job for $GITHUB_SHA within the poll window (status=${status:-none}) — no patch this run"
          fi

  # ---------------------------------------------------------------- the heavy half, in the CI image
  format:
    name: cargo fmt in the CI image
    needs: gate
    if: needs.gate.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: solanafoundation/anchor:v0.31.1
    permissions:
      contents: read
    outputs:
      has_changes: ${{ steps.patch.outputs.has_changes }}
      files: ${{ steps.patch.outputs.files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: format
        run: |
          # git in a container runs as a different uid than the checkout owner and refuses to touch the repo
          # without this; actions/checkout does not always add it for non-default images
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cargo fmt --all
      - name: collect the patch
        id: patch
        run: |
          # a real diff, not `git status`: rustfmt touches only what is actually mis-formatted
          git diff --binary > /tmp/rustfmt.patch
          if [ -s /tmp/rustfmt.patch ]; then
            files=$(git diff --name-only | tr '\n' ' ')
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "files=$files" >> "$GITHUB_OUTPUT"
            echo "patch written: $(wc -l < /tmp/rustfmt.patch) line(s) over $(git diff --name-only | wc -l) file(s)"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            # This is the branch where the bot tells you the truth instead of opening an empty PR: the gate
            # is red, rustfmt changed nothing, so the red is not formatting.
            echo "::error::programs is red at fmt, but \`cargo fmt --all\` produced no diff with $(rustfmt --version). The step is failing for a non-formatting reason (edition/toolchain mismatch in rustfmt.toml?) — fix that, do not reformat."
          fi
      # The patch travels as an artifact instead of being pushed by the same job: `apply + open a PR` needs
      # write tokens and node actions, which belong on a stock runner, not in the anchor image.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.patch.outputs.has_changes == 'true'
        with:
          name: rustfmt-patch
          path: /tmp/rustfmt.patch
          retention-days: 7

  # ---------------------------------------------------------------- deliver the patch
  #
  # Two destinations, and the difference is not cosmetic. A red *feature* branch belongs to whoever pushed
  # it: the fix goes onto that branch as a normal commit, because a PR against a branch nobody else can
  # merge turns "fmt is red" into an extra review step for nothing. `main` is the one branch where a bot
  # commit needs a human in front of it, so there the patch arrives as a PR.
  #
  # `gh pr create` rather than a third-party action, and with an explicit fallback message: this repo (like
  # most) has «Allow GitHub Actions to create or approve pull requests» switched off, and an action that
  # dies inside its own error handling teaches you nothing. Here the branch is always pushed first, so even
  # a rejected PR leaves the work in a place a human can click.
  deliver:
    name: push the fix (branch) or open the PR (main)
    needs: [gate, format]
    if: needs.format.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: rustfmt-patch, path: /tmp }
      - name: apply
        run: |
          set -euo pipefail
          git apply --stat /tmp/rustfmt.patch
          git apply /tmp/rustfmt.patch
          # the same question the gate asked, from the other side: rustfmt ran in the pinned image and
          # changed nothing there, so `git apply` of an empty-ish patch would be a bug in this file
          test -n "$(git status --porcelain)" || { echo "::error::the patch applied no changes — the artifact and the tree disagree"; exit 1; }
      - name: commit
        run: |
          set -euo pipefail
          # Loop guard, and the only thing standing between this workflow and a self-sustaining one: the
          # patch commit triggers ci.yml, ci.yml's fmt step is then green, and the gate would stop by itself
          # — but "by itself" is a race with the cache and a second container pull. Refusing to write a
          # second fmt commit on top of the first is a fact about this commit, not a hope about timing.
          if git log -1 --format=%s | grep -q 'cargo fmt --all (rustfmt from'; then
            echo "HEAD is already this bot's formatting commit; not stacking another one"
            echo "push_skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "guttercaps-rustfmt[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -am "chore(programs): cargo fmt --all (rustfmt from solanafoundation/anchor:v0.31.1)"
          echo "push_skip=false" >> "$GITHUB_OUTPUT"
        id: commit
      - name: push to the red branch
        if: steps.commit.outputs.push_skip == 'false' && github.ref_name != 'main'
        run: |
          set -euo pipefail
          git push -q origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          echo "pushed the formatting commit to ${GITHUB_REF_NAME}; ci.yml will prove fmt green on it"
      - name: open the PR against main
        if: steps.commit.outputs.push_skip == 'false' && github.ref_name == 'main'
        run: |
          set -euo pipefail
          head="chore/rustfmt-main"
          git push -q -f origin "HEAD:refs/heads/${head}"
          # the body in a file, not in a `$(cat <<EOF)` inside a `run: |` block: a here-doc is the one shell
          # construct whose indentation is also YAML syntax, and the two disagree about who owns the column
          body=/tmp/pr-body.md
          printf '%s\n' \
            "Machine-generated by \`.github/workflows/format.yml\`: \`cargo fmt --all\` with the same rustfmt the" \
            "blocking \`fmt\` step in \`ci.yml\` uses (same container image, \`solanafoundation/anchor:v0.31.1\`), so a" \
            "merge here cannot disagree with the gate. Nothing semantic is in the diff — rustfmt does not reorder" \
            "tokens." \
            "" \
            "Touched: ${{ needs.format.outputs.files }}" \
            "" \
            "CI does not run on bot-opened PRs (GitHub prevents token loops), so the verification is that" \
            "\`programs\` goes green on \`main\` after the merge, and red again if it is reverted. If the remaining" \
            "red is clippy/test/\`anchor build\`, that is the work list in \`docs/09\` §1.6 — formatting was never the" \
            "whole of it." > "$body"
          if gh pr create --base main --head "$head" --title 'chore(programs): cargo fmt (from the CI image)' --body-file "$body"; then
            gh pr view --json url --jq .url 2>/dev/null || true
          else
            # not a swallowed failure: the commit is on the remote either way, and the sentence below says
            # exactly which repo setting to flip so this step stops needing a human
            echo "::error::the branch ${head} is pushed, but no PR could be opened. This repo has «Allow GitHub"
            echo "Actions to create and approve pull requests» disabled — Settings → Actions → General →"
            echo "Workflow permissions. Enable it, or open ${head} → main by hand; the patch itself is fine."
            exit 1
          fi
