# CI — docs/06 §3.1 pyramid, backlog #16.
#
# PR / push jobs (fast, no chain):
#   economy   lock file matrix + invariants + golden vectors + Rust↔TS↔client sync-check
#   client    typecheck · vitest · vite build
#   backend   typecheck · vitest (sqlite in-memory)
#   landing   rebuild guttercaps-landing.html, diff against the committed file, numbers vs economy, DOM smoke
#   programs  cargo fmt + `anchor build` in the pinned Anchor container (first real build of the programs —
#             blocking since docs/09 §3.3: a red on-chain build fails the PR)
#   rust-lints  cargo clippy -D warnings + cargo test --workspace in `rust:1.89.0`, the channel
#             rust-toolchain.toml pins. A separate job because a job has one container, and the split is the
#             finding: `solanafoundation/anchor` ships no clippy, so `cargo clippy` there exited 101 with
#             "no such command" for weeks — a red step that measured nothing. A gate runs where its tool is.
#   localnet  the 92-scenario LiteSVM suite (tests/localnet) on the artifacts of `programs`
#
# Nightly (schedule): the same plus the e2e-devnet / fuzz-long / load-smoke placeholders from §3.1 — they
# stay opt-in (`workflow_dispatch`) until the devnet keys (T-D-03/T-D-04) exist.
name: ci

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *' # nightly UTC

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  ANCHOR_VERSION: 0.31.1
  SOLANA_VERSION: 2.1.0
  # keep vitest / node quiet and deterministic
  CI: 1
  FORCE_COLOR: 0

jobs:
  economy:
    name: economy · invariants + golden + sync-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - name: the lock describes a tree that exists on every OS/CPU, not just this runner's
        # `npm ci` on this runner is not evidence about a teammate's: the lock carried the platform packages
        # for exactly one OS/CPU (`@esbuild/linux-x64`, `@rollup/rollup-linux-x64-gnu`) and was green here for
        # months, while on macOS it failed with 70 × "Missing: … from lock file" under npm 11 and made a bare
        # `npm install` rewrite the file — which is how a checkout ends up with an uncommitted
        # package-lock.json that blocks the next `git pull`. The step checks the invariant that is
        # host-independent: every optional dependency any package declares has a node in the lock.
        run: npm run lock:matrix
      - name: every package in the lock pins its bytes, not just its version (SEC-B12)
        # 705 of 1 097 registry nodes had neither `resolved` nor `integrity`: `npm ci` took whatever tarball
        # the registry served for the version string. This checks the invariant offline — the same one
        # `tests/security/supply-chain.test.ts` enforces on the other side (host, sha512, withdrawn versions,
        # install scripts, manifest↔lock specs); the hash repair itself is `--write`, run once by a human.
        run: npm run lock:integrity
      - run: npm run economy:check
      - run: npm run economy:test
      - name: persisted account layouts frozen (scripts/state-layout.ts — SEC-B7)
        # An `#[account]` struct is the byte layout of every account already on chain: adding a field does not
        # fail the build, it changes what `open_pack` reads out of a `PendingPack`. The gate compares
        # programs/** against reports/state-layout.json and fails the commit that moves a layout.
        run: npm run state:layout -- --selftest && npm run state:layout
      - name: static Anchor security gates (tests/security — SECURITY-AUDIT-2026-09-25.md)
        # Checklist rules over programs/*/src with zero hits at HEAD (init/payer/seeds/space, program ids,
        # token mint binding, close targets, remaining_accounts dedupe, admin events, error-table and
        # instruction-name drift). No toolchain needed; every exception is an allowlist entry with a reason.
        run: npm run security:static
      - name: program ids agree in every copy in the tree (docs/09 §2)
        # The same question as `economy:check` one level up: that step proves every copied *number* agrees,
        # this one proves every copied *program id* does — `declare_id!`, the three [programs.*] tables,
        # chip.rs's CPI constants, the client and backend defaults, .env.example, the devnet probe below, and
        # the ID_SITES list that `program-ids -- apply` rewrites. It runs here, in a job with node and
        # node_modules, and it is deliberately NOT in `programs`: that job runs inside
        # `solanafoundation/anchor:v0.31.1`, whose node rejects `--experimental-strip-types` — and node's exit
        # code for a bad CLI option is 9. Three runs (76, 77, 78) read `exit 9` as a verdict about ids and
        # argued about which one, while the log the step produced (125 bytes) said the only thing that was
        # true: the script never started. A step that cannot run is not a gate that passed, and it is not a
        # gate that failed either — it is a step that asks nothing, which is why the fix is a location, not a
        # flag or a mode. (Two real defects did turn up on the way and are fixed on their own merits: the
        # monolith in `programs/`, and `status` treating anchor's fabricated `target/deploy/*-keypair.json` as
        # a deploy mismatch — see docs/09 §1.4.)
        run: sh scripts/ci-run-logged.sh /tmp/program-ids.log npm run program-ids -- status
      - name: surface the failure without log access
        if: failure()
        # Without this, a red ids step here publishes only "Process completed with exit code 1" and the table
        # that explains it stays in a log host that is unreachable from a terminal.
        run: sh scripts/ci-surface-log.sh /tmp/program-ids.log

  client:
    name: client · typecheck + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      # the OpenAPI types must be in sync with backend/openapi.yaml (regenerate + diff)
      - name: openapi types up to date
        run: |
          cd client && npx openapi-typescript ../backend/openapi.yaml -o src/api/schema.d.ts
          git diff --exit-code -- src/api/schema.d.ts || { echo '::error::client/src/api/schema.d.ts is stale — run: cd client && npx openapi-typescript ../backend/openapi.yaml -o src/api/schema.d.ts'; exit 1; }
      - run: npm --prefix client run typecheck
      - run: npm --prefix client test
      - run: npm --prefix client run build
      # docs/06 §1.3 budget (≤ 350 KB gzip on the critical path) — a number with no owner drifted to 518 KB
      - run: npm run bundle:check
      - uses: actions/upload-artifact@v4
        with: { name: client-dist, path: client/dist, retention-days: 7 }

  e2e:
    name: e2e · built app (mock API) + axe
    runs-on: ubuntu-latest
    env:
      # Playwright's postinstall would download browsers during `npm ci`; the job installs them in its own
      # step so the dependency install stays cacheable and the browser build is pinned by one command.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      # The mock build is the point: the tier must exercise the *production bundle* (entry graph,
      # modulepreload list, router) with no chain and no backend to be accountable for.
      - run: npm run e2e:build
      # Specs are TypeScript that nothing else typechecks; a typo in a selector that only runs nightly is
      # exactly what this catches for free.
      - run: npm run e2e:types
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=desktop-chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: test-results/, retention-days: 7 }

  backend:
    name: backend · typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm --prefix backend run typecheck
      - run: npm run backend:test
      # the localnet specs import the client builders — typecheck them here (no binaries needed)
      - run: npx tsc -p tests/localnet --noEmit
      # every operation in backend/openapi.yaml has a route, and every route is documented (docs/09 §4.7)
      - run: npm run api:check
      # every env var the code reads is documented in the matching .env.example, both directions
      - run: npm run env:check
      # backend/prisma/schema.prisma (Postgres target) vs the DDL that actually runs: divergence is allowed
      # only if it is listed in backend/prisma/drift.json, and the list may shrink but never grow (docs/09 §4.1)
      - run: npm run schema:check
      # the compose build-arg gate's own cases (scripts/deploy-build-env.ts) — they read the real compose
      # file, so a required `${VAR:?}` that nothing documents fails here rather than in a docker layer
      - run: npm run ops:buildenv -- --selftest
      # the deploy-artifact verifier's own cases (scripts/verify-deploy.ts, SEC-F19): the Switchboard pin
      # table against randomness.rs, the byte scan on synthetic binaries, the upgradeable-loader layout
      - run: npm run verify-deploy -- --selftest
      # `${{ steps.*.outputs.* }}`, `vars.*` and dispatch inputs that resolve to "" — the failure mode of
      # images.yml is publishing an image named after an empty string, so the refs are gated, not eyeballed
      - run: npm run workflows:check
      # every `§N` in docs/ and ops/ (and every `file §N` in scripts' comments) must resolve to a real
      # heading or numbered row — this is the gate that would have caught the run where a one-row docs edit
      # truncated docs/09 to a quarter of its size and left its own header pointing at §2–§8 (docs/09 §0)
      - run: npm run docs:refs

  landing:
    name: landing · build + check + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci
      - name: rebuild and diff the committed landing
        run: |
          npm run landing:build
          git diff --exit-code -- guttercaps-landing.html || { echo '::error::guttercaps-landing.html is stale — run: npm run landing:build'; exit 1; }
      - run: npm run landing:check

  programs:
    name: programs · fmt + anchor build
    runs-on: ubuntu-latest
    # Blocking since docs/09 §3.3: a red on-chain build must fail the PR. The compile pass itself is
    # described in docs/08 §4.1 (the code has never been built) and lands as a PR against this job.
    container:
      image: solanafoundation/anchor:v0.31.1
    env:
      # Absolute, not `~`: this image keeps its cargo home at /root/.cargo while Actions exports
      # HOME=/github/home, so a `~/.cargo/registry` cache path caches a directory nobody writes — and the
      # job reads as a slow build instead of a mis-set path. Pinning CARGO_HOME makes cache and build agree.
      CARGO_HOME: /root/.cargo
    steps:
      - uses: actions/checkout@v4
      - name: toolchain versions
        run: |
          rustc --version && cargo --version && solana --version && anchor --version
      - uses: actions/cache@v4
        with:
          path: |
            /root/.cargo/registry
            /root/.cargo/git
            target
            # deliberately NOT the solana installer dirs: `anchor build` installing a second SDK is the
            # failure this repo just spent a run on (it uninstalls the rustup `solana` toolchain link while
            # swapping), so ci-anchor-build.sh asserts the pinned version is the image's own instead of
            # letting the swap happen — and a cache for the thing we forbid is a way to make it half-happen
            # on some runners and not others.
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-
      # docs/09 §1.4: a verifiable build is only reproducible with a committed lockfile. Until G-0 produces
      # one, CI generates it and hands it to you as an artifact instead of pretending the build is pinned.
      - name: Cargo.lock is committed (reproducible + verifiable builds)
        # Blocking since the lock landed (`lockfile.yml` commits it to the branch it ran on, and did so for
        # the first time on 2026-09-18). The *shape* of the check matters more than the flip: the previous
        # version of this step ran `cargo generate-lockfile` and then `git diff` on the result. That is not a
        # sync check, it is an un-pin — generate-lockfile re-resolves to the newest compatible version, so it
        # moves anchor-lang 0.31.1 -> 0.31.2 (the manifests say ^0.31.1), which is the exact copy the pin in
        # scripts/ci-cargo-lock.sh refuses for a reason. The gate would have been red by design on every
        # commit, and the half hour spent reading it would have ended with someone committing the regenerated
        # file. `--locked` asks the same question without being allowed to answer it by editing: either the
        # lock already matches the manifests, or this job says so and stops.
        run: |
          if [ ! -f Cargo.lock ]; then
            echo '::error::Cargo.lock is missing (docs/09 §1.4) — nothing here is reproducible, and `solana-verify` cannot reproduce it either. Fix: run .github/workflows/lockfile.yml, which resolves, pins, proves with cargo check, and commits the file; do not hand-edit a lock to make this step green. Before starting anything: this very push may already be running that workflow, so check the cargo-lock run for this commit instead of dispatching a second one.'
            exit 1
          fi
          if ! cargo metadata --locked --format-version 1 > /dev/null; then
            echo '::error::Cargo.lock does not match the manifests under --locked. Fix in lockfile.yml, not here: `cargo update` in this job would silently move anchor-lang off the toolchain-pinned copy, and then the fmt/clippy verdict and the SBF artifact below would be built from different graphs.'
            exit 1
          fi
          echo "lockfile present; --locked says every manifest agrees with it"
      - name: dependency graph report (one anchor-lang for our crates; solana-program v2+v3 is by design)
        # Re-promoted from diagnostic to gate on 2026-09-18, the run after Cargo.lock landed: the demotion
        # existed because `cargo tree` here had no committed lock to resolve against, and an exit code that
        # measured the shell as much as the graph is not a check (the first version of this step failed the
        # PR on the *intended* solana-program v2/v3 split; the second died with exit 2 before printing
        # anything). Both excuses are gone now that the lock is in the tree.
        #
        # The criterion is copied from scripts/ci-cargo-lock.sh on purpose and must be changed with it:
        # "no anchor-lang copy outside the pinned line and kaigan's 0.32", NOT "exactly one copy". Two
        # copies exist by construction (mpl-core reaches kaigan, which hard-requires ^0.32.1), and asserting
        # the impossible is how a passing build becomes a red gate. anchor_version is read from Anchor.toml
        # rather than hardcoded here, so the CLI and the graph cannot drift apart silently.
        run: |
          want=$(sed -n 's/^anchor_version *= *"\([^"]*\)".*/\1/p' Anchor.toml | head -1)
          if [ -z "$want" ]; then
            echo '::error::Anchor.toml has no [toolchain] anchor_version — the graph has nothing to be checked against'
            exit 1
          fi
          line=$(printf '%s' "$want" | cut -d. -f1-2)
          tree=$(mktemp)
          err=$(mktemp)
          # `if cmd; then rc=0; else rc=$?; fi` and not `if ! cmd`: with `!` the shell has already rewritten
          # the status, and the first draft of this step printed "cargo tree exit 0" about a failure — an
          # exit code in a message that is always 0 is worse than no exit code, because it reads as evidence.
          if cargo tree -e normal,build --prefix none >"$tree" 2>"$err"; then rc=0; else rc=$?; fi
          if [ "$rc" != 0 ]; then
            echo "::error::cargo tree exit $rc with a committed Cargo.lock — with the lock in the tree this is no longer explainable by resolution, so it is a real failure"
            sed -n '1,4p' "$err" | sed 's/^/note: /'
            exit 1
          fi
          if [ ! -s "$tree" ]; then
            # Green and empty is not the same as green. A `cargo tree` that prints nothing while Cargo.lock
            # has 459 packages means the pipeline below would compare an empty version list against the
            # allowed lines and find no violation — the shape of check that passes by measuring nothing.
            echo '::error::cargo tree succeeded but printed no graph — refusing to read an empty dependency list as a passing gate'
            exit 1
          fi
          grep -E '^(anchor-lang|anchor-spl|anchor-client|solana-program|borsh) v' "$tree" | sort -u | sed 's/^/in graph: /'
          # lines, not words — the same trap the pin script documents: a `wc -w` on one version pair says 2.
          copies=$(grep -oE '^anchor-lang v[0-9][^ ]*' "$tree" | sed 's/^[^ ]* v//' | sort -u | sed '/^$/d' | wc -l | tr -d ' ')
          stray=$(grep -oE '^anchor-lang v[0-9][^ ]*' "$tree" | sed 's/^[^ ]* v//' | sed '/^$/d' | grep -cEv "^($line|0\\.32)\\." || true)
          if [ "${copies:-0}" = "0" ]; then
            # A `cargo tree` that exits 0 and lists no anchor-lang is not a graph in which the pin holds; it
            # is a step measuring nothing and passing. The newline-only output case slips past `-s`, which is
            # why the emptiness test is on the number the gate is about to reason over rather than on bytes.
            echo '::error::the resolved graph contains no anchor-lang at all — five anchor programs cannot resolve without it, so refuse to read this as a satisfied pin'
            exit 1
          fi
          printf 'anchor-lang: %s copy/copies; %s outside the allowed lines (%s and 0.32)\n' "${copies:-0}" "${stray:-0}" "$line"
          if [ "${stray:-1}" != "0" ]; then
            echo "::error::anchor-lang resolves to ${stray} copy/copies outside $line/0.32 — an unbounded lower bound resolved to another major, so the derives our #[account] bounds ask for are not the ones the pinned CLI generates (docs/09 §1.2: this is the E0277 returning). Fix in scripts/ci-cargo-lock.sh, not by editing manifests here."
            exit 1
          fi
          rm -f "$tree" "$err"
      - name: fmt
        # Blocking on purpose. If this is red, do not "fix" it with a laptop rustfmt (different version,
        # different output): run `npm run programs:fmt`, or merge the PR that .github/workflows/format.yml
        # opens from this exact image (nightly + dispatch).
        run: cargo fmt --all -- --check
      # clippy and `cargo test` live in `rust-lints` (the pinned rust image), not here: see that job's comment
      # for why the anchor image cannot run them.
      - name: the SBF toolchain can read this lock
        # Runs *before* the build below, on purpose. `cargo build-sbf` puts the cargo bundled in the Agave
        # release (2.1.0 → cargo 1.79.0) ahead of the image's own on PATH, and a dependency whose manifest
        # declares `edition = "2024"` is then fatal after four minutes of downloading, naming a crate but no
        # fix — which is how run 55 ended, on getrandom 0.4.3 behind proptest → rusty-fork → tempfile. The
        # pins live in scripts/ci-cargo-lock.sh (SBFPINS) and lockfile.yml proves them before committing;
        # this step is here because a lock can also be *stale-readable* the other way: a manifest bump in a
        # PR that this job sees before the lock job runs. Verdicts are deliberately narrow: red only for a
        # manifest this cargo cannot parse — anything else (no bundled cargo, a `--locked` format complaint
        # from the older cargo about a lock the newer one wrote) is a warning, because the build below is the
        # authority and a gate that is red about the *measurement* is how run 60 lost an hour.
        run: |
          # GitHub's default shell here is `bash -e`, so a bare `cmd; rc=$?` would never reach the `rc`
          # assignment — the failing command exits the step first, and exit 2 ("could not ask") would look
          # exactly like exit 1 ("unreadable"). An `if` condition is exempt from -e, which is the only
          # portable way to branch on an exit code in a workflow step.
          # ci-run-logged.sh, so a log exists whatever this step concludes: run 60's real confusion was the
          # *surfacing* step reporting "no log captured" for the step below, because this one failed and left
          # nothing on disk to read.
          if sh scripts/ci-run-logged.sh /tmp/sbf-check.log sh scripts/ci-sbf-toolchain-check.sh; then
            echo "step ok"
          else
            rc=$?
            if [ "$rc" != 1 ]; then
              # 2 = there was no bundled cargo to ask, and the script itself says so. Only a named,
              # unreadable manifest is allowed to be red from here.
              echo "step advisory (exit $rc): the anchor build below is the authority"
              exit 0
            fi
            exit "$rc"
          fi
      - name: anchor build (localnet feature → sb_mock id pinned)
        # scripts/ci-run-logged.sh, not `| tee`: this job runs in a container, its default shell is dash,
        # and `set -o pipefail` there is an illegal option — the step exited 2 at line 1 for a while and
        # `anchor build` never started. The helper is POSIX, keeps cargo's exit code, and leaves the log for
        # the surfacing step. The build itself is scripts/ci-anchor-build.sh, which shims agave's rename of
        # `solana-install` (without it anchor dies listing installed versions) and writes the toolchain
        # identity into that log first, because the log is the only thing that leaves this container.
        run: |
          mkdir -p target/deploy
          cp tests/localnet/fixtures/sb_mock-keypair.json target/deploy/
          sh scripts/ci-run-logged.sh /tmp/anchor-build.log sh scripts/ci-anchor-build.sh
          ls -la target/deploy/*.so
      - name: IDL + program ids match Anchor.toml
        run: |
          for p in chip_core market staking arena sb_mock; do
            want=$(grep -E "^$p\s*=" Anchor.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
            have=$(solana address -k target/deploy/$p-keypair.json)
            echo "$p: $have (Anchor.toml $want)"
            if [ "$p" != "sb_mock" ] && [ "$have" != "$want" ]; then echo "::warning::$p keypair id != Anchor.toml (run anchor keys sync before deploying)"; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: program-binaries
          retention-days: 7
          path: |
            target/deploy/*.so
            target/idl/*.json
            target/types/*.ts
      - name: surface the failure without log access
        if: failure()
        # scripts/ci-surface-log.sh — the runner's log host is unreachable from a terminal, so the log is
        # published as annotations instead. Its own comment says why the shape is what it is.
        run: sh scripts/ci-surface-log.sh /tmp/sbf-check.log /tmp/anchor-build.log

  rust-lints:
    name: rust · clippy + unit tests (pinned rust image)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # A job has one container, so this is a job: the anchor image ships rustfmt (fmt is proven by it) but no
    # clippy, and `cargo clippy` inside it exited 101 with "no such command" — red, and measuring nothing.
    # rust:1.89.0 is the channel rust-toolchain.toml pins, so `-D warnings` here is the lint set the repo
    # claims to hold itself to, run by the toolchain that decides it.
    container:
      image: rust:1.89.0
    permissions:
      contents: read
    env:
      CARGO_HOME: /usr/local/cargo
    steps:
      - uses: actions/checkout@v4
      - name: the image must contain what the steps call
        run: |
          bad=0
          for t in "rustc --version" "cargo --version" "cargo fmt --version" "cargo clippy --version"; do
            if out=$($t 2>&1 | head -1); then printf 'ok   %s → %s\n' "$t" "$out"; else printf '::error::`%s` is unusable in this image: %s\n' "$t" "$out"; bad=1; fi
          done
          # An assertion of the environment, not a courtesy: the failure this step prevents is a lint gate
          # that is red (or green) because a binary was missing.
          if [ "$bad" = 1 ]; then
            echo "::error::refusing to run lint steps against a toolchain that cannot answer"
            exit 1
          fi
      - uses: actions/cache@v4
        with:
          path: |
            # /usr/local/cargo is this image's CARGO_HOME — the clippy annotations in run 42 named paths
            # under /usr/local/cargo/registry/src, which is the evidence, not a guess
            /usr/local/cargo/registry
            /usr/local/cargo/git
            target
          key: rust-lints-${{ runner.os }}-1.89.0-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: rust-lints-${{ runner.os }}-1.89.0-
      - name: clippy
        # Same helper as `programs`, same reason: no pipe, no bashism, exit code preserved, log captured.
        # `--locked` as soon as a lockfile exists: without it, a manifest whose lock drifted is silently
        # re-resolved by the runner, and the gate lints a graph that is not the one being shipped.
        run: |
          if [ -f Cargo.lock ]; then locked=--locked; else locked=; fi
          # Two lints are excepted, and only these two, after `-D warnings` so that specificity resolves them
          # (an individual lint's level beats the `warnings` group). Both fire inside code `#[program]`
          # *emits*, on a line of ours: `unexpected_cfgs` for the SBF-only cfgs the macro gates on
          # (`feature = "solana"`, `custom-heap`, `custom_panic` — run 8 showed four at sb_mock/src/lib.rs:244)
          # and `deprecated` because anchor 0.31's expansion still calls `AccountInfo::realloc`, which
          # solana-program 2.x deprecates in favour of `resize` (our own three calls migrated in 9e8a376).
          # An item-level `#[allow]` on the module does not cover them — measured, not assumed: run 8 emitted
          # the warning one line below the allow that was meant to silence it, because the proc macro emits
          # siblings of the item, not only its body. Doing it here rather than as `#![allow]` in five crates
          # keeps the exception where the gate is defined and leaves our own cfg/deprecated usage checked.
          sh scripts/ci-run-logged.sh /tmp/clippy.log cargo clippy $locked --workspace --all-targets -- -D warnings -A deprecated -A unexpected_cfgs
      - name: unit tests
        run: |
          if [ -f Cargo.lock ]; then locked=--locked; else locked=; fi
          sh scripts/ci-run-logged.sh /tmp/cargo-test.log cargo test $locked --workspace
      - name: surface the failure without log access
        if: failure()
        run: sh scripts/ci-surface-log.sh /tmp/clippy.log /tmp/cargo-test.log

  localnet:
    name: localnet · 92 scenarios (LiteSVM)
    runs-on: ubuntu-latest
    needs: programs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: program-binaries, path: target }
      # SEC-F19 on the real artifact: the localnet build must carry the sb_mock pin and neither the devnet
      # nor the mainnet Switchboard ids. This is the same command the runbook runs with `--cluster mainnet`
      # on the release artifact, so a binary the scan cannot classify fails here first, not on deploy day.
      - name: deploy artifact carries exactly the localnet Switchboard pins (scripts/verify-deploy.ts)
        run: npm run verify-deploy -- artifact --cluster localnet
      - name: third-party fixtures (mpl-core pinned to release core@0.12.0, cached)
        uses: actions/cache@v4
        id: fixtures
        with:
          path: tests/localnet/fixtures/mpl_core.so
          # The key carries the pinned version — bump MPL_CORE_VERSION in tests/localnet/fetch-fixtures.ts
          # and this key together, so a new core never rides a stale cache entry. The pin tracks the
          # dependency era the suite was authored against (docs/03: mpl-core 0.12.1; the crate sits on
          # the 0.11.2 fallback (Cargo.lock pin) per docs/09 §1.2), NOT the newest release. History of this key:
          # -v1 cached a 0-byte file (run 81, docs/09 §G-2); -v2 cached a truncated-but-magic-valid file
          # (PR #19, 2026-09-19) — both passed the then magic-only guard and litesvm answered «Offset or
          # value is out of bounds». -v3 forced a fresh mainnet dump, which STILL failed the same way:
          # Metaplex had deployed core@0.15.2 (2026-09-17/18) and litesvm 1.4.1 cannot load its ELF at
          # all — a moving-target problem, not a cache problem. Pinning to the 0.15.1 release asset
          # fixed the boot but broke the runtime («Not a Core AssetV1», shifted error codes); 0.11.0
          # skewed error codes and PDA state the other way. core@0.12.0 is the declared dependency era;
          # checkProgramBinary is structural (phdr table + segment bounds vs file size).
          key: mpl-core-release-0.12.0-v1
      - if: steps.fixtures.outputs.cache-hit != 'true'
        # ci-run-logged.sh because this is the one step in the job that can fail for an external reason
        # (GitHub release asset gone, mainnet RPC rate limit for the pyth dump), and "the step that
        # fetches a fixture is red" is worth exactly nothing without the message the script printed.
        run: sh scripts/ci-run-logged.sh /tmp/localnet-fixtures.log env RPC_URL=${{ secrets.MAINNET_RPC_URL || 'https://api.mainnet-beta.solana.com' }} npm run localnet:fixtures
      - name: run suite
        run: sh scripts/ci-run-logged.sh /tmp/localnet-suite.log npm test
      # docs/09 §3.3 — the false green: `describe.skipIf(!bins.ok)` used to report success with 0 tests
      # executed. helpers/env.ts now throws in CI, and this guard catches any future way of skipping the
      # whole suite (bad artifact, empty junit) without touching the specs.
      - name: the suite really ran
        run: |
          f=target/localnet-junit.xml
          [ -f "$f" ] || { echo "::error::no junit report produced"; exit 1; }
          tests=$(grep -oE 'tests="[0-9]+"' "$f" | head -1 | grep -oE '[0-9]+')
          files=$(grep -c "<testsuite " "$f")
          echo "localnet: $tests tests in $files suites"
          if [ "${tests:-0}" -lt 92 ]; then echo "::error::expected >= 92 localnet scenarios, got ${tests:-0}"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: localnet-junit, path: target/localnet-junit.xml, if-no-files-found: ignore, retention-days: 14 }
      - name: surface the failure without log access
        if: failure()
        # The junit artifact above is the complete report, and the job log has every diff — but the log host
        # is unreachable from a terminal (see ci-surface-log.sh), and this job is the one place where a red
        # run is *several* failures rather than one. So the two channels publish separately: the vitest output
        # as windows, and the per-case failures as annotations, which is what a fixer reads first.
        # Triage mode while the suite's first deep failures are being worked down (docs/09 G-2): the
        # whole failure list as CHUNKED digest annotations and no per-case ones — a check run keeps only
        # ~10 annotations total regardless of payload size (27 per-case junit annotations came through as
        # 8), so the digest packs ~8 failures per annotation instead. No suite-log windows either: both
        # channels share that same budget. The fixtures windows stay (that step can fail for an external
        # reason).
        run: |
          sh scripts/ci-surface-log.sh /tmp/localnet-fixtures.log
          SURFACE_MAX=64 SURFACE_MSGMAX=2600 SURFACE_DIGEST=1 sh scripts/ci-surface-junit.sh target/localnet-junit.xml
      - name: surface the CU census without log access
        # Success-only on purpose: the failure path spends the whole annotation budget on the
        # junit digest (see above), and CU numbers from a red run would be partial anyway.
        # Runs BEFORE the upload: it aggregates target/cu-log.jsonl into target/cu-summary.json.
        run: node --no-warnings=ExperimentalWarning --import tsx scripts/ci-surface-cu.ts target/cu-log.jsonl || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: cu-summary, path: target/cu-summary.json, if-no-files-found: ignore, retention-days: 14 }

  lighthouse:
    name: nightly · lighthouse (mock build)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Non-blocking until a human has seen it green twice: sizes in this run are deterministic, timings on a
    # shared runner are not (lighthouserc.cjs says which is which and why only the first may gate).
    continue-on-error: true
    runs-on: ubuntu-latest
    env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      # lighthouserc.cjs measures what `vite preview` serves, so the build is part of the measurement —
      # without this step lhci starts a preview server over an empty client/dist and scores nothing.
      - run: npm run e2e:build
      - name: chrome path
        run: |
          chrome=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium || true)
          if [ -z "$chrome" ]; then echo '::error::no Chrome on the runner — lighthouse cannot run here'; exit 1; fi
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"
      - run: npx lhci autorun
      - uses: actions/upload-artifact@v4
        with: { name: lighthouse, path: test-results/lighthouse, retention-days: 14, if-no-files-found: ignore }

  security:
    name: security · npm audit + secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      # Production tree, as a gate (SEC-F12): every high/critical advisory fails unless it is in the dated,
      # justified ACCEPTED list of scripts/audit-gate.ts (today: bigint-buffer only, via @solana/spl-token).
      # `jayson` / `toml` are pinned through package.json `overrides` — that is what took the tree from
      # 23 advisories to that single chain; `npm audit --omit=dev` is the same report, human-shaped.
      - name: npm audit (prod tree) through the gate
        run: |
          npm run audit:gate -- --selftest
          npm run audit:gate
      - name: no committed keypairs outside tests/localnet/fixtures
        run: |
          hits=$(git ls-files | grep -E '(-keypair|keypair|id)\.json$' | grep -v '^tests/localnet/fixtures/' || true)
          if [ -n "$hits" ]; then echo "::error::keypair files committed:"; echo "$hits"; exit 1; fi

  # ---------------------------------------------------------------- nightly / manual (need devnet keys — T-D-03/04)
  e2e-devnet:
    name: nightly · devnet smoke (T-D)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - name: devnet reachability + program accounts (read-only; needs DEVNET_RPC_URL)
        env:
          RPC: ${{ secrets.DEVNET_RPC_URL }}
        run: |
          if [ -z "$RPC" ]; then echo '::notice::DEVNET_RPC_URL not set — devnet smoke skipped (T-D-03/T-D-04 pending)'; exit 0; fi
          for id in GCRhrg6mc7zH1VdXG5rX3tQEpgu8Gptf27vdsJGV7G8q GCA2aUeX7ZFbGz3zvjqvsbjD1G3QjWxLhBpK5jwwPdcz GCuGx7fnLcKnw1NWU4dLzQvnJWggMVniQ4u7EuMaQevA GCfERiohebYDJLtNwAZpGxudwbXRqnxmuTT413fkTYrM; do
            curl -sf "$RPC" -H 'content-type: application/json' -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getAccountInfo\",\"params\":[\"$id\",{\"encoding\":\"base64\"}]}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);console.log(process.argv[1], r.result&&r.result.value? "deployed ("+r.result.value.owner+")" : "NOT DEPLOYED")})' "$id"
          done
          # a full T-D pass (setup DRY_RUN + crank/oracle health) is wired once the devnet payer exists:
          DRY_RUN=1 ANCHOR_PROVIDER_URL="$RPC" npm run setup || echo '::warning::setup dry-run failed (expected until G-0 keys exist)'

  load-smoke:
    name: nightly · load smoke (LT-1 @ 10 %)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # A single API node will miss the 5 000 rps half of the profile — that is the point of the note in
    # scripts/load/README.md ("one node gives a lower bound, not a failed gate"), and why this is advisory
    # until a staging stand with two replicas + Redis exists (docs/09 §4.1–4.3).
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci --omit=dev
      - name: start the API (no chain, no ingest — LT-1 measures the read path)
        run: |
          PORT=8787 DB_PATH=$(mktemp -d)/lt.sqlite LOG_LEVEL=error API_INGEST=0 EVENT_BUS=off \
            nohup node --no-warnings=ExperimentalWarning --import tsx backend/src/serve.ts > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do sleep 1; curl -sf http://127.0.0.1:8787/healthz >/dev/null && break; done
          # /healthz (process) is the gate, not /readyz: readiness asks for projections, a fresh Pyth cache
          # and a bounded slot lag — none of which exist on a chainless load stand, and a 503 there is the
          # documented, correct answer. Print it so the log shows *why*, and prove a read route answers.
          echo "readyz (advisory on this stand): $(curl -s http://127.0.0.1:8787/readyz | head -c 200)"
          curl -sf http://127.0.0.1:8787/v1/packs | head -c 120 >/dev/null || { echo '::error::/v1/packs did not answer'; tail -40 /tmp/api.log; exit 1; }
      - name: session for the /me profile
        run: |
          node scripts/load/login.mjs > /tmp/cookie
          echo "K6_SESSION=$(cat /tmp/cookie)" >> "$GITHUB_ENV"
      - name: k6 LT-1 (10 % of the profile, 3 min plateau)
        run: |
          docker run --rm -i --network=host -v "$PWD:/s" \
            -e K6_BASE_URL=http://127.0.0.1:8787/v1 -e K6_SESSION="$K6_SESSION" \
            -e K6_READ_RPS=500 -e K6_RAMP_S=20 -e K6_PLATEAU_S=180 \
            grafana/k6:latest run /s/scripts/load/lt1.js
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: k6-lt1, path: k6-lt1.json, retention-days: 14, if-no-files-found: ignore }

  # LT-3: the indexer's recovery cost. `backend/test/replay.test.ts` proves a rebuild lands on the same
  # state as a live index; this job proves it is *cheap enough to be the answer* during an incident, on a
  # 250k-event deterministic history. Blocking at night (not on PRs — a fixture walk is ~1 min of CPU) and
  # with a floor ~18× under what the box measures, so a runner under load cannot flake it while an
  # accidental O(n²) in a projection handler does.
  replay:
    name: nightly · LT-3 indexer replay (250k events)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - name: rebuild throughput + projection invariants on a synthetic history
        env: { LT3_EVENTS: '250000', LT3_MIN_EVENTS_PER_S: '2000' }
        run: npm run load:lt3
      - name: the same history through the correctness tier (wider corpus than the PR gate)
        run: npm --prefix backend run test -- test/replay.test.ts
