# ── action pins (SEC-B50) ────────────────────────────────────────────────────────────────────────────
# Every `uses:` in this file is a full commit SHA. A tag (`@v4`) is a ref the action's owner can
# repoint at any commit they like — including one that reads `GITHUB_TOKEN` and the deploy secrets,
# which is the shape of the `tj-actions/changed-files` compromise — and this repository pins npm
# versions by `sha512`, base images by patch tag and Cargo deps by exact version precisely because
# "whatever the ref means today" is not a pin. Updating one is a deliberate edit: resolve the new
# tag, change the SHA *and* the inline comment, and `npm run workflows:check` will notice a
# disagreement. The same mapping is asserted in `tests/security/deploy-artifacts.test.ts`.
#   actions/checkout             v4.4.0   11d5960a326750d5838078e36cf38b85af677262 2026-07-16
#   actions/setup-node           v4.4.0   49933ea5288caeca8642d1e84afbd3f7d6820020 2025-04-02
#   actions/upload-artifact      v4.6.2   ea165f8d65b6e75b540449e92b4886f43607fa02 2025-03-19
# G-3 Devnet Soak Bot workflow
# Requirements (docs/06 §1.4 G-3):
#   - >= 10,000 packs purchased
#   - 0 abandoned/stale pending packs/fusions/battles
#   - crank p95 <= 20 seconds
#   - >= 500 fusions (>= 100 risky)
#   - >= 200 wager matches
#
# Production shape:
#   - Runs ONLY on the self-hosted runner (labels: self-hosted, g3-soak — see
#     docs/SELF_HOSTED_RUNNER.md). A 14-day soak cannot fit in a GitHub-hosted job
#     (6-hour cap), and the funded wallet key must never leave the runner host.
#   - The wallet comes from the SOAK_PRIVATE_KEY repository secret: base64 of the RAW
#     64-byte secret key. This workflow never creates a wallet and never relies on the
#     devnet faucet — 10,000 packs need 150-200 SOL, far beyond faucet limits.
#   - DEVNET_RPC_URL prefers the repository secret, then the rpc_url input, then the
#     public devnet endpoint (rate-limited — use a private RPC for real runs).
#   - Manual trigger only (workflow_dispatch). Scheduled smoke tests live in
#     g3-soak-nightly.yml; a soak must never start on push.
#
#   npm ci runs WITHOUT --omit=optional on purpose: the soak bot runs under tsx/esbuild,
#   whose platform binaries (@esbuild/*, @rollup/*) are optional dependencies — omitting
#   them makes `npm run load:soak-g3` fail on the runner with a missing native module.

name: G-3 Soak Test

on:
  workflow_dispatch:
    inputs:
      duration_hours:
        description: 'Soak duration in hours (336 = 14 days)'
        required: true
        default: '24'
        type: number
      target_packs:
        description: 'Target packs to purchase'
        required: true
        default: '1000'
        type: number
      concurrency:
        description: 'Number of concurrent workers'
        required: true
        default: '5'
        type: number
      rpc_url:
        description: 'Devnet RPC URL (empty = DEVNET_RPC_URL secret, then public devnet)'
        required: false
        default: ''
        type: string

jobs:
  soak:
    name: G-3 Soak Test
    runs-on: [self-hosted, g3-soak]
    # Self-hosted runners are not subject to the 6-hour GitHub-hosted cap; the timeout
    # still bounds a hung run: requested duration + 3 hours of slack.
    timeout-minutes: ${{ (inputs.duration_hours * 60) + 180 }}

    env:
      DEVNET_RPC_URL: ${{ secrets.DEVNET_RPC_URL || inputs.rpc_url || 'https://api.devnet.solana.com' }}
      SOAK_INTERVAL_MS: 1000
      SOAK_LOG_INTERVAL_MS: 60000

    outputs:
      g3_passed: ${{ steps.metrics.outputs.g3_passed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm run lock:integrity

      - name: Preflight — soak wallet
        env:
          SOAK_PRIVATE_KEY: ${{ secrets.SOAK_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SOAK_PRIVATE_KEY:-}" ]; then
            echo "ERROR: the SOAK_PRIVATE_KEY repository secret is not set."
            echo "It must be the base64 of the RAW 64-byte secret key of the funded soak wallet:"
            echo "  solana-keygen new --out-file soak-key.json"
            echo "  node -e \"console.log(Buffer.from(require('./soak-key.json')).toString('base64'))\""
            echo "(NOT base64 of the solana-cli JSON file — that encodes the JSON text and is rejected.)"
            exit 1
          fi
          node -e "
            const { Connection, Keypair, LAMPORTS_PER_SOL } = require('@solana/web3.js');
            (async () => {
              const kp = Keypair.fromSecretKey(Buffer.from(process.env.SOAK_PRIVATE_KEY, 'base64'));
              const c = new Connection(process.env.DEVNET_RPC_URL, 'confirmed');
              const bal = await c.getBalance(kp.publicKey);
              console.log('Soak wallet: ' + kp.publicKey.toBase58());
              console.log('Balance: ' + (bal / LAMPORTS_PER_SOL).toFixed(4) + ' SOL');
              console.log('RPC: ' + process.env.DEVNET_RPC_URL);
              if (bal < 1 * LAMPORTS_PER_SOL) {
                console.error('ERROR: soak wallet holds less than 1 SOL — fund it first (150-200 SOL for a 10K-pack run).');
                process.exit(1);
              }
            })().catch((e) => { console.error('Preflight failed: ' + e.message); process.exit(1); });
          "

      - name: Configure soak bot
        id: config
        run: |
          set -euo pipefail
          DURATION_DAYS=$(awk -v h="${{ inputs.duration_hours }}" 'BEGIN { printf "%.6f", h / 24 }')
          echo "duration_days=$DURATION_DAYS" >> "$GITHUB_OUTPUT"
          echo "SOAK_DURATION_DAYS=$DURATION_DAYS" >> "$GITHUB_ENV"
          echo "SOAK_TARGET_PACKS=${{ inputs.target_packs }}" >> "$GITHUB_ENV"
          echo "SOAK_CONCURRENCY=${{ inputs.concurrency }}" >> "$GITHUB_ENV"

      - name: Run soak bot
        id: soak
        env:
          PRIVATE_KEY: ${{ secrets.SOAK_PRIVATE_KEY }}
        run: |
          set -o pipefail
          echo "Starting G-3 Soak Bot..."
          echo "Duration: ${{ steps.config.outputs.duration_days }} days"
          echo "Target: ${SOAK_TARGET_PACKS} packs"
          echo "Workers: ${SOAK_CONCURRENCY}"
          # pipefail: the bot exits 1 when the G-3 gate FAILs — that must fail this job.
          npm run load:soak-g3 2>&1 | tee soak.log

      - name: Upload soak log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: g3-soak-log
          path: soak.log
          retention-days: 7

      - name: Parse metrics
        if: always()
        id: metrics
        run: |
          METRICS=$(grep -A 20 "FINAL G-3 SOAK METRICS" soak.log || echo "No metrics found")
          echo "metrics=$METRICS" >> "$GITHUB_OUTPUT"

          if grep -q "G-3 Gate: PASS" soak.log; then
            echo "g3_passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "g3_passed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Discord
        if: always() && secrets.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -sf -X POST "$DISCORD_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{\"content\":\"G-3 soak finished — gate: ${{ steps.metrics.outputs.g3_passed }} · duration: ${{ inputs.duration_hours }}h · target: ${{ inputs.target_packs }} packs · log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            || echo "Discord notification failed (non-fatal)"

      - name: Summary
        if: always()
        run: |
          echo "### G-3 Soak Test Results"
          echo ""
          echo "**Configuration:**"
          echo "- Duration: ${{ steps.config.outputs.duration_days }} days"
          echo "- Target Packs: ${SOAK_TARGET_PACKS}"
          echo "- Workers: ${SOAK_CONCURRENCY}"
          echo ""
          echo "**Metrics:**"
          echo "${{ steps.metrics.outputs.metrics }}"
          echo ""
          echo "**Result: ${{ steps.metrics.outputs.g3_passed == 'true' && 'PASS' || 'FAIL' }}**"

  validate:
    name: Validate G-3 Requirements
    needs: soak
    runs-on: ubuntu-latest
    if: ${{ needs.soak.result == 'success' && needs.soak.outputs.g3_passed == 'true' }}

    steps:
      - name: Check G-3 gate passed
        run: |
          echo "G-3 Soak Test: PASSED"
          echo "All requirements met:"
          echo "- >= 10,000 packs purchased"
          echo "- >= 500 fusions (>= 100 risky)"
          echo "- >= 200 wager matches"
          echo "- 0 abandoned/stale pending"
          echo "- crank p95 <= 20s"
