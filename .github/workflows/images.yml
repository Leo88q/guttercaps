# ── action pins (SEC-B50) ────────────────────────────────────────────────────────────────────────────
# Every `uses:` in this file is a full commit SHA. A tag (`@v4`) is a ref the action's owner can
# repoint at any commit they like — including one that reads `GITHUB_TOKEN` and the deploy secrets,
# which is the shape of the `tj-actions/changed-files` compromise — and this repository pins npm
# versions by `sha512`, base images by patch tag and Cargo deps by exact version precisely because
# "whatever the ref means today" is not a pin. Updating one is a deliberate edit: resolve the new
# tag, change the SHA *and* the inline comment, and `npm run workflows:check` will notice a
# disagreement. The same mapping is asserted in `tests/security/deploy-artifacts.test.ts`.
#   actions/checkout             v4.4.0   11d5960a326750d5838078e36cf38b85af677262 2026-07-16
#   actions/setup-node           v4.4.0   49933ea5288caeca8642d1e84afbd3f7d6820020 2025-04-02
#   actions/upload-artifact      v4.6.2   ea165f8d65b6e75b540449e92b4886f43607fa02 2025-03-19
# Publishes the three deploy images to GHCR and pins what was published in ops/deploy/images.env
# (ops/deploy/runbook.md §1.2, docs/09 §4.1 «registry»). ci.yml proves the code is correct; this workflow is
# what makes it deployable: a host that has to `npm run ops:build` first is a host where the deploy and the
# review end up being of two different artifacts.
#
# Two things this does NOT do, on purpose:
#   * it does not invent build values. The required ones are read out of the compose file by
#     `npm run ops:buildenv` (scripts/deploy-build-env.ts), which lists every problem and writes nothing on
#     failure. Set them as repository variables — the names are exactly the keys of ops/deploy/.env.example.
#     On a repo whose program ids are still the dev placeholders, only `cluster: devnet` builds.
#   * it does not build for arm64. The compose file is a single-host amd64 deploy; a second architecture
#     doubles the publish time and the surface for images nobody runs.
#
# Integrity is the digest in images.env, not a build attestation (buildx provenance is not wired — recorded
# in docs/09 §4.1 as a remaining step for whoever owns the registry). One owner action before the first
# pull: make the GHCR packages public or hand the host a read token. Package visibility is a separate
# setting from repo visibility, and the failure it produces looks like an auth bug, not a settings one.
name: images

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'ops/deploy/**'
      - 'ops/backup/**'
      - 'backend/**'
      - 'client/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.dockerignore'
      - '.github/workflows/images.yml'
  workflow_dispatch:
    inputs:
      cluster:
        description: 'cluster to bake into the client bundle'
        type: choice
        default: mainnet-beta
        options: [mainnet-beta, devnet]
      publish:
        description: 'push to GHCR and record the pin (off = build and check only)'
        type: boolean
        default: true

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # the images.env commit back to main
  packages: write # the GHCR push

env:
  REGISTRY: ghcr.io
  NODE_VERSION: 22
  CI: 1
  # Not secrets: an RPC URL for the browser and public addresses. A keypair is a secret and nothing here
  # touches one — compose's `${VAR:?}` markers decide which of these the build requires, and this file does
  # not restate that list (that is what `ops:buildenv` reads out of compose).
  VITE_SOLANA_RPC: ${{ vars.VITE_SOLANA_RPC }}
  PROGRAM_CHIP_CORE: ${{ vars.PROGRAM_CHIP_CORE }}
  PROGRAM_MARKET: ${{ vars.PROGRAM_MARKET }}
  PROGRAM_STAKING: ${{ vars.PROGRAM_STAKING }}
  PROGRAM_ARENA: ${{ vars.PROGRAM_ARENA }}
  CG_MINT: ${{ vars.CG_MINT }}
  USDC_MINT: ${{ vars.USDC_MINT }}
  SKR_MINT: ${{ vars.SKR_MINT }}
  LOOKUP_TABLE: ${{ vars.LOOKUP_TABLE }}
  TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
  VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}

jobs:
  images:
    name: build · push · pin — api, client, backup
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci

      - name: plan the tags
        id: plan
        run: |
          set -euo pipefail
          base="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          tag="sha-$(git rev-parse --short=12 HEAD)"
          publish=true
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${{ inputs.publish }}" == "false" ]]; then
            publish=false
          fi
          # A git tag is the release, so it also gets `vX.Y.Z`; `latest` follows main only. "latest" meaning
          # "whatever was published last by hand" is how a moving tag becomes the thing people deploy.
          refs=("$tag")
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == refs/tags/v* ]]; then refs+=("$GITHUB_REF_NAME"); fi
          if [[ "$publish" == "true" && "${GITHUB_REF}" == refs/heads/main ]]; then refs+=("latest"); fi
          {
            echo "base=$base"
            echo "tag=$tag"
            echo "publish=$publish"
            echo "refs=${refs[*]}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Images"
            echo
            echo "publish=\`$publish\`, cluster \`${{ inputs.cluster || 'mainnet-beta' }}\`, tags \`${refs[*]}\`"
            echo
            echo "for each of \`guttercaps-api\`, \`guttercaps-client\`, \`guttercaps-backup\` under \`$base\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: assemble the build env from compose (it refuses to guess)
        env:
          CLUSTER: ${{ inputs.cluster || 'mainnet-beta' }}
        run: |
          set -euo pipefail
          # SEC-F05: a mainnet image is refused while Anchor.toml's [programs.mainnet] still carries the
          # pre-ceremony placeholder ids (ops:buildenv checks the vars; this checks the tree they came from).
          if [[ "$CLUSTER" == "mainnet-beta" ]]; then npm run program-ids -- guard-mainnet; fi
          npm run ops:buildenv -- --cluster "$CLUSTER" --out /tmp/build.env
          {
            # The refs the push will use, in the same file compose reads: `compose build` then tags the image
            # with its registry name directly, so no `docker tag` step exists to drift away from the digest
            # that was just pushed.
            echo "API_IMAGE=${{ steps.plan.outputs.base }}/guttercaps-api:${{ steps.plan.outputs.tag }}"
            echo "CLIENT_IMAGE=${{ steps.plan.outputs.base }}/guttercaps-client:${{ steps.plan.outputs.tag }}"
            echo "BACKUP_IMAGE=${{ steps.plan.outputs.base }}/guttercaps-backup:${{ steps.plan.outputs.tag }}"
            # compose resolves every service's config — including the api service's `secrets:` file — before
            # it builds anything. A build has no use for a keypair, so the path points at an empty file that
            # .dockerignore keeps out of every image anyway (`**/*-keypair.json`, `ops/deploy/secrets`).
            echo "CRANK_KEYPAIR_PATH=/tmp/crank_keypair.placeholder.json"
          } >> /tmp/build.env
          printf '{}\n' > /tmp/crank_keypair.placeholder.json

      - name: build api, client, backup
        run: |
          set -euo pipefail
          base='${{ steps.plan.outputs.base }}'
          [[ -n "${base##ghcr.io/}" ]] || { echo "steps.plan.outputs.base is empty — the plan step did not emit it, and an unprefixed name pushes nothing to a registry"; exit 1; }
          docker compose -f ops/deploy/docker-compose.yaml --env-file /tmp/build.env build api client backup
          echo '--- what a deploy host would pull for these services ---'
          docker compose -f ops/deploy/docker-compose.yaml --env-file /tmp/build.env config --images
          # If a service is missing its `*_IMAGE` indirection, this lists an unprefixed local tag: the build
          # still succeeds, the push pushes nothing for it, and the host quietly builds its own.
          refs="$(docker compose -f ops/deploy/docker-compose.yaml --env-file /tmp/build.env config --images)"
          bad="$(printf '%s\n' "$refs" | grep -v '^'"${{ steps.plan.outputs.base }}"'/guttercaps-' || true)"
          if [[ -n "$bad" ]]; then
            echo "these images are not registry-prefixed, so they cannot be published from this run:"
            echo "$bad"
            exit 1
          fi

      - name: check the artifacts before anyone can pull them
        run: |
          set -euo pipefail
          base='${{ steps.plan.outputs.base }}'
          tag='${{ steps.plan.outputs.tag }}'
          [[ -n "$base" && -n "$tag" ]] || { echo "missing plan outputs (base=\"$base\" tag=\"$tag\")"; exit 1; }
          # The base image is pinned in the Dockerfile so a rebuild six months from now is the same binary
          # that was audited (docs/06 §4). Asserting a literal version here would pass the day someone
          # changes the ARG — so read the same source the build reads.
          pinned="$(sed -n 's/^ARG NODE_IMAGE=node:\([0-9][0-9.]*\).*/\1/p' ops/deploy/Dockerfile.api | head -1)"
          got="$(docker run --rm --entrypoint node "$base/guttercaps-api:$tag" -v | tr -d 'v[:space:]')"
          if [[ "$got" != "$pinned" ]]; then
            echo "api image runs node $got; Dockerfile.api pins node:$pinned"
            exit 1
          fi
          # A published image is world-readable: the deploy's `.env`, a keypair, or the client's sourcemaps
          # must not be in it. .dockerignore and the Dockerfile's strip step are the guards, and both are one
          # careless COPY away from not being.
          docker run --rm --entrypoint sh "$base/guttercaps-api:$tag" -ec '
            hits=$(find / -xdev \( -name "*.env" -o -name "*-keypair.json" -o -name "id.json" \) -not -name "*.env.example" -print 2>/dev/null || true)
            if [ -n "$hits" ]; then echo "the api image contains: $hits"; exit 1; fi
            if ! test -f /app/backend/src/main.ts; then echo "the api image is missing its sources"; exit 1; fi
            echo "api image ok"
          '
          docker run --rm --entrypoint sh "$base/guttercaps-client:$tag" -ec '
            if ! test -f /usr/share/nginx/html/index.html; then echo "no index.html in the client image"; exit 1; fi
            if find /usr/share/nginx/html -name "*.map" -print -quit | grep -q .; then echo "sourcemaps survived into a public image"; exit 1; fi
            if grep -rlq "BEGIN PRIVATE KEY" /usr/share/nginx/html 2>/dev/null; then echo "a private key string is inside the client bundle"; exit 1; fi
            echo "client image ok"
          '

      - name: push
        if: steps.plan.outputs.publish == 'true'
        run: |
          set -euo pipefail
          echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker compose -f ops/deploy/docker-compose.yaml --env-file /tmp/build.env push api client backup
          base='${{ steps.plan.outputs.base }}'
          tag='${{ steps.plan.outputs.tag }}'
          [[ -n "$base" && -n "$tag" ]] || { echo "missing plan outputs"; exit 1; }
          # The digest is recorded for the `sha-*` ref above; the other refs are aliases of those bytes, so a
          # moved `latest` can never point at something that was not pushed by this run.
          for extra in ${{ steps.plan.outputs.refs }}; do
            [[ "$extra" == "$tag" ]] && continue
            for svc in api client backup; do
              docker tag "$base/guttercaps-${svc}:$tag" "$base/guttercaps-${svc}:${extra}"
              docker push "$base/guttercaps-${svc}:${extra}"
            done
          done

      - name: pin the digests (ops/deploy/images.env)
        run: |
          set -euo pipefail
          base='${{ steps.plan.outputs.base }}'
          tag='${{ steps.plan.outputs.tag }}'
          [[ -n "$base" && -n "$tag" ]] || { echo "missing plan outputs (base=\"$base\" tag=\"$tag\") — a pin has to name exactly what was pushed"; exit 1; }
          {
            echo "# Pinned image refs for the deploy — written by .github/workflows/images.yml."
            echo "# A host that reads these three lines pulls exactly these bytes; the moving tags are for humans."
            echo "# `git revert` of this file is the rollback (ops/deploy/runbook.md §7)."
            echo "# Do not edit by hand: a digest nobody can reproduce from a registry is worse than no pin."
            echo "# source: ${{ github.sha }} on ${{ github.ref_name }}, $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for svc in api client backup; do
              img="$base/guttercaps-${svc}:$tag"
              digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$img" 2>/dev/null || true)"
              if [[ "$digest" != *"@sha256:"* ]]; then
                echo "no RepoDigests entry for $img — it was pushed to ghcr.io, or the name is not the pushed one"
                exit 1
              fi
              printf '%s_IMAGE=%s\n' "$(tr '[:lower:]' '[:upper:]' <<< "$svc")" "$digest"
            done
          } > /tmp/images.env
          cat /tmp/images.env
          if [[ '${{ steps.plan.outputs.publish }}' != 'true' ]]; then
            # A dry run pushed nothing, so there is no digest to record — `docker image inspect` would fail
            # with a message about names, and the honest statement is that the run checked the build only.
            echo "publish=false — no digests recorded, this run only proved the images build and pass the checks"
            exit 0
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == refs/tags/v* ]]; then
            # The gate that makes a release mean something: the tag has to carry the digests its own images
            # were published with. A mismatch is not a formatting problem — it is "the release you cut
            # deploys something else". HEAD here *is* the tag, and nothing is committed on a tag run.
            want="$(grep '_IMAGE=' /tmp/images.env | sort)"
            have="$(git show "HEAD:ops/deploy/images.env" 2>/dev/null | grep '_IMAGE=' | sort || true)"
            if [[ "$want" != "$have" ]]; then
              echo "the release tag points at different digests than this build produced:"
              diff <(printf '%s\n' "$have") <(printf '%s\n' "$want") || true
              echo "cut the tag from the commit whose ops/deploy/images.env records this build"
              exit 1
            fi
            echo "the tag carries these digests already"
            exit 0
          fi
          cp /tmp/images.env ops/deploy/images.env
          git diff --quiet -- ops/deploy/images.env && { echo "already pinned to these digests"; exit 0; }
          git add ops/deploy/images.env
          # [skip ci]: this workflow's paths filter includes ops/deploy/**, so committing without it would
          # publish an image, pin it, and trigger a publish of the pin, forever.
          git -c user.name='guttercaps-images[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "deploy: pin images for $(git rev-parse --short HEAD) [skip ci]"
          if [[ "${GITHUB_REF}" != refs/heads/main ]]; then
            echo "not main — the pin stays in this run's artifact (ops/deploy/images.env on ${GITHUB_REF})"
            exit 0
          fi
          git push -q origin "HEAD:${GITHUB_REF}"

      - name: publish the pin as an artifact (dry runs and non-main runs)
        if: always()
        run: |
          set -euo pipefail
          [[ -f /tmp/images.env ]] || { echo "no pin was produced (the run failed before the digests existed)"; exit 0; }
          {
            echo
            echo '### The pin this run produced'
            echo
            echo '```'
            cat /tmp/images.env
            echo '```'
            echo
            echo 'Deploy: `cat ops/deploy/images.env >> ops/deploy/.env && npm run ops:up` (runbook §1.2).'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: images-env-${{ github.sha }}
          path: ops/deploy/images.env
          if-no-files-found: ignore
          retention-days: 90
