[toolchain]
anchor_version = "0.31.1"
# Matches the toolchain `solanafoundation/anchor:v0.31.1` (the image ci.yml builds in) actually ships:
# `solana-cli 2.1.0 (src:c1080de4)`. Demanding a version the image does not have is not a stronger pin — it
# makes `anchor build` swap SDKs mid-run, and the swap took the rustup `solana` toolchain link with it
# (`info: uninstalling toolchain 'solana'`, then exit 1 with no compiler error). The runtime version of the
# cluster is an ops concern (ops/deploy), not a build-time one; SBF programs built against 2.1.0 run on any
# 2.1.x+ validator. `scripts/ci-anchor-build.sh` asserts this equality and fails by name if it drifts.
solana_version = "2.1.0"

[features]
resolution = true
skip-lint = false

# Program ids — managed ONLY by `npm run program-ids -- apply` (docs/09 §2; freeze record: programs/program-ids.json).
# Never `anchor keys sync`: it rewrites declare_id! from whatever keypair happens to be local.
[programs.localnet]
chip_core = "J68G8KrbLTSdi68LHr9Kkw1YbRRHv3uBPirWCd5Xt13V"
market    = "5skEmmhgFYn5xjHEdrcsiQ68kUg5kvhXKhjWTWSppjfo"
staking   = "Ewkbp7WpqbiJAu3ofEcTPinqnr5oH3e94YJDZFg1eSJn"
arena     = "DUTokrhWBYL7nJ9VbMy7bFELQFf8TN1tmvVpKLsskqD6"
# Switchboard stand-in — localnet ONLY (never in [programs.devnet]); id == chip_core::randomness::SB_PROGRAM_ID (feature `localnet`)
sb_mock   = "ApDh35vcLCxXc5ivaRGFhayn1HduJ9b2nXbfR6WMpVKH"

[programs.devnet]
chip_core = "J68G8KrbLTSdi68LHr9Kkw1YbRRHv3uBPirWCd5Xt13V"
market    = "5skEmmhgFYn5xjHEdrcsiQ68kUg5kvhXKhjWTWSppjfo"
staking   = "Ewkbp7WpqbiJAu3ofEcTPinqnr5oH3e94YJDZFg1eSJn"
arena     = "DUTokrhWBYL7nJ9VbMy7bFELQFf8TN1tmvVpKLsskqD6"

# Production ids (docs/09-production-readiness.md §2). They are identical to devnet on purpose: one
# cold keypair per program, held with the upgrade authority behind the Squads 3/5 + 48 h timelock,
# signs both clusters, so a verifiable build can be reproduced from either. `npm run economy:check`
# pins this section against declare_id!; `npm run program-ids -- check` additionally compares it with
# target/deploy/*-keypair.json, so `anchor keys sync` can never move an id out from under the client.
# REGENERATE THE IDS BEFORE MAINNET (see the script) — these four values are dev-derived placeholders.
# Machine gate: `npm run program-ids -- guard-mainnet` exits 1 until the freeze record (`programs/program-ids.json`,
# written at the id ceremony from the cold keypairs) carries these same ids with keypairPresent — not until mainnet
# differs from devnet/localnet, which is the healthy state here on purpose (SEC-F05).
[programs.mainnet]
chip_core = "J68G8KrbLTSdi68LHr9Kkw1YbRRHv3uBPirWCd5Xt13V"
market    = "5skEmmhgFYn5xjHEdrcsiQ68kUg5kvhXKhjWTWSppjfo"
staking   = "Ewkbp7WpqbiJAu3ofEcTPinqnr5oH3e94YJDZFg1eSJn"
arena     = "DUTokrhWBYL7nJ9VbMy7bFELQFf8TN1tmvVpKLsskqD6"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

# `anchor test` = build (--features localnet) + validator + this suite. The same specs also run
# without a validator on LiteSVM (`npm test`, needs target/deploy/*.so) — see tests/localnet/README.md.
[scripts]
test = "npm run test:validator"

# Local validator (docs/06 §3.5): clone Metaplex Core and the Pyth receiver
# program from mainnet. Switchboard On-Demand is deliberately NOT cloned — there
# is no TEE oracle on localnet, so `randomness_reveal` would never happen and the
# devnet queue key (EYiA…) does not even exist under the mainnet program id
# (SBond…; devnet uses Aio4…). Programs are built with `--features localnet`,
# which points SB_PROGRAM_ID at the tiny `sb_mock` program loaded at genesis
# (same discriminator/layout as RandomnessAccountData, instant `reveal(value)`).
[test]
startup_wait = 20000

[test.validator]
url = "https://api.mainnet-beta.solana.com"

[[test.validator.clone]]
address = "CoREENxT6tW1HoK8ypY1SxRMZTcVPm7R94rH4PZNhX7d"   # mpl-core

[[test.validator.clone]]
address = "rec5EKMGg6MxZYaMdyBfgwp4d5rB9T1VQH5pJv5LtFJ"    # pyth receiver

# Pyth SOL/USD ($150) + SKR/USD ($0.0174) PriceUpdateV2 fixtures under the receiver's owner. The SDK
# only checks `publish_time + 60 s ≥ now`, so a publish_time of 2100-01-01 never goes stale; the
# age-sensitive scenarios run on LiteSVM where the harness re-posts the account (helpers/pyth.ts).
[[test.validator.account]]
address = "2pJUfPsQfMgcKj2qRgR7v9FZ4aJ4fCpLY2G1rNyQfsaY"
filename = "tests/localnet/fixtures/pyth_sol_usd.json"

[[test.validator.account]]
address = "9AMCtV1SqA9LiVK55YdYkT7PyafpbjY955WVN9121jGv"
filename = "tests/localnet/fixtures/pyth_skr_usd.json"

# Mock Switchboard program (SEC-C1 localnet owner): programs/sb_mock, keypair
# tests/localnet/fixtures/sb_mock-keypair.json (copy it to target/deploy/sb_mock-keypair.json before
# `anchor build`, or run `npm run test:validator` which does it). Its id must equal
# chip_core::randomness::SB_PROGRAM_ID under `--features localnet`.
[[test.genesis]]
address = "ApDh35vcLCxXc5ivaRGFhayn1HduJ9b2nXbfR6WMpVKH"
program = "target/deploy/sb_mock.so"
