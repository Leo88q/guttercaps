[workspace]
resolver = "2"
members = [
  "programs/chip_core",
  "programs/market",
  "programs/staking",
  "programs/arena",
  # localnet-only Switchboard stand-in (tests/localnet); built with the rest, deployed only via [[test.genesis]]
  "programs/sb_mock",
]
# The v0.1 monolith lives in `legacy/chip-game`, NOT in `programs/`, and it is not a member.
# It used to be `programs/_legacy_chip_game` + `exclude = [...]`, which was enough for cargo and not
# enough for anchor: the CLI takes the list of programs to build from the directories under `programs/`,
# so it ran `cargo build-sbf` on the monolith anyway — and its own dependency set cannot be resolved at
# all (`anchor-lang ^0.30.1` wants solana-program ^1.17.3, `switchboard-v2 0.4` wants >=1.16,<1.17; one
# 1.x version cannot satisfy both). ci.yml run 75: `ERROR cargo_build_sbf] Failed to obtain package
# metadata`. A directory named `programs/` means "this must build"; an exclude in a manifest means
# "cargo need not resolve it". Those are two sources of truth, and the build follows the directory.

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
# SBF size experiment (see reports/SBF-SIZE-*.md): opt-level "s" trades a little speed for ELF size, and
# ProgramData rent is paid per byte, so this is the one profile knob with a direct SOL cost. Measured on the
# pinned CI toolchain, not assumed; overflow-checks stays on because it is a security property.
opt-level = "s"

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# The upstream mpl-core client also exposes indexer-only hooked/plugin-list
# helpers. They are omitted by the checked-in on-chain subset under vendor/ so
# SBF does not link its 4 KiB-overflowing registry conversion frame.
[patch.crates-io]
mpl-core = { path = "vendor/mpl-core" }
