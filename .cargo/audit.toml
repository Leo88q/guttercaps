# RustSec ignores for the `rust-security` job — `cargo audit --file Cargo.lock --deny warnings` in
# .github/workflows/ci.yml, run from the repo root, which is where cargo-audit looks for this file
# (`./.cargo/audit.toml`; the other location it accepts, `$CARGO_HOME/audit.toml`, is a machine this
# repo does not control and is deliberately not used).
#
# This file is an allow-list, not a loosening of the gate. `--deny warnings` still turns every
# unmaintained / unsound / yanked advisory into a non-zero exit, and this is the one place an advisory
# can be acknowledged. Three rules keep that honest, and `tests/security/supply-chain.test.ts`
# enforces them offline so a new `"RUSTSEC-…"` line cannot arrive quietly:
#   1. every ignored id carries its own comment line directly above it, and the id in that comment must
#      be the id that is ignored (a reason attached to the wrong advisory is worse than none);
#   2. the comment names crate@version, the advisory kind, the chain that pulls it in and why the fix
#      cannot be made here;
#   3. the comment ends in `re-check <date>` — an acceptance with an expiry is a decision that gets
#      re-made, which is the same contract `scripts/audit-gate.ts` (ACCEPTED) holds the npm tree to.
#
# What is NOT in this list matters as much. RUSTSEC-2026-0306 (`faster-hex` 0.10.0, `hex_decode_unchecked`
# AVX2 path reads past `src`) has a patched release, so it is a version bump in Cargo.lock — 0.10.1, whose
# registry entry switchboard-on-demand 0.13.0's `faster-hex ^0.10.0` admits and whose `rust_version`
# (1.61.0) is below the platform toolchain that reads the lock. An ignore there would have been a false
# green over a memory-corruption advisory. Everything below has no release to move to.
#
# Format of an entry comment: `# <id> · <crate>@<version> · <kind> · <reason> · re-check <YYYY-MM-DD>`.
[advisories]
ignore = [
  # RUSTSEC-2025-0141 · bincode@1.3.3 · unmaintained · the 1.x line is closed upstream (the advisory's own note: the team considers 1.3.3 complete) and it is the serialiser under anchor-lang 0.31.1, solana-program 2.3.0 and switchboard-on-demand 0.13.0; bincode 2.x is a different API that none of those crates accept, so the move belongs to the Anchor/Solana graph, not to a line here · re-check 2027-03-31
  "RUSTSEC-2025-0141",

  # RUSTSEC-2025-0161 · libsecp256k1@0.6.0 · unmaintained · one advisory covering both copies in the lock (one ignore entry is enough: cargo-audit matches by id). 0.6.0 is held by solana-secp256k1-recover 2.2.1, whose published manifest asks for `libsecp256k1 ^0.6`; 0.7.2 by switchboard-on-demand 0.13.0's `libsecp256k1 ^0.7.1`. Upstream is unmaintained and points at k256, a rewrite inside solana's own SDK, so a pin here cannot reach either copy · re-check 2027-03-31
  "RUSTSEC-2025-0161",

  # RUSTSEC-2024-0436 · paste@1.0.15 · unmaintained · arrives through rmp 0.8.14 (rmp-serde, via switchboard-on-demand); the crate was archived at 1.0.15 and the drop-in fork (`pastey`) is not what rmp or its holders resolve to — there is no patched release by construction · re-check 2027-03-31
  "RUSTSEC-2024-0436",

  # RUSTSEC-2026-0097 · rand@0.7.3 · unsound · held by libsecp256k1 0.6.0's `rand ^0.7`; the aliased-reference reseed needs the `log` feature, a custom logger that itself draws from `thread_rng`, and a reseed from inside that logger, and the patched lines start at 0.8.6 / 0.9.3 / 0.10.1 — the 0.7 line has no fix, so the move is inside the SDK · re-check 2027-03-31
  "RUSTSEC-2026-0097",
]
