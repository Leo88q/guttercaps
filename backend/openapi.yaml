    RolledChip: { type: object, properties: { rarity: { $ref: '#/components/schemas/Rarity' }, collection: { type: integer } } }
    RolledRarity: { type: object, properties: { rarity: { $ref: '#/components/schemas/Rarity' } } }
    PackVerificationBasis:
      type: object
