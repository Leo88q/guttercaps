openapi: 3.1.0
info:
  title: GUTTERCAPS API
  version: 0.2.0
  description: |
    Read-mostly API for the GUTTERCAPS client. Anything that moves value is a
    Solana transaction the client builds and signs itself; the API only
    supplies quotes, PDAs, Merkle proofs and projections.

    Auth: Sign-In-With-Solana (SIWS). `POST /auth/siws/nonce` → sign → `POST /auth/siws/verify` → HTTP-only cookie + CSRF token.
    The signed message's domain must be one of the API's `SIWS_DOMAINS` and carry `Issued At` within ±5 min.
    Rate limits (every endpoint may answer `429 rate_limited` with `Retry-After` and `RateLimit-Limit/Remaining/Reset/Policy`
    headers): reads 600/min/IP · mutations 60/min/session · `/auth/siws/nonce` 10/min/IP + 30/h/wallet · `/auth/siws/verify`
    20/min/IP · `/packs/quote` 30/min/session · `/services/claim`, `PUT /me/handle` 10/min/session + 40/min per IP /24 ·
    `POST /me/human` 6/min/session + 30/h per IP /24. JSON bodies ≤ 16 KB (`413`).
    All amounts are strings of integer base units (lamports / micro-USDC / micro-$CG) unless suffixed `Usd`.
servers:
  - url: https://api.guttercaps.gg/v1
  - url: http://localhost:8787/v1
tags:
  - { name: auth }
  - { name: me }
  - { name: packs }
  - { name: collections }
  - { name: market }
  - { name: fusion }
  - { name: arena }
  - { name: staking }
  - { name: quests }
  - { name: leaderboard }
  - { name: services }
  - { name: line, description: 'The Line — daily runs down the bowl (docs/16 §5)' }
  - { name: admin }
security:
  - cookieAuth: []

paths:
  /switchboard/health:
    get:
      security: []
      summary: Read-only Switchboard readiness, before creating a purchase or wager
      description: |
        Server reads the pinned queue and checks verified, fresh members against their live gateway health.
        Server-side SDK gateway discovery with on-chain fallback; merged live health is matched to the pinned queue.
        No wallet signature or transaction. Cached for five seconds; 12 requests/min/IP.
        A ready response is point-in-time availability, not a guarantee of later reveal or settlement.
      responses:
        '200':
          description: At least one eligible oracle is live
          content:
            application/json:
              schema:
                type: object
                required: [ready, checkedAt, genesis, program, queue, oracle, queueMembers, eligibleMembers, probes]
                properties:
                  ready: { type: boolean }
                  checkedAt: { type: string, format: date-time }
                  genesis: { type: string }
                  program: { $ref: '#/components/schemas/Pubkey' }
                  queue: { $ref: '#/components/schemas/Pubkey' }
                  oracle: { type: [string, 'null'] }
                  queueMembers: { type: integer }
                  eligibleMembers: { type: integer }
                  discovery:
                    type: object
                    properties:
                      ok: { type: boolean }
                      gatewayCount: { type: integer }
                      code: { type: string }
                  gatewayChecks:
                    type: array
                    items:
                      type: object
                      properties:
                        gateway: { type: [string, 'null'] }
                        source: { type: string, enum: [registry, on_chain] }
                        code: { type: string }
                  probes:
                    type: array
                    items:
                      type: object
                      properties:
                        oracle: { type: string }
                        gateway: { type: [string, 'null'] }
                        healthGateway: { type: [string, 'null'] }
                        directCode: { type: string }
                        healthy: { type: boolean }
                        code: { type: string }
        '503':
          description: No live oracle, RPC/cluster failure, or concurrency limit; no transaction submitted
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
        '429': { description: Rate limit; see Retry-After }
  # ------------------------------------------------------------------ auth
  /auth/siws/nonce:
    post:
      tags: [auth]
      security: []
      summary: Issue a SIWS nonce for a wallet
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [address], properties: { address: { $ref: '#/components/schemas/Pubkey' } } } } }
      responses:
        '200': { description: nonce, content: { application/json: { schema: { type: object, properties: { nonce: { type: string }, statement: { type: string }, expiresAt: { type: string, format: date-time } } } } } }
  /auth/siws/verify:
    post:
      tags: [auth]
      security: []
      summary: Verify signed SIWS message, start session
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [address, message, signature], properties: { address: { $ref: '#/components/schemas/Pubkey' }, message: { type: string }, signature: { type: string, description: base58 }, referrer: { $ref: '#/components/schemas/Pubkey' }, fingerprint: { type: string, minLength: 8, maxLength: 256, description: 'client device fingerprint (canvas-free, client/src/shared/lib/fingerprint.ts); the API stores only a salted hash — device dedupe, T-B-49' } } } } }
      responses:
        '200': { description: session, content: { application/json: { schema: { type: object, properties: { csrf: { type: string }, wallet: { $ref: '#/components/schemas/WalletProfile' } } } } } }
        '401': { description: 'siws_address | siws_nonce | siws_expired | siws_domain | siws_issued_at | siws_signature', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/logout:
    post: { tags: [auth], summary: End session, responses: { '204': { description: ok } } }

  # ------------------------------------------------------------------ me
  /me:
    get:
      tags: [me]
      summary: Profile, balances, pity, flags
      responses:
        '200': { description: profile, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
  /me/chips:
    get:
      tags: [me]
      summary: Inventory (projection of Core owner + ChipState)
      parameters:
        - { in: query, name: collection, schema: { type: integer, minimum: 0, maximum: 7 } }
        - { in: query, name: rarity, schema: { type: integer, minimum: 0, maximum: 8 } }
        - { in: query, name: status, schema: { type: string, enum: [free, staked, listed, locked, fusing] } }
        - { $ref: '#/components/parameters/cursor' }
        - { in: query, name: limit, schema: { type: integer, minimum: 0, maximum: 500, default: 200 } }
      responses:
        '200': { description: chips, content: { application/json: { schema: { $ref: '#/components/schemas/ChipPage' } } } }
        '400': { $ref: '#/components/responses/Error', description: 'bad_request — an unknown `status` used to be ignored (the unfiltered list came back), `collection`/`rarity` bound NaN into the WHERE clause (SEC-B2)' }
  /me/grid:
    get:
      tags: [me]
      summary: 8×9 collection grid — owned count per (collection, rarity) + completed sets
      responses:
        '200': { description: grid, content: { application/json: { schema: { type: object, properties: { cells: { type: array, items: { type: array, items: { type: integer } }, description: '[collection][rarity] → owned count' }, completedSets: { type: integer }, missingForSet: { type: array, items: { type: object, properties: { collection: { type: integer }, rarities: { type: array, items: { type: integer } } } } } } } } } }
  /me/activity:
    get:
      tags: [me]
      summary: Unified activity feed (pack opens, fusions, sales, claims, matches)
      parameters:
        - { $ref: '#/components/parameters/cursor' }
        - { in: query, name: limit, schema: { type: integer, minimum: 0, maximum: 200, default: 50 } }
      responses:
        '200': { description: feed, content: { application/json: { schema: { $ref: '#/components/schemas/ActivityPage' } } } }
        '400': { $ref: '#/components/responses/Error', description: 'bad_request — strict cursor/limit (SEC-B2)' }
  /me/referrals:
    get:
      tags: [me]
      summary: Referral dashboard — referees, counted real-revenue spend, $CG earned (root kind 4), per-referee cap left, welcome bonus
      description: 'Accrual rules: packages/economy REFERRAL + backend/src/referrals.ts (settled by the reward oracle from finalized, opened, SOL/USDC/SKR-paid purchases; device dedupe on both sides; per-referee lifetime cap).'
      responses: { '200': { description: summary, content: { application/json: { schema: { $ref: '#/components/schemas/ReferralSummary' } } } } }
  /me/pending:
    get:
      tags: [me]
      summary: In-flight commit-reveal operations (packs / fusions) with crank status
      responses:
        '200': { description: pending, content: { application/json: { schema: { type: object, properties: { packs: { type: array, items: { $ref: '#/components/schemas/PendingPack' } }, compressed: { type: array, items: { $ref: '#/components/schemas/CompressedSettlement' } }, fusions: { type: array, items: { $ref: '#/components/schemas/PendingFusion' } } } } } } }
  /me/packs/{nonce}/result:
    get:
      tags: [me]
      summary: Settlement result of one purchase (claims + registered assets) — the one-signature mode view
      description: |
        The opening page polls the ON-CHAIN claim accounts for progress (minted / registered /
        cancelled flags) and uses this endpoint for the one thing a claim account does not store —
        the registered Bubblegum leaf ids (`compressed_claims.asset`, projected from
        CompressedChipRegistered). Unlike /me/pending it answers for every purchase state, including
        `settled`. `claims` is empty while the purchase is still awaiting the oracle (never opened)
        or when the nonce is unknown to the caller's wallet.
      parameters: [{ in: path, name: nonce, required: true, schema: { type: string } }]
      responses:
        '200':
          description: result
          content:
            application/json:
              schema:
                type: object
                properties:
                  nonce: { type: string }
                  settlement:
                    type: object
                    nullable: true
                    properties:
                      nonce: { type: string }
                      totalClaims: { type: integer }
                      registeredClaims: { type: integer }
                      cancelledClaims: { type: integer }
                      status: { type: string, enum: [pending, settled, refunded] }
                  claims:
                    type: array
                    items:
                      type: object
                      properties:
                        claimNonce: { type: string }
                        packNo: { type: integer }
                        status: { type: string, enum: [pending, minted, registered, cancelled] }
                        asset: { type: string, nullable: true, description: 'Bubblegum leaf id once registered; null before that (or for cancelled claims)' }
                        collectionIdx: { type: integer, nullable: true }
                        rarity: { type: integer, nullable: true }
                        level: { type: integer, nullable: true }
                        gameIndex: { type: string, nullable: true, description: 'per-collection mint number (decimal u64), known from the mint' }
  /me/handle/check:
    get:
      tags: [me]
      summary: Is this handle free? (also returns the ref_hash to commit on-chain)
      description: |
        ref_hash = keccak256(0x00 ‖ kind:u8 ‖ wallet:32 ‖ lowercase(handle) utf8). The client passes it to
        chip_core::pay_service(kind=Handle|HandleChange, …). Reserved 120 s for the caller once checked, up
        to 5 live reservations per wallet (SEC-B18: beyond that the check answers without taking a hold).
      parameters: [{ in: query, name: handle, required: true, schema: { type: string, pattern: '^[a-zA-Z0-9_]{3,16}$' } }]
      responses:
        '200': { description: availability, content: { application/json: { schema: { type: object, properties: { available: { type: boolean }, reason: { type: string, enum: [taken, reserved, blocked, cooldown, invalid] }, kind: { type: integer, description: '0 first handle, 1 change' }, refHash: { type: string, description: 'hex, 32 bytes' }, priceUsdCents: { type: integer }, reservedUntil: { type: string, format: date-time } } } } } }
  /me/handle:
    put:
      tags: [me]
      summary: Claim a handle after paying on-chain (pay_service kind 0/1) — signature required
      description: |
        The indexer verifies the ServicePaid event in `signature`: buyer == caller, kind ∈ {0,1}, ref_hash matches
        keccak(kind ‖ wallet ‖ lowercase(handle)), payment not previously consumed. $CG payments are burned on-chain;
        SOL/USDC/SKR go to the treasury. Handle changes are limited to 1 per 30 days; released handles are quarantined 90 days.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [handle, signature], properties: { handle: { type: string, pattern: '^[a-zA-Z0-9_]{3,16}$' }, signature: { type: string } } } } } }
      responses: { '200': { description: ok }, '402': { description: payment not found / already consumed }, '409': { $ref: '#/components/responses/Error', description: 'handle_taken / handle_cooldown / same_handle — or payment_pending: the payment is confirmed but not yet finalized (SEC-M5); retry in ~30 s' } }
  /me/rider:
    put:
      tags: [me]
      summary: 'Wear a rider silhouette (docs/16 §4.6) — one of eight district figures plus a rim-light theme'
      description: |
        The rider is presentation only: no stats, no odds, no income. Two checks, both about the public
        board telling the truth — the silhouette must be one of the eight that exist, and the theme must be
        one the caller has actually paid for (entitlement kind 3). Wearing an unpaid theme is refused
        because the board would then advertise a purchase that never happened.
        Idempotent: repeating the same choice changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                silhouette: { type: integer, minimum: 0, maximum: 7, description: 'district index — which of the eight figures to wear' }
                theme: { type: string, nullable: true, description: 'profile theme id (economy PROFILE_THEMES); null = light the figure in its district colour' }
      responses:
        '200': { description: the rider as stored, content: { application/json: { schema: { $ref: '#/components/schemas/Rider' } } } }
        '400': { description: 'bad_silhouette — no such figure' }
        '403': { description: 'theme_not_owned — buy the theme in the shop first' }
  /me/achievements:
    get:
      tags: [me]
      summary: 'Achievements (docs/16 §4.7): progress toward each, and what has been claimed'
      description: |
        Progress is not stored — it is recomputed from tables the game already keeps (collection, wall
        slots and their history, tags, resolved matches, fusions, Floodgrid attempts, paid referrals), so
        an achievement can never drift from the state that earned it. Only the *claim* is stored.
      responses:
        '200': { description: achievements, content: { application/json: { schema: { $ref: '#/components/schemas/AchievementList' } } } }
  /me/achievements/{id}/claim:
    post:
      tags: [me]
      summary: 'Claim an earned achievement (docs/16 §4.7) — cosmetics and items only, never $CG'
      description: |
        Idempotent by refusal: a second claim answers 409 `already_claimed` rather than granting the
        reward twice, because a cosmetic handed out twice is not a cosmetic any more. The reward is
        granted as a regular entitlement (or as Floodgrid hints for the item reward), so every existing
        ownership check keeps working unchanged.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: 'achievement id, e.g. `set.first`' }
      responses:
        '200': { description: the achievement as stored, content: { application/json: { schema: { $ref: '#/components/schemas/AchievementClaim' } } } }
        '400': { description: 'unknown_achievement — no such id' }
        '409': { description: 'not_earned (target not reached) · already_claimed · set_not_completed (a banner needs a finished district)' }
  /me/line:
    get:
      tags: [me]
      summary: 'The Line (docs/16 §5.1): today’s bowl, runs left, today’s best and what it paid'
      description: |
        The layout is not sent: it is a pure function of `day` (same seed for everyone, computed by the
        shared `lineLayout` in packages/economy). The client builds it locally and compares `seed` — if it
        differs, the client is playing a different bowl than the server will verify against.
      responses:
        '200': { description: state, content: { application/json: { schema: { $ref: '#/components/schemas/LineState' } } } }
  /me/line/runs:
    post:
      tags: [me]
      summary: 'Submit a replay (docs/16 §5.1–5.2) — the server replays it and keeps only its own score'
      description: |
        The body carries the replay (a list of `[tick, action]` inputs) and nothing else that matters:
        any score the client sends is ignored. The server rebuilds the day's layout from the day index and
        re-runs the same simulation the client played, so a client that lies about its timing simply
        scores what its inputs are worth. Three runs a day are free; later ones need a credit bought for
        30 $CG (burned, `POST /me/line/runs/buy`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [day, inputs]
              properties:
                day: { type: integer, description: 'unix day index (today, or yesterday for a run started before midnight)' }
                inputs: { $ref: '#/components/schemas/LineReplay' }
      responses:
        '200': { description: the run as stored, content: { application/json: { schema: { $ref: '#/components/schemas/RunSubmit' } } } }
        '400': { description: 'bad_day (not today) · bad_replay (malformed, too long, tick out of range, unknown action)' }
        '402': { description: 'runs_exhausted — no free runs left and no credit' }
        '409': { description: 'run_credit_cap — the daily paid-run cap is reached' }
  /me/line/runs/buy:
    post:
      tags: [me]
      summary: 'Buy one extra run for 30 $CG (docs/16 §5.1) — $CG only, every coin is burned'
      description: |
        Same settlement as a Deep Flood attempt: the on-chain `pay_service` of kind `lineExtraRun` is
        found by signature, must be $CG and exactly 30 $CG, and is consumed exactly once. Other rails buy
        nothing here — the point of the price is the burn, not the revenue.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [day, signature]
              properties:
                day: { type: integer }
                signature: { type: string, description: 'transaction signature of the on-chain pay_service' }
      responses:
        '200': { description: credits, content: { application/json: { schema: { type: object, properties: { day: { type: integer }, credits: { type: integer } } } } } }
        '402': { description: 'payment_not_found · cg_burn_required (not $CG, or not exactly 30 $CG) · ref_hash_mismatch · payment_consumed' }
        '409': { description: 'run_credit_cap — the daily paid-run cap is reached' }
  /me/line/tournament:
    get:
      tags: [me]
      summary: 'Line tournament of the day (docs/16 §5.4): my entries, best run, rank, prize schedule'
      description: |
        The daily paid tournament of the Line. An entry costs 30 $CG (burned) per ATTEMPT —
        the credit is spent by a tournament run, not by the day — and the daily paid-run cap
        (5) is shared with extra runs. Prizes are board parts only: never $CG.
      responses:
        '200': { description: state, content: { application/json: { schema: { $ref: '#/components/schemas/TournamentState' } } } }
  /me/line/tournament/enter:
    post:
      tags: [me]
      summary: 'Enter the day’s tournament — one 30 $CG payment buys one attempt credit'
      description: |
        Same settlement as an extra run: the on-chain `pay_service` of kind `lineTournamentEntry`
        is found by signature, must be $CG and exactly 30 $CG, and is consumed exactly once.
        The ref-hash binds the payment to the day. The credit is spent by the next
        `tournament: true` run submission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [day, signature]
              properties:
                day: { type: integer, description: 'unix day index; must be today' }
                signature: { type: string, description: 'transaction signature of the on-chain pay_service' }
      responses:
        '200': { description: entries, content: { application/json: { schema: { type: object, properties: { day: { type: integer }, entries: { type: integer } } } } } }
        '400': { description: 'bad_day (not today) · bad_signature' }
        '402': { description: 'payment_not_found · cg_burn_required (not $CG, or not exactly 30 $CG) · ref_hash_mismatch · payment_consumed' }
        '409': { description: 'run_credit_cap — the daily paid-run cap is shared with extra runs' }
  /line/tournament/board:
    get:
      tags: [line]
      summary: 'Tournament board of a day (docs/16 §5.4): best tournament run per wallet, prize bands'
      parameters:
        - { name: day, in: query, required: false, schema: { type: integer, minimum: 0 }, description: 'unix day index; defaults to today' }
      responses:
        '200': { description: board, content: { application/json: { schema: { $ref: '#/components/schemas/TournamentBoard' } } } }
  /line/runs/{id}/replay:
    get:
      tags: [line]
      summary: 'Re-watch a run (docs/16 §5.5) — public, watch-only; inputs are wiped after 14 days, score stays'
      description: |
        The weekly board is public and a replay carries nothing but keystrokes, so watching
        one needs no wallet. `inputs` is empty once the 14-day sweeper has wiped it: the row
        keeps its score, and the board flags it with `hasReplay: false` so the UI offers no
        dead link.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: replay, content: { application/json: { schema: { $ref: '#/components/schemas/RunReplay' } } } }
        '404': { description: 'no such run' }
  /line/leaderboard:
    get:
      tags: [line]
      summary: 'Week’s board (docs/16 §5.5): best run per wallet this week'
      parameters:
        - { name: week, in: query, required: false, schema: { type: integer, minimum: 0 }, description: 'week index; defaults to the current one' }
      responses:
        '200': { description: board, content: { application/json: { schema: { $ref: '#/components/schemas/LineBoard' } } } }
  /me/services:
    get:
      tags: [me]
      summary: Owned entitlements (skins, themes, emotes, season pass, instant reveal…) and daily-cap status
      responses:
        '200': { description: entitlements, content: { application/json: { schema: { type: object, properties: { entitlements: { type: array, items: { $ref: '#/components/schemas/Entitlement' } }, dailyLeft: { type: object, additionalProperties: { type: integer } } } } } } }
  /me/pass:
    get:
      tags: [me]
      summary: Season-pass progress — XP, unlocked tier, claimed tiers (rewards follow economy PASS_TRACK)
      responses:
        '200': { description: state, content: { application/json: { schema: { $ref: '#/components/schemas/PassState' } } } }
        '503': { $ref: '#/components/responses/Error', description: 'no season yet' }
  /me/pass/claim:
    post:
      tags: [me]
      summary: Claim one unlocked pass tier as an entitlement (skin tiers take {asset} — an owned cap to paint)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [tier], properties: { tier: { type: integer, minimum: 1, maximum: 20 }, asset: { type: string } } } } } }
      responses:
        '200': { description: entitlement, content: { application/json: { schema: { $ref: '#/components/schemas/Entitlement' } } } }
        '402': { $ref: '#/components/responses/Error', description: 'no_pass — the season pass itself is a paid service' }
        '409': { $ref: '#/components/responses/Error', description: 'tier_locked / already_claimed / not_owner / set_not_completed' }
  /me/pack-perks:
    get:
      tags: [me]
      summary: Today's Limited-pack purchase perks (economy v3) — booster/day + XP tickets left
      responses:
        '200': { description: perks, content: { application/json: { schema: { $ref: '#/components/schemas/PackPerks' } } } }
  /me/pack-perks/xp-ticket:
    post:
      tags: [me]
      summary: Redeem one XP ticket on an owned chip (+100 XP above the daily cap; tickets expire at midnight UTC)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [asset], properties: { asset: { type: string } } } } } }
      responses:
        '200': { description: applied, content: { application/json: { schema: { type: object, properties: { asset: { type: string }, xp: { type: integer }, fromLevel: { type: integer }, toLevel: { type: integer } } } } } }
        '404': { $ref: '#/components/responses/Error', description: 'chip_not_found' }
        '409': { $ref: '#/components/responses/Error', description: 'no_ticket' }
  /me/human:
    get:
      tags: [me]
      summary: Proof-of-human state (Cloudflare Turnstile pass, T-B-49)
      description: |
        Quest and SKR rewards are only *settled* for wallets with a fresh pass (7 d); until then `/quests` items carry
        `ineligibleReason = human_check_required` and finished quests wait (nothing is zeroed). `required=false` when the
        deployment runs without Turnstile or the wallet is `trusted`. `siteKey` is what the widget needs.
      responses:
        '200': { description: state, content: { application/json: { schema: { $ref: '#/components/schemas/HumanStatus' } } } }
    post:
      tags: [me]
      summary: Verify a Turnstile token → 7-day pass
      description: |
        Rate limits: 6/min per session, 30/h per IP /24. Optionally re-sends the device fingerprint.
        The siteverify answer is checked, not just `success` (SEC-B5): the challenge must have been solved on one of
        `TURNSTILE_HOSTNAMES` and its `action` must equal `TURNSTILE_ACTION` (the widget sends `claim`), and a token
        older than `TURNSTILE_MAX_AGE_S` is refused — a public sitekey means anyone can mint a token for their own page.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string, maxLength: 2048 }, fingerprint: { type: string, minLength: 8, maxLength: 256 } } } } } }
      responses:
        '200': { description: verified, content: { application/json: { schema: { $ref: '#/components/schemas/HumanStatus' } } } }
        '400': { $ref: '#/components/responses/Error', description: 'turnstile_failed (details.errorCodes = siteverify error-codes)' }
        '503': { $ref: '#/components/responses/Error', description: 'human_check_unavailable — siteverify unreachable, retry' }
  /services:
    get:
      tags: [services]
      security: []
      summary: Catalogue of paid services (mirrors economy ServiceKind) with live quotes in every currency
      responses:
        '200': { description: catalogue, content: { application/json: { schema: { type: object, properties: { services: { type: array, items: { $ref: '#/components/schemas/Service' } }, solUsd: { type: number }, skrUsd: { type: number } } } } } }
  /services/claim:
    post:
      tags: [services]
      summary: Bind a paid ServicePaid event to an entitlement payload (skins → asset, theme id, emote pack id, …)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [signature, kind, payload], properties: { signature: { type: string }, kind: { type: integer }, payload: { type: object, additionalProperties: true, description: 'canonical JSON; keccak(kind ‖ wallet ‖ canonical(payload)) must equal ref_hash' } } } } } }
      responses: { '200': { description: entitlement, content: { application/json: { schema: { $ref: '#/components/schemas/Entitlement' } } } }, '402': { description: payment not found / mismatch }, '409': { $ref: '#/components/responses/Error', description: 'not_owner — or payment_pending: the payment is confirmed but not yet finalized (SEC-M5); retry in ~30 s' } }

  # ------------------------------------------------------------------ skate city: tags (docs/16 §3.2–3.3)
  /tags:
    post:
      tags: [tags]
      summary: Save a tag (user-generated SVG) — rebuilt server-side, never trusted as received
      description: |
        The body is one `svg` string. The server parses it and rebuilds a new document from `<path>`
        and `<image href="/art/skate/stencil-*.webp">` elements only: no scripts, no event handlers,
        no external URLs, fills removed, colours restricted to `#rrggbb`. Limits are the ones the
        editor already shows (docs/16 §3.2): 400 path commands, 24 KB after rebuild.
        Post-moderation (§3.3) — the tag is `live` at once and a person reviews it only if reported.
        Saving the same SVG twice from one wallet returns the existing row instead of a new one.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [svg], properties: { svg: { type: string, maxLength: 196608 } } } } } }
      responses:
        '200': { description: saved (or the identical tag you already had), content: { application/json: { schema: { $ref: '#/components/schemas/Tag' } } } }
        '400': { $ref: '#/components/responses/Error', description: 'tag_empty | tag_forbidden | tag_bad_path | tag_bad_color | tag_too_many_commands | tag_bad_image — the auto-filter refused the payload' }
        '413': { $ref: '#/components/responses/Error', description: 'tag_too_large — more than 24 KB once rebuilt' }
        '429': { $ref: '#/components/responses/Error', description: 'tag_rate — at most 5 tags per hour per wallet' }
  /me/tags:
    get:
      tags: [tags]
      summary: My tags, newest first — every status, including hidden ones (§3.3 the author always sees their own)
      responses:
        '200': { description: my tags, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Tag' } } } } } } }
  /tags/{id}:
    get:
      tags: [tags]
      security: []
      summary: One tag by id — hidden and removed tags answer 404 to everyone but the author
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{32}$' }
          description: tag id (sha256 of wallet and content hash, first 32 hex chars)
      responses:
        '200': { description: the tag, content: { application/json: { schema: { $ref: '#/components/schemas/Tag' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /tags/{id}/report:
    post:
      tags: [tags]
      summary: Report a tag — one report per wallet per tag, then a person decides within 24 h
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{32}$' }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, enum: [hate, violence, sexual, ads, personal_data, other] } } } } } }
      responses:
        '200': { description: counted, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, reports: { type: integer } } } } } }
        '404': { $ref: '#/components/responses/Error', description: 'not_found — no live tag with that id' }
        '409': { $ref: '#/components/responses/Error', description: 'own_tag | already_reported' }
  /tags/{id}/appeal:
    post:
      tags: [tags]
      summary: Appeal a hidden tag — the note goes to the moderator, the decision stays with a person
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{32}$' }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [note], properties: { note: { type: string, maxLength: 500 } } } } } }
      responses:
        '200': { description: appeal recorded, content: { application/json: { schema: { $ref: '#/components/schemas/Tag' } } } }
        '409': { $ref: '#/components/responses/Error', description: 'not_hidden — only a hidden tag can be appealed' }
  /wall/board:
    get:
      tags: [wall]
      security: []
      summary: The board of the week — five tags from across the city, drawn, not ranked
      description: |
        Five tags picked by a draw, not by a rating. A rating on user content is a contest for a
        score, and here the score would be set by the report button — so reports are a *filter*, not
        a minus: a report the moderator confirmed (`hidden` / `removed`) keeps the tag off the board
        this week, an unresolved report changes nothing at all. An accusation is not a verdict, and
        that is precisely why pressing "report" cannot move anyone's place.

        Candidates are the tags hanging on a wall live at draw time, minus any tag that was already
        on the board in the last four weeks (a soft rule: if the city is too small to fill the board
        without repeats, repeats are allowed — an empty showcase is worse). The draw itself is
        unweighted and without replacement; a tag has no weight, only a stake does, and stakes are
        not involved.

        Seed: `sha256(wall-board:v1:week:slot:tagsHash:candidates)`, where `slot` is the finalized
        horizon at draw time and `tagsHash` is the sha256 of the sorted `district:slot:tagId` lines.
        The board is frozen for the week — a tag taken down later does not rewrite Monday's board —
        and both the seed and the full candidate snapshot are returned, so anyone can recompute the
        five. Without `week` this is the current week, drawn lazily on first read.
      parameters:
        - name: week
          in: query
          required: false
          description: week index (Monday 00:00 UTC); omit for the current week
          schema: { type: integer, minimum: 0 }
      responses:
        '200': { description: the board, content: { application/json: { schema: { $ref: '#/components/schemas/WallBoard' } } } }
        '404': { $ref: '#/components/responses/Error', description: no_board — that week was never drawn }
  /wall/{district}:
    get:
      tags: [wall]
      security: []
      summary: The district wall — 200 slots, who holds them, and the paint layers under the fresh tags
      description: |
        Expired slots are swept on read (30-day fade, docs/16 §3.4), so a wall never shows a dead slot.
        Tags are not inlined: the client renders `/v1/tags/{id}/svg` in an `<img>`, which browsers cache
        and which has no script context. `layers` are the previous tags of a slot — the history the doc
        asks to show as layers of paint under the current one.
      parameters:
        - name: district
          in: path
          required: true
          schema: { type: integer, minimum: 0, maximum: 7 }
      responses:
        '200': { description: the wall, content: { application/json: { schema: { $ref: '#/components/schemas/WallView' } } } }
  /wall/{district}/claim:
    post:
      tags: [wall]
      summary: Claim a slot — requires 7 active days in a row and at least one staked cap (never money)
      description: |
        One slot per wallet per district. Claiming again with a different tag replaces the tag on your
        slot and restarts the 30-day fade (renewing a tag is free — docs/16 §3.4). A slot is picked
        automatically unless `slot` is free and requested.
      parameters:
        - name: district
          in: path
          required: true
          schema: { type: integer, minimum: 0, maximum: 7 }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [tagId], properties: { tagId: { type: string, pattern: '^[0-9a-f]{32}$' }, slot: { type: integer, minimum: 0, maximum: 199 } } } } } }
      responses:
        '200': { description: your slot, content: { application/json: { schema: { $ref: '#/components/schemas/WallSlot' } } } }
        '409': { $ref: '#/components/responses/Error', description: 'not_eligible (play 7 days / stake a cap) | wall_full' }
  /wall/{district}/renew:
    post:
      tags: [wall]
      summary: Extend your slot another 30 days — same activity requirement as claiming
      parameters:
        - name: district
          in: path
          required: true
          schema: { type: integer, minimum: 0, maximum: 7 }
      responses:
        '200': { description: your slot, content: { application/json: { schema: { $ref: '#/components/schemas/WallSlot' } } } }
        '409': { $ref: '#/components/responses/Error', description: 'not_eligible' }
  /wall/{district}/release:
    post:
      tags: [wall]
      summary: Take your tag down yourself — the slot joins the wall's paint history
      parameters:
        - name: district
          in: path
          required: true
          schema: { type: integer, minimum: 0, maximum: 7 }
      responses: { '200': { description: released, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } } }
  /me/wall:
    get:
      tags: [wall]
      summary: My slots and whether I currently qualify for one (the wall screen answers the button before it is pressed)
      responses:
        '200': { description: my wall, content: { application/json: { schema: { $ref: '#/components/schemas/MyWall' } } } }
  /crew/board:
    get:
      tags: [crew]
      summary: 'Crew board of the week (docs/16 §5.6): the five best members’ best runs, summed'
      description: |
        Only full crews are ranked: at least five members, at least five of them with a run this week.
        The score is a sum of five best runs, never of all ten — a bigger roster does not beat a better
        one by headcount alone (the rule lives in `crewWeekScore`, shared with the client and the program).
      parameters:
        - { name: week, in: query, required: false, schema: { type: integer, minimum: 0 }, description: 'week index; defaults to the current one' }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 }, description: 'rows to return (default 50)' }
      responses:
        '200': { description: board, content: { application/json: { schema: { $ref: '#/components/schemas/CrewBoard' } } } }
  /crew/month:
    get:
      tags: [crew]
      summary: 'Monthly crew contest (docs/16 §5.6): the week board summed over the month'
      description: |
        A calendar month; a crew's score is the sum of its weekly board scores of the
        weeks that STARTED in the month. The top 3 crews win the crew deck part of
        their wall district — cosmetics only, never $CG. Every member of the month's
        roster holds the part.
      parameters:
        - { name: month, in: query, required: false, schema: { type: integer, minimum: 202601 }, description: 'calendar month YYYYMM; defaults to the current one' }
      responses:
        '200': { description: board, content: { application/json: { schema: { $ref: '#/components/schemas/CrewMonthBoard' } } } }
  /crew/check:
    get:
      tags: [crew]
      summary: 'Check a crew name (docs/16 §5.6) and hold it for two minutes while the payment settles'
      description: |
        The same name model as handles: 3–16 chars `[a-zA-Z0-9_]`, case-insensitive uniqueness, the city
        blocklist, 30 days between renames and a 90-day quarantine for a released name. `kind` tells the
        client which `pay_service` to sign (14 charter, 15 rename) and `refHash` is what the payment must
        commit to — a payment for another name is rejected, not reinterpreted.
      parameters:
        - { name: name, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 32 } }
      responses:
        '200': { description: availability, content: { application/json: { schema: { $ref: '#/components/schemas/CrewCheck' } } } }
  /crew/charter:
    post:
      tags: [crew]
      summary: 'Charter a crew (docs/16 §5.6): $1.99 buys the name, the roster and the board — never the wall'
      description: |
        The payment (kind 14) is consumed exactly once and only for this name: `refHash` binds signature,
        wallet and payload. The wall segment that comes with the crew is allocated from the district's free
        segments, but holding it still takes the same activity as any slot (§3.4, decision 6) — there is no
        paid route to the wall. The captain is the chartering wallet; the roster starts at one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, district, signature]
              properties:
                name: { type: string, minLength: 3, maxLength: 16 }
                district: { type: integer, minimum: 0, description: 'district whose wall segment the crew paints' }
                signature: { type: string, description: 'transaction signature of the on-chain pay_service (kind 14)' }
      responses:
        '200': { description: the crew, content: { application/json: { schema: { $ref: '#/components/schemas/CrewView' } } } }
        '400': { description: 'invalid_name · bad_district' }
        '402': { description: 'payment_not_found · ref_hash_mismatch · payment_consumed' }
        '409': { description: 'already_in_crew · crew_taken · crew_reserved · crew_blocked · crew_cooldown · district_full' }
  /crew/rename:
    post:
      tags: [crew]
      summary: 'Rename a crew (docs/16 §5.6): captain only, $0.99, once per 30 days'
      description: |
        The old name goes into a 90-day quarantine, so a crew cannot drop a name and have a friend pick it
        up the next day. Only the captain pays and only the captain decides.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, signature]
              properties:
                name: { type: string, minLength: 3, maxLength: 16 }
                signature: { type: string, description: 'transaction signature of the on-chain pay_service (kind 15)' }
      responses:
        '200': { description: the crew, content: { application/json: { schema: { $ref: '#/components/schemas/CrewView' } } } }
        '400': { description: 'invalid_name' }
        '402': { description: 'payment_not_found · ref_hash_mismatch · payment_consumed' }
        '403': { description: 'not_captain' }
        '409': { description: 'no_crew · crew_taken · crew_reserved · crew_blocked · crew_cooldown' }
  /crew/join:
    post:
      tags: [crew]
      summary: 'Join a crew by invite code (docs/16 §5.6) — five to ten riders, one crew per wallet'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: 'eight-character invite code, case-insensitive' }
      responses:
        '200': { description: the crew, content: { application/json: { schema: { $ref: '#/components/schemas/CrewView' } } } }
        '400': { description: 'bad_code' }
        '404': { description: 'bad_code — no live crew with that invite code' }
        '409': { description: 'already_in_crew · crew_full' }
  /crew/leave:
    post:
      tags: [crew]
      summary: 'Leave a crew (docs/16 §5.6) — a departing captain hands the role to the longest-serving member'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  crew: { $ref: '#/components/schemas/CrewView', nullable: true }
                  captain: { type: string, nullable: true, description: 'new captain, when the departing wallet was one' }
        '409': { description: 'no_crew' }
  /crew/{name}:
    get:
      tags: [crew]
      summary: 'A crew’s public card (docs/16 §5.6): roster, week score, wall segment'
      description: |
        The invite code is returned only to members. `counts` says whether the crew is ranked this week
        (five members with a run); `counting` on a member says whether their run made the top five.
      parameters:
        - { name: name, in: path, required: true, schema: { type: string }, description: 'crew name (case-insensitive) or numeric crew id' }
      responses:
        '200': { description: the crew, content: { application/json: { schema: { $ref: '#/components/schemas/CrewView' } } } }
        '404': { description: 'no_crew' }
  /crew/{name}/report:
    post:
      tags: [crew]
      summary: 'Report a crew name (docs/16 §5.6) — the same moderation queue as tags, one report per reporter'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 280 }
      responses:
        '200':
          description: reported
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  crew: { type: integer }
                  reports: { type: integer, description: 'open reports against this crew' }
        '400': { description: 'bad_reason' }
        '404': { description: 'no_crew' }
        '409': { description: 'already_reported' }
  /me/crew:
    get:
      tags: [me]
      summary: 'The crew I ride with (docs/16 §5.6), or null'
      responses:
        '200': { description: the crew or null, content: { application/json: { schema: { $ref: '#/components/schemas/CrewView' }, nullable: true } } }
  /rig:
    get:
      tags: [rig]
      summary: My board — three exhibit slots and how many caps away the next one opens (docs/16 §4.3)
      description: |
        A slot holds a *reference* to a cap: nothing is burned, transferred or locked. Ownership is
        re-checked on every read, so a cap sold or consumed by a fusion simply leaves the slot empty —
        there is no cleanup step and no sale handler to forget. Rarity is visual only (decisions 1 and 3):
        the payload carries no weight, no chance, no yield.
      responses:
        '200': { description: my board, content: { application/json: { schema: { $ref: '#/components/schemas/RigView' } } } }
    put:
      tags: [rig]
      summary: Set or clear exhibit slots (and the public board switch) — idempotent
      description: |
        `slots` is the desired state of the listed slots; anything not listed stays as it is. `asset: null`
        empties the slot. The same cap cannot fill two slots — moving it clears the previous one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                slots:
                  type: array
                  items:
                    type: object
                    required: [slot]
                    properties:
                      slot: { type: integer, minimum: 0, maximum: 2, description: '0 deck, 1 and 2 grip' }
                      asset: { type: [string, 'null'], pattern: '^[1-9A-HJ-NP-Za-km-z]{32,44}$', description: 'null clears the slot' }
                public: { type: boolean, description: 'show this board on /rig/{wallet} (docs/16 §4.5)' }
      responses:
        '200': { description: the board after the change, content: { application/json: { schema: { $ref: '#/components/schemas/RigView' } } } }
        '403': { $ref: '#/components/responses/Error', description: not_your_chip }
        '409': { $ref: '#/components/responses/Error', description: 'slot_locked (collect 12 / 36 caps) | chip_in_use' }
  /rig/{wallet}:
    get:
      tags: [rig]
      security: []
      summary: Someone's public board (docs/16 §4.5) — 404 while the owner has not switched it on
      parameters:
        - name: wallet
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Pubkey' }
      responses:
        '200': { description: the board, content: { application/json: { schema: { $ref: '#/components/schemas/RigView' } } } }
        '404': { $ref: '#/components/responses/Error', description: rig_private }
  /me/board:
    get:
      tags: [me]
      summary: My board builder (docs/16 §4.2) — what is worn, what is earned, what the week pays
      description: |
        Parts are cosmetic and are *earned*, not bought: runs (§5.1), achievements (§4.7), crew contests
        (§5.6), quests and the season track. The shop sells bolt-on cosmetics only — a district set is
        closed by playing, otherwise «build your board» would mean «buy your board».
      responses:
        '200': { description: my board, content: { application/json: { schema: { $ref: '#/components/schemas/BoardView' } } } }
    put:
      tags: [me]
      summary: Bolt a part on or take it off — idempotent
      description: |
        `slots` is the desired state of the listed slots; anything not listed stays as it is. `part: null`
        returns the slot to the stock part — taking a part off never leaves a hole, the stock one is always
        there. Wearing a part you have not earned is a 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                slots:
                  type: array
                  items:
                    type: object
                    required: [slot]
                    properties:
                      slot: { $ref: '#/components/schemas/BoardSlotName' }
                      part: { type: [string, 'null'], description: 'null returns the slot to the stock part' }
      responses:
        '200': { description: the board after the change, content: { application/json: { schema: { $ref: '#/components/schemas/BoardView' } } } }
        '400': { $ref: '#/components/responses/Error', description: 'bad_slot | bad_part' }
        '403': { $ref: '#/components/responses/Error', description: part_not_owned }
  /board/{wallet}:
    get:
      tags: [board]
      security: []
      summary: Someone's built board (docs/16 §4.2) — 404 while the owner has not switched the showcase on
      description: |
        Only what is worn: the inventory stays private. The switch is the same one as the cap showcase
        (§4.5) — one «show my board» toggle for both screens.
      parameters:
        - name: wallet
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Pubkey' }
      responses:
        '200': { description: the built board, content: { application/json: { schema: { $ref: '#/components/schemas/BoardLoadout' } } } }
        '404': { $ref: '#/components/responses/Error', description: rig_private }
  /tags/{id}/svg:
    get:
      tags: [tags]
      security: []
      summary: The tag itself as an image — for <img>, not for innerHTML (no script context, cacheable)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{32}$' }
      responses:
        '200':
          description: the rebuilt SVG
          headers:
            Content-Security-Policy: { schema: { type: string }, description: "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:" }
          content: { image/svg+xml: { schema: { type: string } } }
        '404': { $ref: '#/components/responses/Error' }
  /mod/tags/queue:
    get:
      tags: [tags]
      summary: Moderation queue — live tags with reports, overdue first (admin allowlist; a moderator role is a later step)
      description: |
        Order: overdue first (oldest wait first), then by open report count. Sorting by count alone let a
        tag with five reports filed an hour ago outrank one report waiting three days — the 24 h SLA (§3.3)
        existed in the document but not in the queue. `hoursLeft` counts from the **oldest unresolved**
        report, so piling new reports on a tag cannot reset the clock.
      responses:
        '200':
          description: queue
          content:
            application/json:
              schema:
                type: object
                properties:
                  slaHours: { type: integer, description: reaction deadline in hours (docs/16 §3.3) }
                  items:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Tag'
                        - type: object
                          properties:
                            openReports: { type: integer }
                            oldestOpenAt: { type: [string, 'null'], format: date-time }
                            hoursLeft: { type: [number, 'null'], description: hours until the SLA expires; negative once overdue }
                            overdue: { type: boolean }
                            reasons: { type: array, items: { type: object, properties: { reason: { type: string }, n: { type: integer } } } }
                            appealNote: { type: [string, 'null'] }
                            appealAt: { type: [string, 'null'], format: date-time }
  /mod/tags/stats:
    get:
      tags: [tags]
      summary: Moderation SLA — reaction time and how many reports end in a tag being taken down
      description: |
        The §3.3 metric: "safe environment = retention" is unmeasurable without these two numbers.
        Median reaction time (not mean — one stuck ticket would drag it) and the share of resolved
        reports that ended with the tag hidden or removed.
      responses:
        '200':
          description: stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  slaHours: { type: integer }
                  openReports: { type: integer }
                  overdueReports: { type: integer }
                  medianReactionHours: { type: [number, 'null'] }
                  actionedShare: { type: [number, 'null'], description: share of resolved reports that hid or removed the tag, 0..1 }
                  tags:
                    type: object
                    properties: { live: { type: integer }, hidden: { type: integer }, removed: { type: integer } }
  /mod/tags/{id}:
    put:
      tags: [tags]
      summary: Hide, restore or remove a tag — the only moderation action that exists
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{32}$' }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [live, hidden, removed] }, note: { type: string, maxLength: 500 } } } } } }
      responses:
        '200': { description: new state, content: { application/json: { schema: { $ref: '#/components/schemas/Tag' } } } }
        '404': { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------------ packs
  /packs:
    get:
      tags: [packs]
      security: []
      summary: Catalog with live odds, floors, pity and caps (from GameConfig)
      responses:
        '200': { description: catalog, content: { application/json: { schema: { type: object, properties: { paramsVersion: { type: integer }, packs: { type: array, items: { $ref: '#/components/schemas/PackSku' } }, bundles: { type: array, items: { type: object, properties: { qty: { type: integer }, discountBps: { type: integer } } } } } } } } }
  /packs/quote:
    post:
      tags: [packs]
      summary: Price quote + everything needed to build buy_pack
      description: |
        Frozen FX checkout (SOL = $110, SKR = $0.016, USDC = $1). Amounts are the same integer formula as
        `chip_core::fx_sol_lamports` / `fx_skr_micro` / `fx_usdc_micro`. Pyth is not read; a stale feed must never
        503 a purchase. `maxLamports` is the exact SOL/SKR amount (0 for USDC/$CG). `priceUpdateAccount` is omitted.
        Bundle and SKR promo discounts stack additively, capped at 30 %. Pity and daily caps are per wallet.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [sku, qty, currency], properties: { sku: { type: integer, minimum: 0, maximum: 3 }, qty: { type: integer, minimum: 1, maximum: 25 }, currency: { type: string, enum: [SOL, USDC, CG, SKR] } } } } } }
      responses:
        '200': { description: quote, content: { application/json: { schema: { $ref: '#/components/schemas/PackQuote' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { description: sign-in required (pity and caps are per wallet) }
        '403': { $ref: '#/components/responses/Error', description: 'geo_blocked — randomised packs are not sold in this region (`GEO_GATE=shop`, `GEO_RESTRICT_COUNTRIES`; backend/src/geo.ts). The country comes from the edge header, never from the client. Only the purchase is gated: market, staking, arena and every read endpoint keep working.' }
        '409': { description: starter_claimed — one Starter per wallet }
        '429': { description: daily_cap — Limited 5 / day }
  /preorder:
    get:
      tags: [packs]
      security: []
      summary: Beta pre-sale campaign state (docs/preorder-beta.md)
      description: |
        While the game runs its devnet beta, a limited pack drop is sold for MAINNET SOL to the team's Squads
        multisig treasury; packs are granted on-chain (chip_core `grant_preorder_pack`) at mainnet launch.
        `active` is false once the campaign is switched off or the drop is reserved out. `remaining` counts
        packs not yet reserved (paid, granted or awaiting payment); `sold` = paid + granted; `granted` is what
        the chain has already delivered (PackGranted projection).
      responses:
        '200': { description: campaign, content: { application/json: { schema: { $ref: '#/components/schemas/PreorderCampaign' } } } }
  /preorder/intent:
    post:
      tags: [packs]
      summary: Reserve packs and get the payment instruction set
      description: |
        Creates an `intent` row and returns the exact payment data: the treasury address, the total in lamports
        and the memo `GC-PRE|<refId>` to attach. `offer` selects the single Limited pack or the founders chest
        of 4 packs. The intent expires after `intentTtlS` unless confirmed. Per-wallet caps are per offer.
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { qty: { type: integer, minimum: 1, maximum: 5 }, offer: { type: string, enum: [pack, chest] }, currency: { type: string, enum: [SOL, USDC, SKR], default: SOL } } } } } }
      responses:
        '200': { description: reserved, content: { application/json: { schema: { $ref: '#/components/schemas/PreorderIntent' } } } }
        '400': { $ref: '#/components/responses/Error', description: 'bad_qty' }
        '401': { description: sign-in required }
        '403': { $ref: '#/components/responses/Error', description: 'geo_blocked — same gate as /packs/quote' }
        '409': { $ref: '#/components/responses/Error', description: 'sold_out | wallet_cap' }
        '410': { $ref: '#/components/responses/Error', description: 'campaign_closed' }
  /preorder/confirm:
    post:
      tags: [packs]
      summary: Verify the buyer's MAINNET payment and mark the reservation paid
      description: |
        The buyer submits their payment transaction signature; the backend fetches it from MAINNET (finalized,
        regardless of the cluster this backend indexes) and checks a successful SOL transfer into the treasury
        of at least the reserved amount, attributed by the memo when present, else by the payer being the
        reserving wallet. Idempotent for the same (refId, signature). One payment can never credit two
        reservations (unique tx_sig).
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [refId, signature], properties: { refId: { type: integer }, signature: { type: string } } } } } }
      responses:
        '200': { description: the reservation, content: { application/json: { schema: { $ref: '#/components/schemas/PreorderItem' } } } }
        '400': { $ref: '#/components/responses/Error', description: 'bad_ref | bad_signature' }
        '401': { description: sign-in required }
        '403': { $ref: '#/components/responses/Error', description: 'not_yours' }
        '404': { $ref: '#/components/responses/Error', description: 'not_found | tx_not_found' }
        '409': { $ref: '#/components/responses/Error', description: 'already_granted | not_payable | already_confirmed' }
        '422': { $ref: '#/components/responses/Error', description: 'payment_tx_failed | payment_no_transfer | payment_amount_low | payment_memo_mismatch | payment_unknown_payer' }
  /preorder/me:
    get:
      tags: [packs]
      summary: The session wallet's reservations (newest first, capped at 50)
      responses:
        '200': { description: reservations, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/PreorderItem' } } } } } } }
        '401': { description: sign-in required }
  /preorder/registry:
    get:
      tags: [packs]
      security: []
      summary: Public audit snapshot — every paid/granted reservation (wallets not included) and the campaign state
      responses:
        '200': { description: snapshot, content: { application/json: { schema: { type: object, required: [campaign, rows], properties: { campaign: { $ref: '#/components/schemas/PreorderCampaign' }, rows: { type: array, items: { type: object, properties: { refId: { type: integer }, qty: { type: integer }, status: { type: string }, paidAt: { type: integer, nullable: true }, grantedAt: { type: integer, nullable: true } } } } } } } } }
  /prices:
    get:
      tags: [packs]
      security: []
      summary: Health of the price cache the API quotes from (what our Pyth pusher last posted and how old it is)
      responses:
        '200': { description: prices, content: { application/json: { schema: { type: object, properties: { maxAgeS: { type: integer, example: 60 }, alertAgeS: { type: integer, example: 45 }, feeds: { type: object, additionalProperties: { type: object, properties: { usd: { type: number }, account: { $ref: '#/components/schemas/Pubkey' }, publishTime: { type: string, format: date-time }, ageS: { type: integer }, confBps: { type: integer }, cachedAt: { type: string, format: date-time }, healthy: { type: boolean } } } } } } } } }
  /health:
    get:
      tags: [admin]
      security: []
      summary: Liveness of the indexer, the price cache, the crank queue, the on-chain pause state per program (SEC-H2) and the burn oracle (SEC-M1)
      responses:
        '200':
          description: health
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  lastSlot: { type: integer, description: newest indexed slot }
                  prices: { type: object, description: same shape as GET /prices }
                  crank: { type: object, properties: { pending: { type: integer }, stale: { type: integer }, settled: { type: integer }, closed: { type: integer }, abandoned: { type: integer }, headAgeS: { type: [integer, 'null'] }, healthy: { type: boolean } } }
                  paused:
                    type: object
                    description: latest PauseChanged per program (chip_core / staking / arena); absent key = never changed since genesis
                    additionalProperties: { type: object, properties: { paused: { type: boolean }, by: { $ref: '#/components/schemas/Pubkey' }, slot: { type: integer }, blockTime: { type: [integer, 'null'] } } }
                  finality:
                    type: object
                    description: SEC-M5 reconciler — how far the event log lags finalization; dropped (forked) transactions are evicted and projections rebuilt
                    properties:
                      assume: { type: boolean, description: FINALITY_ASSUME=1 dev shortcut (refused in production) }
                      pendingSignatures: { type: integer }
                      oldestPendingAgeS: { type: [integer, 'null'] }
                      lastFinalizedAt: { type: [string, 'null'], format: date-time }
                      healthy: { type: boolean, description: nothing waiting longer than 10 min }
                  burnOracle:
                    type: object
                    description: SEC-M1 keeper that feeds staking.report_burn from indexed burns (hourly)
                    properties:
                      lastSignature: { type: [string, 'null'] }
                      lastAmountMicro: { type: [string, 'null'] }
                      lastReportAgeS: { type: [integer, 'null'] }
                      reportedTotalMicro: { type: string }
                      pendingMicro: { type: string, description: finalized burns indexed but not yet reported (SEC-B29) }
                      pendingRows: { type: integer }
                      deferredMicro: { type: string, description: SEC-B29 — burns indexed above the finalized horizon; not reportable yet because a dropped transaction would have to be un-reported }
                      deferredRows: { type: integer }
                      healthy: { type: boolean, description: nothing material waiting or stuck behind finality, or a report within the last 3 intervals }
                  rewardOracle:
                    type: object
                    description: keeper that turns quest completions / match rewards / season payouts / referrals into Merkle roots (kinds 2 / 3 / 4 in $CG, 5 / 6 in SKR from the prize pool, 8 = fusion boosters delivered by CPI into chip_core)
                    properties:
                      lastPublishedAt: { type: [integer, 'null'], description: unix s }
                      finalizedHorizonSlot: { type: integer, description: "SEC-M5 / backlog 9 — settlement only counts on-chain events at or below this slot (the slot before the oldest unfinalized event)" }
                      pendingBatches: { type: array, items: { type: object, properties: { kind: { type: integer }, epoch: { type: integer }, budget: { type: string }, leaves: { type: integer }, last_error: { type: [string, 'null'] }, created_at: { type: integer }, ageS: { type: integer } } } }
                      unrootedMicro: { type: object, properties: { quests: { type: string }, pvp: { type: string }, referrals: { type: string } } }
                      unrootedBoosters: { type: object, description: 'backlog 27 — fusion boosters owed by quest completions that are not in a kind-8 item root yet (unit count)', properties: { count: { type: integer }, wallets: { type: integer } } }
                      unfundedRake: { type: object, description: "SEC-L5 — settled seasons whose 20 % wager-rake share is not yet recycled into slice_budget[3] by staking::fund_slice (retried every cycle)", properties: { seasons: { type: array, items: { type: integer } }, micro: { type: string } } }
                      skr: { type: object, description: "SKR prize-pool distribution (kinds 5 Seeker week / 6 season) — last period paid per kind and the settled seasons still waiting for a funded pool", properties: { lastSeekerWeek: { type: [object, 'null'], properties: { period_key: { type: string }, budget: { type: string }, wallets: { type: integer } } }, lastSeason: { type: [object, 'null'], properties: { period_key: { type: string }, budget: { type: string }, wallets: { type: integer } } }, unpaidSeasons: { type: array, items: { type: integer } } } }
                      healthy: { type: boolean, description: no pending batch (and no unrecycled season rake) older than 3 oracle intervals }
                  antifraud:
                    type: object
                    description: detector queue (backend/src/antifraud.ts) — signals are evidence for ops, nothing is banned automatically
                    properties:
                      openSignals: { type: object, additionalProperties: { type: integer }, description: open rows per kind (win_trading / wash_trade / quest_bot / multi_account) }
                      lastSignalAt: { type: [integer, 'null'], description: unix s }
                      paused: { type: integer, description: wallets with flags.rewardsPaused }
                      shadowBanned: { type: integer, description: wallets with flags.shadowBanned }
                  arena:
                    type: object
                    properties:
                      queued: { type: integer }
                      revealing: { type: integer }
                      unattributedResolves:
                        type: object
                        description: SEC-F06 canary — BattleResolved events (24 h) whose signature no battle-worker `matches` row claims (a resolve_battle this backend did not send). Mirrors the `arena_unattributed_resolves` gauge.
                        properties:
                          count: { type: integer }
                          sample:
                            type: array
                            maxItems: 5
                            items:
                              type: object
                              properties: { battle: { type: string }, signature: { type: string }, resolvedAt: { type: integer, nullable: true } }
  /packs/opens/{signature}:
    get:
      tags: [packs]
      summary: Result of a pack open (poll after reveal; WS pushes the same payload)
      parameters: [{ in: path, name: signature, required: true, schema: { type: string } }]
      responses:
        '200': { description: result, content: { application/json: { schema: { $ref: '#/components/schemas/PackOpenResult' } } } }
        '202': { description: not revealed yet, content: { application/json: { schema: { $ref: '#/components/schemas/PendingPack' } } } }
  /packs/verify:
    post:
      tags: [packs]
      security: []
      summary: Provably-fair verifier — recompute a pack result from its randomness bytes
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [signature], properties: { signature: { type: string } } } } } }
      responses:
        '200':
          description: |
            `recomputed` is the rarity sequence the emitted randomness produces under the published economy
            table (`assumed` records which table, whether a `ParamsChanged` predates the open, and the pity
            state); `onChain` is what the program minted; `matches` compares the two. Districts are **not**
            recomputed here — the pool (`collections_created` / featured district) is live chain state the read
            model does not hold, so `onChain[i].collection` is reported as-is and the client verifier (which
            reads the config account) is what checks them. A `note` explains any mismatch.
          content: { application/json: { schema: { type: object, properties: { randomnessAccount: { $ref: '#/components/schemas/Pubkey' }, rollHex: { type: string }, pityBefore: { type: integer }, effectiveOddsBps: { type: array, items: { type: integer }, description: 'odds the roll was drawn with — the SKU table after pity, or the voucher TEMPLATE odds (#28)' }, voucher: { type: [object, 'null'], properties: { template: { type: integer }, odds: { type: [array, 'null'], items: { type: integer } }, soulboundDays: { type: [integer, 'null'] } } }, recomputed: { type: array, items: { $ref: '#/components/schemas/RolledRarity' } }, onChain: { type: array, items: { $ref: '#/components/schemas/RolledChip' } }, matches: { type: boolean, description: 'the minted RARITY sequence follows from the randomness bytes under `assumed`' }, assumed: { $ref: '#/components/schemas/PackVerificationBasis' }, note: { type: string, description: 'present when something needs saying: mismatch, table change, unverifiable input' } } } } } 

  # ------------------------------------------------------------------ collections
  /collections:
    get:
      tags: [collections]
      security: []
      summary: All 8 districts with lore, art, element, mint stats, floor per rarity
      responses: { '200': { description: list, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Collection' } } } } } }
  /collections/{idx}/chips/{rarity}:
    get:
      tags: [collections]
      security: []
      summary: Chip archetype page (lore, art, supply, floor, recent sales)
      parameters:
        - { in: path, name: idx, required: true, schema: { type: integer } }
        - { in: path, name: rarity, required: true, schema: { type: integer } }
      responses: { '200': { description: archetype, content: { application/json: { schema: { $ref: '#/components/schemas/ChipArchetype' } } } } }
  /stats:
    get:
      tags: [collections]
      security: []
      summary: Global counters (landing page + ops)
      responses: { '200': { description: stats, content: { application/json: { schema: { $ref: '#/components/schemas/Stats' } } } } }
  /wallet/{address}/events:
    get:
      tags: [me]
      security: []
      summary: Raw indexed events mentioning a wallet (idempotent source-of-truth rows, newest first)
      parameters:
        # SEC-B36 (2026-09-27): the address is bound into a `LIKE` pattern in the query layer, so anything
        # that is not exactly a 32-byte base58 key is a 400 rather than a pattern (`%` used to answer with the
        # newest 200 events of the whole log, `_` made the feed a substring oracle, junk was a silent []).
        - { in: path, name: address, required: true, schema: { $ref: '#/components/schemas/Pubkey' }, description: base58-encoded 32-byte public key; anything else answers 400 `bad_pubkey` }
        # SEC-B2 (2026-09-26): a single decimal integer; `abc`/`1.5` used to reach SQL as a NULL LIMIT
        # (HTTP 500) and `-1` bypassed the cap entirely (SQLite reads a negative LIMIT as "no limit").
        - { in: query, name: limit, required: false, schema: { type: integer, minimum: 0, maximum: 200, default: 50 } }
      responses:
        '200': { description: events, content: { application/json: { schema: { type: object, properties: { events: { type: array, items: { $ref: '#/components/schemas/RawEvent' } } } } } } }
        '400': { $ref: '#/components/responses/Error', description: 'bad_request — `limit` is not a single non-negative integer, or `address` is not a 32-byte base58 key (SEC-B2, SEC-B36)' }
  /chips/{asset}/share:
    post:
      tags: [chips]
      summary: Mark a chip as shared from the inspector and return the deep link (docs/16 §2.2)
      description: |
        Records `inspect.share` so the rule-gate metric («share rate and sign-ups from shared links»)
        can be measured, and returns the relative deep link carrying the same `ref` parameter the
        referral program already uses — so a sign-up that arrives through a shared cap is attributed
        by the existing funnel, not by new plumbing.
      parameters: [{ in: path, name: asset, required: true, schema: { $ref: '#/components/schemas/Pubkey' } }]
      responses: { '200': { description: relative deep link, content: { application/json: { schema: { type: object, properties: { path: { type: string, example: '/chip/7xKQ…?ref=7xKQ…' } } } } } } }
  /chips/{asset}:
    get:
      tags: [collections]
      security: []
      summary: Single chip — state, owner, listing, provenance (pack/fusion event)
      parameters: [{ in: path, name: asset, required: true, schema: { $ref: '#/components/schemas/Pubkey' } }]
      responses: { '200': { description: chip, content: { application/json: { schema: { $ref: '#/components/schemas/ChipDetail' } } } }, '404': { $ref: '#/components/responses/Error' } }

  # ------------------------------------------------------------------ market
  /market/listings:
    get:
      tags: [market]
      security: []
      summary: Active listings with filters
      parameters:
        - { in: query, name: collection, schema: { type: integer } }
        - { in: query, name: rarity, schema: { type: integer } }
        - { in: query, name: rarityMin, schema: { type: integer } }
        - { in: query, name: levelMin, schema: { type: integer, minimum: 0 } }
        - { in: query, name: gridDepthMin, schema: { type: integer, minimum: 0, maximum: 5 }, description: 'Floodgrid: route passed this depth (docs/13)' }
        - { in: query, name: gridChargeMin, schema: { type: integer, minimum: 0, maximum: 3 }, description: 'Floodgrid: at least this many charge droplets' }
        - { in: query, name: gridHeart, schema: { type: string, enum: ['1'] }, description: 'Floodgrid: only 75/75 «Сердце паводка» chips' }
        - { in: query, name: currency, schema: { type: string, enum: [SOL, USDC, SKR] } }
        - { in: query, name: priceMaxUsd, schema: { type: number, minimum: 0 } }
        - { in: query, name: missingForMySet, schema: { type: boolean }, description: 'auth required; only chips that complete one of my sets' }
        # SEC-B3: `indexMin` / `indexMax` / `sort=index_asc` were documented and rendered in the UI
        # ("Low #") while doing nothing — the `chips` projection had no game index. Shape #27 projected
        # it (`chips.game_index`: compressed chips from `CompressedChipRegistered`, core `open_pack`
        # chips back-filled from `ChipState` by the crank), so the three are back in the contract and
        # are honoured. A chip whose number is not resolved yet (`index: null`) sorts last and is
        # *excluded* by a range filter — never treated as #0, which is a real chip of that collection.
        - { in: query, name: indexMin, schema: { type: integer, minimum: 0, maximum: 4294967295 }, description: 'mint number lower bound (`Name #N`)' }
        - { in: query, name: indexMax, schema: { type: integer, minimum: 0, maximum: 4294967295 }, description: 'mint number upper bound' }
        - { in: query, name: sort, schema: { type: string, enum: [price_asc, price_desc, newest, rarity_desc, index_asc], default: price_asc } }
        - { $ref: '#/components/parameters/cursor' }
        - { in: query, name: limit, schema: { type: integer, minimum: 0, maximum: 200, default: 60 } }
      responses:
        '200': { description: listings, content: { application/json: { schema: { $ref: '#/components/schemas/ListingPage' } } } }
        '400': { $ref: '#/components/responses/Error', description: 'bad_request / bad_sort / bad_currency — filters are integers in range, never silently ignored (SEC-B2/B3)' }
  /market/floor:
    get:
      tags: [market]
      security: []
      summary: Floor matrix 8×9 (USD-normalized) + 24 h volume; cached 30 s
      responses: { '200': { description: floors, content: { application/json: { schema: { type: object, properties: { asOf: { type: string, format: date-time }, solUsd: { type: number }, skrUsd: { type: number }, floors: { type: array, items: { type: array, items: { type: [number, 'null'] } } }, listedCount: { type: array, items: { type: array, items: { type: integer } } }, volume24hUsd: { type: number } } } } } } }
  /market/history:
    get:
      tags: [market]
      security: []
      summary: Sales history (per chip, archetype, or global)
      parameters:
        - { in: query, name: asset, schema: { $ref: '#/components/schemas/Pubkey' } }
        - { in: query, name: collection, schema: { type: integer, minimum: 0, maximum: 9 } }
        - { in: query, name: rarity, schema: { type: integer, minimum: 0, maximum: 8 } }
        - { $ref: '#/components/parameters/cursor' }
      responses:
        '200': { description: sales, content: { application/json: { schema: { $ref: '#/components/schemas/SalePage' } } } }
        '400': { $ref: '#/components/responses/Error', description: 'bad_request — filters must be integers in range (SEC-B2)' }
  /market/offers:
    get:
      tags: [market]
      summary: Offers made by me / received on my chips
      parameters: [{ in: query, name: direction, schema: { type: string, enum: [made, received] } }]
      responses: { '200': { description: offers, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Offer' } } } } } }

  # ------------------------------------------------------------------ fusion
  /fusion/recipes:
    get:
      tags: [fusion]
      security: []
      summary: All 8 recipes (rule, success %, fee, lock) — mirrors on-chain constants
      responses: { '200': { description: recipes, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Recipe' } } } } } }
  /fusion/plan:
    post:
      tags: [fusion]
      summary: Validate a material set, return success %, fee, result preview and accounts for `fuse`
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [materials], properties: { materials: { type: array, minItems: 3, maxItems: 3, items: { $ref: '#/components/schemas/Pubkey' } }, resultCollection: { type: integer }, useBooster: { type: boolean } } } } } }
      responses:
        '200': { description: plan, content: { application/json: { schema: { $ref: '#/components/schemas/FusionPlan' } } } }
        '422': { $ref: '#/components/responses/Error' }
  /fusion/suggest:
    get:
      tags: [fusion]
      summary: Auto-pick fusable triples from my inventory (never touches staked/listed/locked/set-critical chips)
      parameters: [{ in: query, name: protectSets, schema: { type: boolean, default: true } }]
      responses: { '200': { description: suggestions, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/FusionPlan' } } } } } }

  # ------------------------------------------------------------------ arena
  /arena/queue:
    post:
      tags: [arena]
      summary: Enter matchmaking with a squad + seed commit
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [squad, commit], properties: { squad: { type: array, minItems: 3, maxItems: 3, items: { $ref: '#/components/schemas/Pubkey' } }, commit: { type: string, description: 'hex sha256(nonce)' }, wagerCgMicro: { type: string } } } } } }
      responses:
        '200': { description: queued (or paired at once — `matchId` set), content: { application/json: { schema: { type: object, properties: { ticket: { type: string }, league: { type: integer }, squadPower: { type: integer }, synergy: { type: number }, estimatedWaitSec: { type: integer }, wsChannel: { type: string }, matchId: { type: [string, 'null'] } } } } } }
        '409': { description: chip busy (listed / fusing) or a match is still awaiting your reveal (`match_pending`) }
        '422': { description: bad squad (not 3 distinct owned chips, power < 400) or bad commit (not 32-byte hex); wagers go on chain (`wager_is_on_chain`) }
    delete: { tags: [arena], summary: Leave queue (no-op once matched), responses: { '204': { description: ok } } }
  /arena/matches/{id}/emotes:
    post:
      tags: [arena]
      summary: Throw an owned spray-tag (kind-4 emote pack) onto the match record — cosmetic only. One tag / 5 s per fighter, 100 per match.
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [emote], properties: { emote: { type: string } } } } } }
      responses:
        '200': { description: accepted, content: { application/json: { schema: { $ref: '#/components/schemas/MatchEmote' } } } }
        '400': { $ref: '#/components/responses/Error', description: 'bad_emote — unknown emote id' }
        '402': { $ref: '#/components/responses/Error', description: 'pack_required — buy the emote pack first' }
        '403': { description: not a player of this match }
        '429': { $ref: '#/components/responses/Error', description: 'slow_down — one tag every 5 s' }
  /arena/matches/{id}/reveal:
    post:
      tags: [arena]
      summary: Reveal the seed nonce (hex; sha256(nonce) must equal your commit). When both sides revealed the server resolves at once — seed = sha256(matchId ‖ nonceA ‖ nonceB ‖ serverSecret); a side that never reveals forfeits after ARENA_REVEAL_TIMEOUT_S (120 s)
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [nonce], properties: { nonce: { type: string, description: 'hex, 8..64 bytes' } } } } } }
      responses:
        '200': { description: accepted, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, status: { type: string, enum: [revealing, resolved, cancelled] }, matchId: { type: string }, resolved: { type: boolean }, winner: { type: string }, waitingFor: { type: string, enum: [a, b] }, xp: { type: integer, description: chip XP granted to this wallets squad from this match }, leveled: { type: integer, description: how many of this wallets squad caps promoted } } } } } }
        '400': { description: bad nonce / commit mismatch }
        '403': { description: not a player of this match }
        '409': { description: a different nonce was already revealed }
  /arena/matches/{id}:
    get:
      tags: [arena]
      security: []
      summary: Match record incl. seed derivation (nonces/seed hidden until both revealed; the season secret appears after the season ends). Wager battles are listed under their battle PDA once the resolver settled them.
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        '200': { description: match, content: { application/json: { schema: { $ref: '#/components/schemas/Match' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /arena/me:
    get:
      tags: [arena]
      summary: My rating, league, streak, daily rewarded matches left, wager battles
      responses: { '200': { description: state, content: { application/json: { schema: { $ref: '#/components/schemas/ArenaMe' } } } } }
  /arena/seasons/current:
    get:
      tags: [arena]
      security: []
      summary: Season timer, pool size, payout brackets, server-secret hash (and the previous season's revealed secret)
      responses: { '200': { description: season, content: { application/json: { schema: { $ref: '#/components/schemas/Season' } } } } }
  /arena/simulate:
    post:
      tags: [arena]
      security: []
      summary: Deterministic fight preview for the squad builder (no rewards; same engine as live). Each side is 3 asset keys or 3 `{collection, rarity, level}` specs.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [squadA, squadB], properties: { squadA: { type: array, items: { $ref: '#/components/schemas/FighterSpec' } }, squadB: { type: array, items: { $ref: '#/components/schemas/FighterSpec' } } } } } } }
      responses: { '200': { description: win probability + sample rounds, content: { application/json: { schema: { type: object, properties: { pWinA: { type: number }, powerA: { type: integer }, powerB: { type: integer }, fightPowerA: { type: integer }, fightPowerB: { type: integer }, synergyA: { type: number }, synergyB: { type: number }, leagueA: { type: integer }, leagueB: { type: integer }, elementEdges: { type: array, items: { type: string } }, sampleRounds: { type: array, items: { $ref: '#/components/schemas/Round' } } } } } } } }

  # ------------------------------------------------------------------ staking
  /staking/overview:
    get:
      tags: [staking]
      security: []
      summary: Pools (TVL, weight, today's budget), implied APY per tier, emission day stats
      responses: { '200': { description: overview, content: { application/json: { schema: { $ref: '#/components/schemas/StakingOverview' } } } } }
  /staking/me:
    get:
      tags: [staking]
      summary: My token stakes, chip stakes, pending rewards (ESTIMATE from indexed DayClosed budgets — the exact figure is the on-chain accumulator the client reads directly), set bonus status
      responses: { '200': { description: mine, content: { application/json: { schema: { $ref: '#/components/schemas/StakingMe' } } } } }
  /staking/estimate:
    post:
      tags: [staking]
      security: []
      summary: APY estimate for an amount/tier given current pool weight
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [amountCgMicro, tier], properties: { amountCgMicro: { type: string }, tier: { type: integer, minimum: 0, maximum: 3 } } } } } }
      responses:
        '200': { description: estimate, content: { application/json: { schema: { type: object, properties: { apyPct: { type: number }, dailyCgMicro: { type: string }, unlockAt: { type: string, format: date-time }, earlyExitPenaltyBps: { type: integer }, boostBps: { type: integer }, minStakeCgMicro: { type: string }, indicativeApyRange: { type: array, items: { type: number } }, emissionSource: { type: string, enum: [chain, schedule] } } } } } }
        '400': { $ref: '#/components/responses/Error' }
  /staking/pot:
    get:
      tags: [staking]
      security: []
      summary: Gutter Pot — weekly weighted raffle among chip stakers (10 Rare–Epic vouchers, template 4). Public; `me` is filled when a session cookie is present.
      responses: { '200': { description: pot, content: { application/json: { schema: { $ref: '#/components/schemas/GutterPot' } } } } }

  # ------------------------------------------------------------------ quests
  /quests:
    get:
      tags: [quests]
      summary: Active quests with my progress (counted from indexed events; reading this endpoint records today's login); eligibility reason (account age / paid pack / rewards paused)
      responses: { '200': { description: quests, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Quest' } } } } } }
  /quests/login:
    post:
      tags: [quests]
      summary: Record today's login explicitly (idempotent; `GET /quests` does it too)
      responses: { '200': { description: ok, content: { application/json: { schema: { type: object, properties: { day: { type: integer }, inserted: { type: boolean } } } } } } }
  /quests/visit:
    post:
      tags: [quests]
      summary: Record a partner-game check-in (NeuroForge / ARES-1 — separate apps, so the ping is the only evidence). Idempotent per day; whitelisted metrics only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [metric]
              properties:
                metric:
                  type: string
                  enum: [visit_neuroforge, visit_ares1]
                  description: which partner game was visited (one row per wallet/metric/day)
      responses: { '200': { description: ok, content: { application/json: { schema: { type: object, properties: { day: { type: integer }, inserted: { type: boolean } } } } } } }
  /quests/claims:
    get:
      tags: [quests]
      summary: My Merkle leaves (root, amount, proof) built by the reward oracle. `currency` follows the root kind — 2..4 pay $CG via `claim_root`, 5..7 pay SKR via `claim_skr_root`. `claimableAt` is null until the root is published on chain (then published_at + 1 h timelock).
      responses: { '200': { description: claims, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ClaimLeaf' } } } } } }
  /rewards/skr-pool:
    get:
      tags: [quests]
      security: []
      summary: SKR prize-pool ledger (funded / withdrawn / paid / reserved) and live SKR roots — public proof that SKR rewards never exceed treasury funding
      responses: { '200': { description: pool, content: { application/json: { schema: { $ref: '#/components/schemas/SkrPool' } } } } }
  /quests/streak:
    get:
      tags: [quests]
      summary: Daily streak state (consecutive days with all four $CG dailies done)
      responses: { '200': { description: streak, content: { application/json: { schema: { type: object, properties: { days: { type: integer, description: progress toward the next chip (wraps every 7 days) }, total: { type: integer, description: raw consecutive-day run }, nextChipAt: { type: integer }, resetsAt: { type: string, format: date-time }, todayDone: { type: boolean } } } } } } }


  /grid/me:
    get:
      tags: [grid]
      summary: Floodgrid state — backpack (hints/valves), wallet star bank, gifts, all chip routes (docs/13)
      responses:
        '200': { description: state, content: { application/json: { schema: { $ref: '#/components/schemas/GridMe' } } } }
  /grid/chip/{asset}:
    get:
      tags: [grid]
      summary: One chip's Floodgrid route (next sector, charge drops, per-level stars)
      parameters: [{ in: path, name: asset, required: true, schema: { type: string } }]
      responses:
        '200': { description: route, content: { application/json: { schema: { $ref: '#/components/schemas/GridChip' } } } }
        '404': { $ref: '#/components/responses/Error', description: 'Chip not found' }
  /grid/attempt:
    post:
      tags: [grid]
      summary: Start a Floodgrid attempt (training on the chip route or charge attempt on the next sector; seed committed server-side)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [asset], properties: { asset: { type: string }, level: { type: integer, minimum: 1, maximum: 75 }, mode: { type: string, enum: [training, charge] }, kind: { type: string, enum: [contract, deep, ghost], description: 'Phase-3 special attempt (docs/12): district contract (slot), Deep Flood (weekly, no hints), Ghost of the day (no hints)' }, slot: { type: integer, minimum: 0, maximum: 2 }, hintsUsed: { type: integer, minimum: 0, maximum: 1 } } } } } }
      responses:
        '200': { description: attempt, content: { application/json: { schema: { $ref: '#/components/schemas/GridAttempt' } } } }
        '400': { $ref: '#/components/responses/Error', description: 'bad args / second hint downgrades to training' }
        '409': { $ref: '#/components/responses/Error', description: 'Route order — sectors cannot be skipped' }
  /grid/complete:
    post:
      tags: [grid]
      summary: 'Submit the full move list (PlayProof); the server replays it with the same engine. Solved outside the move limit settles as a fail (−6 XP unless a valve was armed)'
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [attemptId, turns], properties: { attemptId: { type: string }, turns: { type: array, items: { type: array, items: { type: integer } }, maxItems: 512 }, useValve: { type: boolean } } } } } }
      responses:
        '200': { description: outcome, content: { application/json: { schema: { $ref: '#/components/schemas/GridComplete' } } } }
        '404': { $ref: '#/components/responses/Error', description: 'Unknown attempt' }
  /grid/fail:
    post:
      tags: [grid]
      summary: Give up a charge attempt (settles −6 XP unless a valve was armed)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [attemptId], properties: { attemptId: { type: string }, useValve: { type: boolean } } } } } }
      responses:
        '200': { description: outcome, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '404': { $ref: '#/components/responses/Error', description: 'Unknown attempt' }

  # ------------------------------------------------------------------ leaderboard
  /players/{wallet}/grid:
    get:
      tags: [grid]
      summary: Public Floodgrid diver showcase for a wallet (depth, stars, mastered chips, prestige, best ladder rank)
      parameters: [{ in: path, name: wallet, required: true, schema: { type: string } }]
      responses:
        '200': { description: showcase, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /grid/onboard:
    post:
      tags: [grid]
      summary: Record an onboarding funnel event for the Home first-sector card (shown/clicked/dismissed, one per wallet/day)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [event], properties: { event: { type: string, enum: [shown, clicked, dismissed] } } } } } }
      responses:
        '200': { description: recorded, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /grid/deep/buy:
    post:
      tags: [grid]
      summary: Buy one extra Deep Flood attempt for this week with a 30 $CG burn (pay_service kind 10, docs/12 phase 3)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [signature], properties: { signature: { type: string } } } } } }
      responses:
        '200': { description: credit, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '402': { $ref: '#/components/responses/Error', description: 'Payment missing, wrong rail or not exactly 30 $CG' }
        '409': { $ref: '#/components/responses/Error', description: 'Weekly paid-attempt cap reached or payment already used' }
  /grid/apply-skin:
    post:
      tags: [grid]
      summary: Apply an earn-only Floodgrid skin entitlement to one owned chip (one entitlement paints one cap)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [asset, skin], properties: { asset: { type: string }, skin: { type: string } } } } } }
      responses:
        '200': { description: applied, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '409': { $ref: '#/components/responses/Error', description: 'No unused entitlement for that skin' }

  /leaderboard/{board}:
    get:
      tags: [leaderboard]
      security: []
      summary: Season rating (arena Glicko-lite ladder) / chain-verified wager wins / collection score / staking weight / fusion count boards
      description: "`rating` is the server arena's ladder for one season (`season` defaults to the one open now; `league` is filled); `wins` counts resolved wager battles from the arena program. Shadow-banned wallets (ops flag) are hidden from every board but still get a `me` row."
      parameters:
        - { in: path, name: board, required: true, schema: { type: string, enum: [rating, wins, collection, staking, fusion, divers] } }
        - { in: query, name: season, schema: { type: integer, minimum: 0 }, description: rating board only; other boards ignore it }
        - { $ref: '#/components/parameters/cursor' }
        - { in: query, name: limit, schema: { type: integer, minimum: 0, maximum: 200, default: 50 } }
      responses:
        '200': { description: rows, content: { application/json: { schema: { $ref: '#/components/schemas/LeaderboardPage' } } } }
        '400': { $ref: '#/components/responses/Error', description: 'bad_season / bad_request — `season` and `cursor` are strict integers (SEC-B2)' }
        '404': { $ref: '#/components/responses/Error', description: unknown_board }

  # ------------------------------------------------------------------ admin (backend/src/admin.ts — docs/03 §3.5, T-B-46)
  # Gate: SIWS session whose wallet ∈ ADMIN_WALLETS (env allowlist) + CSRF on mutations; every call is written to
  # `admin_audit` (denials too). The service never signs: on-chain changes come back as encoded instructions for the
  # Squads multisig. 401 unauthenticated · 403 not allowlisted / bad CSRF.
  /admin/params:
    get:
      tags: [admin]
      summary: Live GameConfig + EmissionState (decoded from the chain), change history, guard-rails
      responses: { '200': { description: params, content: { application/json: { schema: { $ref: '#/components/schemas/AdminParams' } } } }, '401': { description: sign in }, '403': { description: not an admin }, '503': { description: config account missing on this cluster } }
    post:
      tags: [admin]
      summary: Validate a params change against the program guard-rails + economy invariants and encode `set_params` / `set_split` for the multisig (nothing is sent)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ParamsProposal' } } } }
      responses:
        '200': { description: proposal (instructions for Squads), content: { application/json: { schema: { $ref: '#/components/schemas/Proposal' } } } }
        '422': { description: guard-rail violation — `details` carries the full Proposal (violations / warnings / diff), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /admin/simulate:
    post:
      tags: [admin]
      summary: Run the docs/02 daily-flow model (packages/economy dailyFlows) with overridden assumptions / a hypothetical split
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { assumptions: { type: object, additionalProperties: { type: number }, description: partial FlowAssumptions (dau, payingShare, packsPerPayerPerWeek, …) }, year: { type: integer, minimum: 0, maximum: 7 }, splitBps: { type: array, items: { type: integer }, minItems: 5, maxItems: 5 } } } } } }
      responses: { '200': { description: report json, content: { application/json: { schema: { type: object, properties: { year: { type: integer }, assumptions: { type: object }, baseline: { $ref: '#/components/schemas/DailyFlows' }, scenario: { $ref: '#/components/schemas/DailyFlows' }, delta: { type: object, additionalProperties: { type: number } }, slices: { type: array, items: { type: object, properties: { name: { type: string }, bps: { type: integer }, cgPerDay: { type: integer } } } }, guard: { type: object, properties: { floorShare: { type: number }, burnMultiple: { type: number }, emissionAtZeroBurnCg: { type: integer } } }, packs: { type: array, items: { type: object, properties: { id: { type: string }, evCommonEq: { type: number }, pLegend: { type: number } } } }, rarityValueMult: { type: array, items: { type: number } } } } } } }, '422': { description: unknown / negative assumption } }
  /admin/kill-switch:
    post:
      tags: [admin]
      summary: Encode pause (hot pauser key, SEC-H2, needs a reason) or un-pause (admin-only → multisig) for chip_core / staking / arena
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [program, paused], properties: { program: { type: string, enum: [chip_core, staking, arena] }, paused: { type: boolean }, reason: { type: string, minLength: 8, description: required when paused = true } } } } } }
      responses: { '200': { description: instruction for the pauser / multisig, content: { application/json: { schema: { $ref: '#/components/schemas/Proposal' } } } }, '422': { description: bad program / missing reason } }
  /admin/preorders:
    get:
      tags: [admin]
      summary: Pre-sale registry — campaign state, the paid/granted audit snapshot and the on-chain delivery queue
      responses: { '200': { description: registry, content: { application/json: { schema: { type: object, required: [campaign, registry, queue], properties: { campaign: { $ref: '#/components/schemas/PreorderCampaign' }, registry: { type: object }, queue: { type: array, items: { type: object, required: [refId, beneficiary, sku, qty, nonce, lamports, txSig], properties: { refId: { type: integer }, beneficiary: { type: string }, sku: { type: integer }, qty: { type: integer }, nonce: { type: string }, lamports: { type: string }, txSig: { type: string } } } } } } } } } }
  /admin/preorders/drop:
    post:
      tags: [admin]
      summary: Encode init_preorder_drop / close_preorder_drop for the multisig (unsigned)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [action, admin], properties: { action: { type: string, enum: [open, close] }, admin: { type: string, description: base58 admin that will sign }, sku: { type: integer }, total: { type: integer }, maxPerWallet: { type: integer } } } } } }
      responses: { '200': { description: unsigned instruction, content: { application/json: { schema: { type: object, required: [ok, instructions, items], properties: { ok: { type: boolean }, instructions: { type: array, items: { type: object } }, items: { type: array, items: { type: object } } } } } } }, '400': { $ref: '#/components/responses/Error' } }
  /admin/preorders/delivery:
    post:
      tags: [admin]
      summary: Encode [init_grant_randomness, grant_preorder_pack] for up to `batch` paid reservations (unsigned; multisig signs at mainnet launch)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [admin, oracle, recentSlot], properties: { admin: { type: string }, oracle: { type: string }, queue: { type: string }, recentSlot: { type: string, description: finalized slot }, batch: { type: integer, minimum: 1, maximum: 25, default: 10 } } } } } }
      responses: { '200': { description: unsigned instructions + the items they deliver, content: { application/json: { schema: { type: object, required: [ok, instructions, items], properties: { ok: { type: boolean }, instructions: { type: array, items: { type: object } }, items: { type: array, items: { type: object, required: [refId, beneficiary, qty, nonce], properties: { refId: { type: integer }, beneficiary: { type: string }, qty: { type: integer }, nonce: { type: string } } } } } } } } }, '400': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error', description: nothing_to_deliver } }
  /admin/fraud:
    get:
      tags: [admin]
      summary: Fraud signals queue (antifraud.fraudQueue — open signals, highest score first, with the wallet's current flags)
      parameters: [{ in: query, name: limit, schema: { type: integer, maximum: 500, default: 100 } }]
      responses: { '200': { description: rows, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/FraudSignal' } } } } } }
  /admin/fraud/{wallet}:
    post:
      tags: [admin]
      summary: Resolve — ignore / shadow_ban / rewards_pause / ban / unflag (antifraud.resolveWallet; writes wallets.flags, closes the wallet's open signals, audited)
      parameters: [{ in: path, name: wallet, required: true, schema: { $ref: '#/components/schemas/Pubkey' } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [resolution], properties: { resolution: { type: string, enum: [ignore, shadow_ban, rewards_pause, ban, unflag, trust] }, note: { type: string, maxLength: 280 } } } } } }
      responses: { '200': { description: ok, content: { application/json: { schema: { type: object, properties: { flags: { $ref: '#/components/schemas/WalletFlags' }, closed: { type: integer, description: open signals closed by this resolution } } } } } }, '400': { description: bad wallet }, '422': { description: bad resolution / note } }
  /admin/kpi:
    get:
      tags: [admin]
      summary: PRD KPI dashboard (D1/D7/D30 retention cohorts, conversion, ARPPU, sink ratio, floor index, arena + fraud + finality health)
      responses: { '200': { description: kpi, content: { application/json: { schema: { $ref: '#/components/schemas/AdminKpi' } } } } }
  /admin/world-metrics:
    get:
      tags: [admin]
      summary: Skate-world cohorts (docs/16 §12) — does the world actually feed the main loop?
      description: |
        For each world feature (wall, exhibit, tag) the wallet cohort is compared against a baseline of
        wallets that played in the same window but never touched the feature. Every number is a
        **per-wallet average**, because the two groups differ in size — a raw sum would say "the cohort
        trades more" merely because the cohort is bigger. `delta` is `cohort / baseline - 1`.
      parameters: [{ in: query, name: days, schema: { type: integer, minimum: 1, maximum: 90, default: 30 } }]
      responses:
        '200': { description: cohorts per feature, content: { application/json: { schema: { $ref: '#/components/schemas/WorldMetrics' } } } }
  /admin/audit:
    get:
      tags: [admin]
      summary: Admin audit log (newest first) — every /admin call incl. denied ones, with body / result summary and IP
      parameters: [{ in: query, name: limit, schema: { type: integer, maximum: 1000, default: 100 } }]
      responses: { '200': { description: rows, content: { application/json: { schema: { type: array, items: { type: object, properties: { id: { type: integer }, wallet: { $ref: '#/components/schemas/Pubkey' }, action: { type: string }, target: { type: [string, 'null'] }, payload: {}, ip: { type: [string, 'null'] }, ok: { type: boolean }, ts: { type: integer } } } } } } } }

  /me/compliance:
    get:
      tags: [me]
