        pythUpdateData: { type: array, items: { type: string }, description: 'always []' }
        effectiveOddsBps: { type: array, items: { type: integer } }
        pityCounter: { type: integer }
        hardPityIn: { type: integer }
        nonce: { type: string }
        accounts: { type: object, additionalProperties: { $ref: '#/components/schemas/Pubkey' } }
        switchboardQueue: { $ref: '#/components/schemas/Pubkey' }
