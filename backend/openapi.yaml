openapi: 3.1.0
info:
  title: GUTTERCAPS API
  version: 0.2.0
  description: |
    Read-mostly API for the GUTTERCAPS client. Anything that moves value is a
    Solana transaction the client builds and signs itself; the API only
    supplies quotes, PDAs, Merkle proofs and projections.

    Auth: Sign-In-With-Solana (SIWS). `POST /auth/siws/nonce` → sign → `POST /auth/siws/verify` → HTTP-only cookie + CSRF token.
    The signed message's domain must be one of the API's `SIWS_DOMAINS` and carry `Issued At` within ±5 min.
    Rate limits (every endpoint may answer `429 rate_limited` with `Retry-After` and `RateLimit-Limit/Remaining/Reset/Policy`
    headers): reads 600/min/IP · mutations 60/min/session · `/auth/siws/nonce` 10/min/IP + 30/h/wallet · `/auth/siws/verify`
    20/min/IP · `/packs/quote` 30/min/session · `/services/claim`, `PUT /me/handle` 10/min/session + 40/min per IP /24 ·
    `POST /me/human` 6/min/session + 30/h per IP /24. JSON bodies ≤ 16 KB (`413`).
    All amounts are strings of integer base units (lamports / micro-USDC / micro-$CG) unless suffixed `Usd`.
servers:
  - url: https://api.guttercaps.gg/v1
  - url: http://localhost:8787/v1
tags:
  - { name: auth }
  - { name: me }
  - { name: packs }
  - { name: collections }
  - { name: market }
  - { name: fusion }
  - { name: arena }
  - { name: staking }
  - { name: quests }
  - { name: leaderboard }
  - { name: services }
  - { name: admin }
security:
  - cookieAuth: []

paths:
  # ------------------------------------------------------------------ auth
  /auth/siws/nonce:
    post:
      tags: [auth]
      security: []
      summary: Issue a SIWS nonce for a wallet
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [address], properties: { address: { $ref: '#/components/schemas/Pubkey' } } } } }
      responses:
        '200': { description: nonce, content: { application/json: { schema: { type: object, properties: { nonce: { type: string }, statement: { type: string }, expiresAt: { type: string, format: date-time } } } } } }
  /auth/siws/verify:
    post:
      tags: [auth]
      security: []
      summary: Verify signed SIWS message, start session
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [address, message, signature], properties: { address: { $ref: '#/components/schemas/Pubkey' }, message: { type: string }, signature: { type: string, description: base58 }, referrer: { $ref: '#/components/schemas/Pubkey' }, fingerprint: { type: string, minLength: 8, maxLength: 256, description: 'client device fingerprint (canvas-free, client/src/shared/lib/fingerprint.ts); the API stores only a salted hash — device dedupe, T-B-49' } } } } }
      responses:
        '200': { description: session, content: { application/json: { schema: { type: object, properties: { csrf: { type: string }, wallet: { $ref: '#/components/schemas/WalletProfile' } } } } } }
        '401': { description: 'siws_address | siws_nonce | siws_expired | siws_domain | siws_issued_at | siws_signature', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/logout:
    post: { tags: [auth], summary: End session, responses: { '204': { description: ok } } }

  # ------------------------------------------------------------------ me
  /me:
    get:
      tags: [me]
      summary: Profile, balances, pity, flags
      responses:
        '200': { description: profile, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
  /me/chips:
    get:
      tags: [me]
      summary: Inventory (projection of Core owner + ChipState)
      parameters:
        - { in: query, name: collection, schema: { type: integer, minimum: 0, maximum: 7 } }
        - { in: query, name: rarity, schema: { type: integer, minimum: 0, maximum: 8 } }
        - { in: query, name: status, schema: { type: string, enum: [free, staked, listed, locked, fusing] } }
        - { $ref: '#/components/parameters/cursor' }
        - { in: query, name: limit, schema: { type: integer, minimum: 0, maximum: 500, default: 200 } }
      responses:
        '200': { description: chips, content: { application/json: { schema: { $ref: '#/components/schemas/ChipPage' } } } }
        '400': { $ref: '#/components/responses/Error', description: 'bad_request — an unknown `status` used to be ignored (the unfiltered list came back), `collection`/`rarity` bound NaN into the WHERE clause (SEC-B2)' }
  /me/grid:
    get:
      tags: [me]
      summary: 8×9 collection grid — owned count per (collection, rarity) + completed sets
      responses:
        '200': { description: grid, content: { application/json: { schema: { type: object, properties: { cells: { type: array, items: { type: array, items: { type: integer } }, description: '[collection][rarity] → owned count' }, completedSets: { type: integer }, missingForSet: { type: array, items: { type: object, properties: { collection: { type: integer }, rarities: { type: array, items: { type: integer } } } } } } } } } }
  /me/activity:
    get:
      tags: [me]
      summary: Unified activity feed (pack opens, fusions, sales, claims, matches)
      parameters:
        - { $ref: '#/components/parameters/cursor' }
        - { in: query, name: limit, schema: { type: integer, minimum: 0, maximum: 200, default: 50 } }
      responses:
        '200': { description: feed, content: { application/json: { schema: { $ref: '#/components/schemas/ActivityPage' } } } }
        '400': { $ref: '#/components/responses/Error', description: 'bad_request — strict cursor/limit (SEC-B2)' }
  /me/referrals:
    get:
      tags: [me]
      summary: Referral dashboard — referees, counted real-revenue spend, $CG earned (root kind 4), per-referee cap left, welcome bonus
      description: 'Accrual rules: packages/economy REFERRAL + backend/src/referrals.ts (settled by the reward oracle from finalized, opened, SOL/USDC/SKR-paid purchases; device dedupe on both sides; per-referee lifetime cap).'
      responses: { '200': { description: summary, content: { application/json: { schema: { $ref: '#/components/schemas/ReferralSummary' } } } } }
  /me/pending:
    get:
      tags: [me]
      summary: In-flight commit-reveal operations (packs / fusions) with crank status
      responses:
        '200': { description: pending, content: { application/json: { schema: { type: object, properties: { packs: { type: array, items: { $ref: '#/components/schemas/PendingPack' } }, compressed: { type: array, items: { $ref: '#/components/schemas/CompressedSettlement' } }, fusions: { type: array, items: { $ref: '#/components/schemas/PendingFusion' } } } } } } }
  /me/handle/check:
    get:
      tags: [me]
      summary: Is this handle free? (also returns the ref_hash to commit on-chain)
      description: |
        ref_hash = keccak256(0x00 ‖ kind:u8 ‖ wallet:32 ‖ lowercase(handle) utf8). The client passes it to
        chip_core::pay_service(kind=Handle|HandleChange, …). Reserved 120 s for the caller once checked.
      parameters: [{ in: query, name: handle, required: true, schema: { type: string, pattern: '^[a-zA-Z0-9_]{3,16}$' } }]
      responses:
        '200': { description: availability, content: { application/json: { schema: { type: object, properties: { available: { type: boolean }, reason: { type: string, enum: [taken, reserved, blocked, cooldown] }, kind: { type: integer, description: '0 first handle, 1 change' }, refHash: { type: string, description: 'hex, 32 bytes' }, priceUsdCents: { type: integer }, reservedUntil: { type: string, format: date-time } } } } } }
  /me/handle:
    put:
      tags: [me]
      summary: Claim a handle after paying on-chain (pay_service kind 0/1) — signature required
      description: |
        The indexer verifies the ServicePaid event in `signature`: buyer == caller, kind ∈ {0,1}, ref_hash matches
        keccak(kind ‖ wallet ‖ lowercase(handle)), payment not previously consumed. $CG payments are burned on-chain;
        SOL/USDC/SKR go to the treasury. Handle changes are limited to 1 per 30 days; released handles are quarantined 90 days.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [handle, signature], properties: { handle: { type: string, pattern: '^[a-zA-Z0-9_]{3,16}$' }, signature: { type: string } } } } } }
      responses: { '200': { description: ok }, '402': { description: payment not found / already consumed }, '409': { $ref: '#/components/responses/Error', description: 'handle_taken / handle_cooldown / same_handle — or payment_pending: the payment is confirmed but not yet finalized (SEC-M5); retry in ~30 s' } }
  /me/services:
    get:
      tags: [me]
      summary: Owned entitlements (skins, themes, emotes, season pass, instant reveal…) and daily-cap status
      responses:
        '200': { description: entitlements, content: { application/json: { schema: { type: object, properties: { entitlements: { type: array, items: { $ref: '#/components/schemas/Entitlement' } }, dailyLeft: { type: object, additionalProperties: { type: integer } } } } } } }
  /me/pass:
    get:
      tags: [me]
      summary: Season-pass progress — XP, unlocked tier, claimed tiers (rewards follow economy PASS_TRACK)
      responses:
        '200': { description: state, content: { application/json: { schema: { $ref: '#/components/schemas/PassState' } } } }
        '503': { $ref: '#/components/responses/Error', description: 'no season yet' }
  /me/pass/claim:
    post:
      tags: [me]
      summary: Claim one unlocked pass tier as an entitlement (skin tiers take {asset} — an owned cap to paint)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [tier], properties: { tier: { type: integer, minimum: 1, maximum: 20 }, asset: { type: string } } } } } }
      responses:
        '200': { description: entitlement, content: { application/json: { schema: { $ref: '#/components/schemas/Entitlement' } } } }
        '402': { $ref: '#/components/responses/Error', description: 'no_pass — the season pass itself is a paid service' }
        '409': { $ref: '#/components/responses/Error', description: 'tier_locked / already_claimed / not_owner / set_not_completed' }
  /me/human:
    get:
      tags: [me]
      summary: Proof-of-human state (Cloudflare Turnstile pass, T-B-49)
      description: |
        Quest and SKR rewards are only *settled* for wallets with a fresh pass (7 d); until then `/quests` items carry
        `ineligibleReason = human_check_required` and finished quests wait (nothing is zeroed). `required=false` when the
        deployment runs without Turnstile or the wallet is `trusted`. `siteKey` is what the widget needs.
      responses:
        '200': { description: state, content: { application/json: { schema: { $ref: '#/components/schemas/HumanStatus' } } } }
    post:
      tags: [me]
      summary: Verify a Turnstile token → 7-day pass
      description: |
        Rate limits: 6/min per session, 30/h per IP /24. Optionally re-sends the device fingerprint.
        The siteverify answer is checked, not just `success` (SEC-B5): the challenge must have been solved on one of
        `TURNSTILE_HOSTNAMES` and its `action` must equal `TURNSTILE_ACTION` (the widget sends `claim`), and a token
        older than `TURNSTILE_MAX_AGE_S` is refused — a public sitekey means anyone can mint a token for their own page.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string, maxLength: 2048 }, fingerprint: { type: string, minLength: 8, maxLength: 256 } } } } } }
      responses:
        '200': { description: verified, content: { application/json: { schema: { $ref: '#/components/schemas/HumanStatus' } } } }
        '400': { $ref: '#/components/responses/Error', description: 'turnstile_failed (details.errorCodes = siteverify error-codes)' }
        '503': { $ref: '#/components/responses/Error', description: 'human_check_unavailable — siteverify unreachable, retry' }
  /services:
    get:
      tags: [services]
      security: []
      summary: Catalogue of paid services (mirrors economy ServiceKind) with live quotes in every currency
      responses:
        '200': { description: catalogue, content: { application/json: { schema: { type: object, properties: { services: { type: array, items: { $ref: '#/components/schemas/Service' } }, solUsd: { type: number }, skrUsd: { type: number } } } } } }
  /services/claim:
    post:
      tags: [services]
      summary: Bind a paid ServicePaid event to an entitlement payload (skins → asset, theme id, emote pack id, …)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [signature, kind, payload], properties: { signature: { type: string }, kind: { type: integer }, payload: { type: object, additionalProperties: true, description: 'canonical JSON; keccak(kind ‖ wallet ‖ canonical(payload)) must equal ref_hash' } } } } } }
      responses: { '200': { description: entitlement, content: { application/json: { schema: { $ref: '#/components/schemas/Entitlement' } } } }, '402': { description: payment not found / mismatch }, '409': { $ref: '#/components/responses/Error', description: 'not_owner — or payment_pending: the payment is confirmed but not yet finalized (SEC-M5); retry in ~30 s' } }

  # ------------------------------------------------------------------ packs
  /packs:
    get:
      tags: [packs]
      security: []
      summary: Catalog with live odds, floors, pity and caps (from GameConfig)
      responses:
        '200': { description: catalog, content: { application/json: { schema: { type: object, properties: { paramsVersion: { type: integer }, packs: { type: array, items: { $ref: '#/components/schemas/PackSku' } }, bundles: { type: array, items: { type: object, properties: { qty: { type: integer }, discountBps: { type: integer } } } } } } } } }
  /packs/quote:
    post:
      tags: [packs]
      summary: Price quote + everything needed to build buy_pack
      description: |
        Returns the SOL / SKR amount computed from the studio's own Pyth push-oracle accounts (shard 0xCA75, posted by
        our price pusher — ops/pyth-pusher/) with the exact integer formula of chip_core::units_for_cents, the 1 %
        slippage guard (`maxLamports`), the `priceUpdateAccount` the client must pass to buy_pack, $CG/USDC amounts,
        the caller's effective odds (pity applied), the Switchboard queue and the PDA set. Bundle and SKR promo
        discounts are stacked additively and capped at 30 %.
        The quote is never synthesised: if the on-chain price is older than 45 s (60 s max age minus the 15 s a buyer
        needs to sign) or the account is missing/unverified the endpoint answers **503 price_unavailable** and the
        client hides that rail. `expiresAt` is when the current on-chain update would fail the age check.
        `pythUpdateData` is always empty in the push model (kept for a future pull-model fallback).
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [sku, qty, currency], properties: { sku: { type: integer, minimum: 0, maximum: 3 }, qty: { type: integer, minimum: 1, maximum: 25 }, currency: { type: string, enum: [SOL, USDC, CG, SKR] } } } } } }
      responses:
        '200': { description: quote, content: { application/json: { schema: { $ref: '#/components/schemas/PackQuote' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { description: sign-in required (pity and caps are per wallet) }
        '403': { $ref: '#/components/responses/Error', description: 'geo_blocked — randomised packs are not sold in this region (`GEO_GATE=shop`, `GEO_RESTRICT_COUNTRIES`; backend/src/geo.ts). The country comes from the edge header, never from the client. Only the purchase is gated: market, staking, arena and every read endpoint keep working.' }
        '409': { description: starter_claimed — one Starter per wallet }
        '429': { description: daily_cap — Limited 5 / day }
        '503': { $ref: '#/components/responses/Error', description: 'price_unavailable — Pyth account stale / missing / unverified, or its confidence interval is wider than 2 % of the price (SEC-M2 — the program would reject with PriceUncertain); retry after the next push (≤ 30 s)' }
  /prices:
    get:
      tags: [packs]
      security: []
      summary: Health of the price cache the API quotes from (what our Pyth pusher last posted and how old it is)
      responses:
        '200': { description: prices, content: { application/json: { schema: { type: object, properties: { maxAgeS: { type: integer, example: 60 }, alertAgeS: { type: integer, example: 45 }, feeds: { type: object, additionalProperties: { type: object, properties: { usd: { type: number }, account: { $ref: '#/components/schemas/Pubkey' }, publishTime: { type: string, format: date-time }, ageS: { type: integer }, confBps: { type: integer }, cachedAt: { type: string, format: date-time }, healthy: { type: boolean } } } } } } } } }
  /health:
    get:
      tags: [admin]
      security: []
      summary: Liveness of the indexer, the price cache, the crank queue, the on-chain pause state per program (SEC-H2) and the burn oracle (SEC-M1)
      responses:
        '200':
          description: health
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  lastSlot: { type: integer, description: newest indexed slot }
                  prices: { type: object, description: same shape as GET /prices }
                  crank: { type: object, properties: { pending: { type: integer }, stale: { type: integer }, settled: { type: integer }, closed: { type: integer }, abandoned: { type: integer }, headAgeS: { type: [integer, 'null'] }, healthy: { type: boolean } } }
                  paused:
                    type: object
                    description: latest PauseChanged per program (chip_core / staking / arena); absent key = never changed since genesis
                    additionalProperties: { type: object, properties: { paused: { type: boolean }, by: { $ref: '#/components/schemas/Pubkey' }, slot: { type: integer }, blockTime: { type: [integer, 'null'] } } }
                  finality:
                    type: object
                    description: SEC-M5 reconciler — how far the event log lags finalization; dropped (forked) transactions are evicted and projections rebuilt
                    properties:
                      assume: { type: boolean, description: FINALITY_ASSUME=1 dev shortcut (refused in production) }
                      pendingSignatures: { type: integer }
                      oldestPendingAgeS: { type: [integer, 'null'] }
                      lastFinalizedAt: { type: [string, 'null'], format: date-time }
                      healthy: { type: boolean, description: nothing waiting longer than 10 min }
                  burnOracle:
                    type: object
                    description: SEC-M1 keeper that feeds staking.report_burn from indexed burns (hourly)
                    properties:
                      lastSignature: { type: [string, 'null'] }
                      lastAmountMicro: { type: [string, 'null'] }
                      lastReportAgeS: { type: [integer, 'null'] }
                      reportedTotalMicro: { type: string }
                      pendingMicro: { type: string, description: burns indexed but not yet reported }
                      pendingRows: { type: integer }
                      healthy: { type: boolean, description: reported within 3 intervals, or nothing material pending }
                  rewardOracle:
                    type: object
                    description: keeper that turns quest completions / match rewards / season payouts / referrals into Merkle roots (kinds 2 / 3 / 4 in $CG, 5 / 6 in SKR from the prize pool, 8 = fusion boosters delivered by CPI into chip_core)
                    properties:
                      lastPublishedAt: { type: [integer, 'null'], description: unix s }
                      finalizedHorizonSlot: { type: integer, description: "SEC-M5 / backlog 9 — settlement only counts on-chain events at or below this slot (the slot before the oldest unfinalized event)" }
                      pendingBatches: { type: array, items: { type: object, properties: { kind: { type: integer }, epoch: { type: integer }, budget: { type: string }, leaves: { type: integer }, last_error: { type: [string, 'null'] }, created_at: { type: integer }, ageS: { type: integer } } } }
                      unrootedMicro: { type: object, properties: { quests: { type: string }, pvp: { type: string }, referrals: { type: string } } }
                      unrootedBoosters: { type: object, description: 'backlog 27 — fusion boosters owed by quest completions that are not in a kind-8 item root yet (unit count)', properties: { count: { type: integer }, wallets: { type: integer } } }
                      unfundedRake: { type: object, description: "SEC-L5 — settled seasons whose 20 % wager-rake share is not yet recycled into slice_budget[3] by staking::fund_slice (retried every cycle)", properties: { seasons: { type: array, items: { type: integer } }, micro: { type: string } } }
                      skr: { type: object, description: "SKR prize-pool distribution (kinds 5 Seeker week / 6 season) — last period paid per kind and the settled seasons still waiting for a funded pool", properties: { lastSeekerWeek: { type: [object, 'null'], properties: { period_key: { type: string }, budget: { type: string }, wallets: { type: integer } } }, lastSeason: { type: [object, 'null'], properties: { period_key: { type: string }, budget: { type: string }, wallets: { type: integer } } }, unpaidSeasons: { type: array, items: { type: integer } } } }
                      healthy: { type: boolean, description: no pending batch (and no unrecycled season rake) older than 3 oracle intervals }
                  antifraud:
                    type: object
                    description: detector queue (backend/src/antifraud.ts) — signals are evidence for ops, nothing is banned automatically
                    properties:
                      openSignals: { type: object, additionalProperties: { type: integer }, description: open rows per kind (win_trading / wash_trade / quest_bot / multi_account) }
                      lastSignalAt: { type: [integer, 'null'], description: unix s }
                      paused: { type: integer, description: wallets with flags.rewardsPaused }
                      shadowBanned: { type: integer, description: wallets with flags.shadowBanned }
                  arena:
                    type: object
                    properties:
                      queued: { type: integer }
                      revealing: { type: integer }
                      unattributedResolves:
                        type: object
                        description: SEC-F06 canary — BattleResolved events (24 h) whose signature no battle-worker `matches` row claims (a resolve_battle this backend did not send). Mirrors the `arena_unattributed_resolves` gauge.
                        properties:
                          count: { type: integer }
                          sample:
                            type: array
                            maxItems: 5
                            items:
                              type: object
                              properties: { battle: { type: string }, signature: { type: string }, resolvedAt: { type: integer, nullable: true } }
  /packs/opens/{signature}:
    get:
      tags: [packs]
      summary: Result of a pack open (poll after reveal; WS pushes the same payload)
      parameters: [{ in: path, name: signature, required: true, schema: { type: string } }]
      responses:
        '200': { description: result, content: { application/json: { schema: { $ref: '#/components/schemas/PackOpenResult' } } } }
        '202': { description: not revealed yet, content: { application/json: { schema: { $ref: '#/components/schemas/PendingPack' } } } }
  /packs/verify:
    post:
      tags: [packs]
      security: []
      summary: Provably-fair verifier — recompute a pack result from its randomness bytes
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [signature], properties: { signature: { type: string } } } } } }
      responses:
        '200':
          description: |
            `recomputed` is the rarity sequence the emitted randomness produces under the published economy
            table (`assumed` records which table, whether a `ParamsChanged` predates the open, and the pity
            state); `onChain` is what the program minted; `matches` compares the two. Districts are **not**
            recomputed here — the pool (`collections_created` / featured district) is live chain state the read
            model does not hold, so `onChain[i].collection` is reported as-is and the client verifier (which
            reads the config account) is what checks them. A `note` explains any mismatch.
          content: { application/json: { schema: { type: object, properties: { randomnessAccount: { $ref: '#/components/schemas/Pubkey' }, rollHex: { type: string }, pityBefore: { type: integer }, effectiveOddsBps: { type: array, items: { type: integer }, description: 'odds the roll was drawn with — the SKU table after pity, or the voucher TEMPLATE odds (#28)' }, voucher: { type: [object, 'null'], properties: { template: { type: integer }, odds: { type: [array, 'null'], items: { type: integer } }, soulboundDays: { type: [integer, 'null'] } } }, recomputed: { type: array, items: { $ref: '#/components/schemas/RolledRarity' } }, onChain: { type: array, items: { $ref: '#/components/schemas/RolledChip' } }, matches: { type: boolean, description: 'the minted RARITY sequence follows from the randomness bytes under `assumed`' }, assumed: { $ref: '#/components/schemas/PackVerificationBasis' }, note: { type: string, description: 'present when something needs saying: mismatch, table change, unverifiable input' } } } } } 

  # ------------------------------------------------------------------ collections
  /collections:
    get:
      tags: [collections]
      security: []
      summary: All 8 districts with lore, art, element, mint stats, floor per rarity
      responses: { '200': { description: list, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Collection' } } } } } }
  /collections/{idx}/chips/{rarity}:
    get:
      tags: [collections]
      security: []
      summary: Chip archetype page (lore, art, supply, floor, recent sales)
      parameters:
        - { in: path, name: idx, required: true, schema: { type: integer } }
        - { in: path, name: rarity, required: true, schema: { type: integer } }
      responses: { '200': { description: archetype, content: { application/json: { schema: { $ref: '#/components/schemas/ChipArchetype' } } } } }
  /stats:
    get:
      tags: [collections]
      security: []
      summary: Global counters (landing page + ops)
      responses: { '200': { description: stats, content: { application/json: { schema: { $ref: '#/components/schemas/Stats' } } } } }
  /wallet/{address}/events:
    get:
      tags: [me]
      security: []
      summary: Raw indexed events mentioning a wallet (idempotent source-of-truth rows, newest first)
      parameters:
        - { in: path, name: address, required: true, schema: { $ref: '#/components/schemas/Pubkey' } }
        # SEC-B2 (2026-09-26): a single decimal integer; `abc`/`1.5` used to reach SQL as a NULL LIMIT
        # (HTTP 500) and `-1` bypassed the cap entirely (SQLite reads a negative LIMIT as "no limit").
        - { in: query, name: limit, required: false, schema: { type: integer, minimum: 0, maximum: 200, default: 50 } }
      responses:
        '200': { description: events, content: { application/json: { schema: { type: object, properties: { events: { type: array, items: { $ref: '#/components/schemas/RawEvent' } } } } } } }
        '400': { $ref: '#/components/responses/Error', description: bad_request — `limit` is not a single non-negative integer (410-style silent coercion is gone) }
  /chips/{asset}:
    get:
      tags: [collections]
      security: []
      summary: Single chip — state, owner, listing, provenance (pack/fusion event)
      parameters: [{ in: path, name: asset, required: true, schema: { $ref: '#/components/schemas/Pubkey' } }]
      responses: { '200': { description: chip, content: { application/json: { schema: { $ref: '#/components/schemas/ChipDetail' } } } }, '404': { $ref: '#/components/responses/Error' } }

  # ------------------------------------------------------------------ market
  /market/listings:
    get:
      tags: [market]
      security: []
      summary: Active listings with filters
      parameters:
        - { in: query, name: collection, schema: { type: integer } }
        - { in: query, name: rarity, schema: { type: integer } }
        - { in: query, name: rarityMin, schema: { type: integer } }
        - { in: query, name: levelMin, schema: { type: integer, minimum: 0 } }
        - { in: query, name: currency, schema: { type: string, enum: [SOL, USDC, SKR] } }
        - { in: query, name: priceMaxUsd, schema: { type: number, minimum: 0 } }
        - { in: query, name: missingForMySet, schema: { type: boolean }, description: 'auth required; only chips that complete one of my sets' }
        # SEC-B3: `indexMin` / `indexMax` / `sort=index_asc` were documented and rendered in the UI
        # ("Low #") while doing nothing — the `chips` projection had no game index. Shape #27 projected
        # it (`chips.game_index`: compressed chips from `CompressedChipRegistered`, core `open_pack`
        # chips back-filled from `ChipState` by the crank), so the three are back in the contract and
        # are honoured. A chip whose number is not resolved yet (`index: null`) sorts last and is
        # *excluded* by a range filter — never treated as #0, which is a real chip of that collection.
        - { in: query, name: indexMin, schema: { type: integer, minimum: 0, maximum: 4294967295 }, description: 'mint number lower bound (`Name #N`)' }
        - { in: query, name: indexMax, schema: { type: integer, minimum: 0, maximum: 4294967295 }, description: 'mint number upper bound' }
        - { in: query, name: sort, schema: { type: string, enum: [price_asc, price_desc, newest, rarity_desc, index_asc], default: price_asc } }
        - { $ref: '#/components/parameters/cursor' }
        - { in: query, name: limit, schema: { type: integer, minimum: 0, maximum: 200, default: 60 } }
      responses:
        '200': { description: listings, content: { application/json: { schema: { $ref: '#/components/schemas/ListingPage' } } } }
        '400': { $ref: '#/components/responses/Error', description: 'bad_request / bad_sort / bad_currency — filters are integers in range, never silently ignored (SEC-B2/B3)' }
  /market/floor:
    get:
      tags: [market]
      security: []
      summary: Floor matrix 8×9 (USD-normalized) + 24 h volume; cached 30 s
      responses: { '200': { description: floors, content: { application/json: { schema: { type: object, properties: { asOf: { type: string, format: date-time }, solUsd: { type: number }, skrUsd: { type: number }, floors: { type: array, items: { type: array, items: { type: [number, 'null'] } } }, listedCount: { type: array, items: { type: array, items: { type: integer } } }, volume24hUsd: { type: number } } } } } } }
  /market/history:
    get:
      tags: [market]
      security: []
      summary: Sales history (per chip, archetype, or global)
      parameters:
        - { in: query, name: asset, schema: { $ref: '#/components/schemas/Pubkey' } }
        - { in: query, name: collection, schema: { type: integer, minimum: 0, maximum: 9 } }
        - { in: query, name: rarity, schema: { type: integer, minimum: 0, maximum: 8 } }
        - { $ref: '#/components/parameters/cursor' }
      responses:
        '200': { description: sales, content: { application/json: { schema: { $ref: '#/components/schemas/SalePage' } } } }
        '400': { $ref: '#/components/responses/Error', description: 'bad_request — filters must be integers in range (SEC-B2)' }
  /market/offers:
    get:
      tags: [market]
      summary: Offers made by me / received on my chips
      parameters: [{ in: query, name: direction, schema: { type: string, enum: [made, received] } }]
      responses: { '200': { description: offers, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Offer' } } } } } }

  # ------------------------------------------------------------------ fusion
  /fusion/recipes:
    get:
      tags: [fusion]
      security: []
      summary: All 8 recipes (rule, success %, fee, lock) — mirrors on-chain constants
      responses: { '200': { description: recipes, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Recipe' } } } } } }
  /fusion/plan:
    post:
      tags: [fusion]
      summary: Validate a material set, return success %, fee, result preview and accounts for `fuse`
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [materials], properties: { materials: { type: array, minItems: 3, maxItems: 3, items: { $ref: '#/components/schemas/Pubkey' } }, resultCollection: { type: integer }, useBooster: { type: boolean } } } } } }
      responses:
        '200': { description: plan, content: { application/json: { schema: { $ref: '#/components/schemas/FusionPlan' } } } }
        '422': { $ref: '#/components/responses/Error' }
  /fusion/suggest:
    get:
      tags: [fusion]
      summary: Auto-pick fusable triples from my inventory (never touches staked/listed/locked/set-critical chips)
      parameters: [{ in: query, name: protectSets, schema: { type: boolean, default: true } }]
      responses: { '200': { description: suggestions, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/FusionPlan' } } } } } }

  # ------------------------------------------------------------------ arena
  /arena/queue:
    post:
      tags: [arena]
      summary: Enter matchmaking with a squad + seed commit
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [squad, commit], properties: { squad: { type: array, minItems: 3, maxItems: 3, items: { $ref: '#/components/schemas/Pubkey' } }, commit: { type: string, description: 'hex sha256(nonce)' }, wagerCgMicro: { type: string } } } } } }
      responses:
        '200': { description: queued (or paired at once — `matchId` set), content: { application/json: { schema: { type: object, properties: { ticket: { type: string }, league: { type: integer }, squadPower: { type: integer }, synergy: { type: number }, estimatedWaitSec: { type: integer }, wsChannel: { type: string }, matchId: { type: [string, 'null'] } } } } } }
        '409': { description: chip busy (listed / fusing) or a match is still awaiting your reveal (`match_pending`) }
        '422': { description: bad squad (not 3 distinct owned chips, power < 400) or bad commit (not 32-byte hex); wagers go on chain (`wager_is_on_chain`) }
    delete: { tags: [arena], summary: Leave queue (no-op once matched), responses: { '204': { description: ok } } }
  /arena/matches/{id}/emotes:
    post:
      tags: [arena]
      summary: Throw an owned spray-tag (kind-4 emote pack) onto the match record — cosmetic only. One tag / 5 s per fighter, 100 per match.
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [emote], properties: { emote: { type: string } } } } } }
      responses:
        '200': { description: accepted, content: { application/json: { schema: { $ref: '#/components/schemas/MatchEmote' } } } }
        '400': { $ref: '#/components/responses/Error', description: 'bad_emote — unknown emote id' }
        '402': { $ref: '#/components/responses/Error', description: 'pack_required — buy the emote pack first' }
        '403': { description: not a player of this match }
        '429': { $ref: '#/components/responses/Error', description: 'slow_down — one tag every 5 s' }
  /arena/matches/{id}/reveal:
    post:
      tags: [arena]
      summary: Reveal the seed nonce (hex; sha256(nonce) must equal your commit). When both sides revealed the server resolves at once — seed = sha256(matchId ‖ nonceA ‖ nonceB ‖ serverSecret); a side that never reveals forfeits after ARENA_REVEAL_TIMEOUT_S (120 s)
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [nonce], properties: { nonce: { type: string, description: 'hex, 8..64 bytes' } } } } } }
      responses:
        '200': { description: accepted, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, status: { type: string, enum: [revealing, resolved, cancelled] }, matchId: { type: string }, resolved: { type: boolean }, winner: { type: string }, waitingFor: { type: string, enum: [a, b] } } } } } }
        '400': { description: bad nonce / commit mismatch }
        '403': { description: not a player of this match }
        '409': { description: a different nonce was already revealed }
  /arena/matches/{id}:
    get:
      tags: [arena]
      security: []
      summary: Match record incl. seed derivation (nonces/seed hidden until both revealed; the season secret appears after the season ends). Wager battles are listed under their battle PDA once the resolver settled them.
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        '200': { description: match, content: { application/json: { schema: { $ref: '#/components/schemas/Match' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /arena/me:
    get:
      tags: [arena]
      summary: My rating, league, streak, daily rewarded matches left, wager battles
      responses: { '200': { description: state, content: { application/json: { schema: { $ref: '#/components/schemas/ArenaMe' } } } } }
  /arena/seasons/current:
    get:
      tags: [arena]
      security: []
      summary: Season timer, pool size, payout brackets, server-secret hash (and the previous season's revealed secret)
      responses: { '200': { description: season, content: { application/json: { schema: { $ref: '#/components/schemas/Season' } } } } }
  /arena/simulate:
    post:
      tags: [arena]
      security: []
      summary: Deterministic fight preview for the squad builder (no rewards; same engine as live). Each side is 3 asset keys or 3 `{collection, rarity, level}` specs.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [squadA, squadB], properties: { squadA: { type: array, items: { $ref: '#/components/schemas/FighterSpec' } }, squadB: { type: array, items: { $ref: '#/components/schemas/FighterSpec' } } } } } } }
      responses: { '200': { description: win probability + sample rounds, content: { application/json: { schema: { type: object, properties: { pWinA: { type: number }, powerA: { type: integer }, powerB: { type: integer }, fightPowerA: { type: integer }, fightPowerB: { type: integer }, synergyA: { type: number }, synergyB: { type: number }, leagueA: { type: integer }, leagueB: { type: integer }, elementEdges: { type: array, items: { type: string } }, sampleRounds: { type: array, items: { $ref: '#/components/schemas/Round' } } } } } } } }

  # ------------------------------------------------------------------ staking
  /staking/overview:
    get:
      tags: [staking]
      security: []
      summary: Pools (TVL, weight, today's budget), implied APY per tier, emission day stats
      responses: { '200': { description: overview, content: { application/json: { schema: { $ref: '#/components/schemas/StakingOverview' } } } } }
  /staking/me:
    get:
      tags: [staking]
      summary: My token stakes, chip stakes, pending rewards (ESTIMATE from indexed DayClosed budgets — the exact figure is the on-chain accumulator the client reads directly), set bonus status
      responses: { '200': { description: mine, content: { application/json: { schema: { $ref: '#/components/schemas/StakingMe' } } } } }
  /staking/estimate:
    post:
      tags: [staking]
      security: []
      summary: APY estimate for an amount/tier given current pool weight
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [amountCgMicro, tier], properties: { amountCgMicro: { type: string }, tier: { type: integer, minimum: 0, maximum: 3 } } } } } }
      responses:
        '200': { description: estimate, content: { application/json: { schema: { type: object, properties: { apyPct: { type: number }, dailyCgMicro: { type: string }, unlockAt: { type: string, format: date-time }, earlyExitPenaltyBps: { type: integer }, boostBps: { type: integer }, minStakeCgMicro: { type: string }, indicativeApyRange: { type: array, items: { type: number } }, emissionSource: { type: string, enum: [chain, schedule] } } } } } }
        '400': { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------------ quests
  /quests:
    get:
      tags: [quests]
      summary: Active quests with my progress (counted from indexed events; reading this endpoint records today's login); eligibility reason (account age / paid pack / rewards paused)
      responses: { '200': { description: quests, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Quest' } } } } } }
  /quests/login:
    post:
      tags: [quests]
      summary: Record today's login explicitly (idempotent; `GET /quests` does it too)
      responses: { '200': { description: ok, content: { application/json: { schema: { type: object, properties: { day: { type: integer }, inserted: { type: boolean } } } } } } }
  /quests/claims:
    get:
      tags: [quests]
      summary: My Merkle leaves (root, amount, proof) built by the reward oracle. `currency` follows the root kind — 2..4 pay $CG via `claim_root`, 5..7 pay SKR via `claim_skr_root`. `claimableAt` is null until the root is published on chain (then published_at + 1 h timelock).
      responses: { '200': { description: claims, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ClaimLeaf' } } } } } }
  /rewards/skr-pool:
    get:
      tags: [quests]
      security: []
      summary: SKR prize-pool ledger (funded / withdrawn / paid / reserved) and live SKR roots — public proof that SKR rewards never exceed treasury funding
      responses: { '200': { description: pool, content: { application/json: { schema: { $ref: '#/components/schemas/SkrPool' } } } } }
  /quests/streak:
    get:
      tags: [quests]
      summary: Daily streak state (consecutive days with all four $CG dailies done)
      responses: { '200': { description: streak, content: { application/json: { schema: { type: object, properties: { days: { type: integer, description: progress toward the next chip (wraps every 7 days) }, total: { type: integer, description: raw consecutive-day run }, nextChipAt: { type: integer }, resetsAt: { type: string, format: date-time }, todayDone: { type: boolean } } } } } } }

  # ------------------------------------------------------------------ leaderboard
  /leaderboard/{board}:
    get:
      tags: [leaderboard]
      security: []
      summary: Season rating (arena Glicko-lite ladder) / chain-verified wager wins / collection score / staking weight / fusion count boards
      description: "`rating` is the server arena's ladder for one season (`season` defaults to the one open now; `league` is filled); `wins` counts resolved wager battles from the arena program. Shadow-banned wallets (ops flag) are hidden from every board but still get a `me` row."
      parameters:
        - { in: path, name: board, required: true, schema: { type: string, enum: [rating, wins, collection, staking, fusion] } }
        - { in: query, name: season, schema: { type: integer, minimum: 0 }, description: rating board only; other boards ignore it }
        - { $ref: '#/components/parameters/cursor' }
        - { in: query, name: limit, schema: { type: integer, minimum: 0, maximum: 200, default: 50 } }
      responses:
        '200': { description: rows, content: { application/json: { schema: { $ref: '#/components/schemas/LeaderboardPage' } } } }
        '400': { $ref: '#/components/responses/Error', description: 'bad_season / bad_request — `season` and `cursor` are strict integers (SEC-B2)' }
        '404': { $ref: '#/components/responses/Error', description: unknown_board }

  # ------------------------------------------------------------------ admin (backend/src/admin.ts — docs/03 §3.5, T-B-46)
  # Gate: SIWS session whose wallet ∈ ADMIN_WALLETS (env allowlist) + CSRF on mutations; every call is written to
  # `admin_audit` (denials too). The service never signs: on-chain changes come back as encoded instructions for the
  # Squads multisig. 401 unauthenticated · 403 not allowlisted / bad CSRF.
  /admin/params:
    get:
      tags: [admin]
      summary: Live GameConfig + EmissionState (decoded from the chain), change history, guard-rails
      responses: { '200': { description: params, content: { application/json: { schema: { $ref: '#/components/schemas/AdminParams' } } } }, '401': { description: sign in }, '403': { description: not an admin }, '503': { description: config account missing on this cluster } }
    post:
      tags: [admin]
      summary: Validate a params change against the program guard-rails + economy invariants and encode `set_params` / `set_split` for the multisig (nothing is sent)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ParamsProposal' } } } }
      responses:
        '200': { description: proposal (instructions for Squads), content: { application/json: { schema: { $ref: '#/components/schemas/Proposal' } } } }
        '422': { description: guard-rail violation — `details` carries the full Proposal (violations / warnings / diff), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /admin/simulate:
    post:
      tags: [admin]
      summary: Run the docs/02 daily-flow model (packages/economy dailyFlows) with overridden assumptions / a hypothetical split
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { assumptions: { type: object, additionalProperties: { type: number }, description: partial FlowAssumptions (dau, payingShare, packsPerPayerPerWeek, …) }, year: { type: integer, minimum: 0, maximum: 7 }, splitBps: { type: array, items: { type: integer }, minItems: 5, maxItems: 5 } } } } } }
      responses: { '200': { description: report json, content: { application/json: { schema: { type: object, properties: { year: { type: integer }, assumptions: { type: object }, baseline: { $ref: '#/components/schemas/DailyFlows' }, scenario: { $ref: '#/components/schemas/DailyFlows' }, delta: { type: object, additionalProperties: { type: number } }, slices: { type: array, items: { type: object, properties: { name: { type: string }, bps: { type: integer }, cgPerDay: { type: integer } } } }, guard: { type: object, properties: { floorShare: { type: number }, burnMultiple: { type: number }, emissionAtZeroBurnCg: { type: integer } } }, packs: { type: array, items: { type: object, properties: { id: { type: string }, evCommonEq: { type: number }, pLegend: { type: number } } } }, rarityValueMult: { type: array, items: { type: number } } } } } } }, '422': { description: unknown / negative assumption } }
  /admin/kill-switch:
    post:
      tags: [admin]
      summary: Encode pause (hot pauser key, SEC-H2, needs a reason) or un-pause (admin-only → multisig) for chip_core / staking / arena
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [program, paused], properties: { program: { type: string, enum: [chip_core, staking, arena] }, paused: { type: boolean }, reason: { type: string, minLength: 8, description: required when paused = true } } } } } }
      responses: { '200': { description: instruction for the pauser / multisig, content: { application/json: { schema: { $ref: '#/components/schemas/Proposal' } } } }, '422': { description: bad program / missing reason } }
  /admin/fraud:
    get:
      tags: [admin]
      summary: Fraud signals queue (antifraud.fraudQueue — open signals, highest score first, with the wallet's current flags)
      parameters: [{ in: query, name: limit, schema: { type: integer, maximum: 500, default: 100 } }]
      responses: { '200': { description: rows, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/FraudSignal' } } } } } }
  /admin/fraud/{wallet}:
    post:
      tags: [admin]
      summary: Resolve — ignore / shadow_ban / rewards_pause / ban / unflag (antifraud.resolveWallet; writes wallets.flags, closes the wallet's open signals, audited)
      parameters: [{ in: path, name: wallet, required: true, schema: { $ref: '#/components/schemas/Pubkey' } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [resolution], properties: { resolution: { type: string, enum: [ignore, shadow_ban, rewards_pause, ban, unflag, trust] }, note: { type: string, maxLength: 280 } } } } } }
      responses: { '200': { description: ok, content: { application/json: { schema: { type: object, properties: { flags: { $ref: '#/components/schemas/WalletFlags' }, closed: { type: integer, description: open signals closed by this resolution } } } } } }, '400': { description: bad wallet }, '422': { description: bad resolution / note } }
  /admin/kpi:
    get:
      tags: [admin]
      summary: PRD KPI dashboard (D1/D7/D30 retention cohorts, conversion, ARPPU, sink ratio, floor index, arena + fraud + finality health)
      responses: { '200': { description: kpi, content: { application/json: { schema: { $ref: '#/components/schemas/AdminKpi' } } } } }
  /admin/audit:
    get:
      tags: [admin]
      summary: Admin audit log (newest first) — every /admin call incl. denied ones, with body / result summary and IP
      parameters: [{ in: query, name: limit, schema: { type: integer, maximum: 1000, default: 100 } }]
      responses: { '200': { description: rows, content: { application/json: { schema: { type: array, items: { type: object, properties: { id: { type: integer }, wallet: { $ref: '#/components/schemas/Pubkey' }, action: { type: string }, target: { type: [string, 'null'] }, payload: {}, ip: { type: [string, 'null'] }, ok: { type: boolean }, ts: { type: integer } } } } } } } }

components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: gc_session }
  parameters:
    cursor: { in: query, name: cursor, schema: { type: string, pattern: '^[0-9]+$' }, description: 'opaque pagination cursor — a non-negative integer offset as a string; anything else is 400 bad_request (SEC-B2: it used to fall back to offset 0, i.e. page 1 forever)' }
  responses:
    Error:
      description: error
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    RateLimited:
      description: rate_limited — retry after `Retry-After` seconds
      headers:
        Retry-After: { schema: { type: integer }, description: seconds }
        RateLimit-Policy: { schema: { type: string }, description: 'e.g. `10;w=60`' }
        RateLimit-Remaining: { schema: { type: integer } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  schemas:
    ApiError: { type: object, properties: { code: { type: string }, message: { type: string }, details: {} } }
    Pubkey: { type: string, pattern: '^[1-9A-HJ-NP-Za-km-z]{32,44}$' }
    Rarity: { type: integer, minimum: 0, maximum: 8, description: '0 Common … 8 Diamond' }
    WalletProfile:
      type: object
      properties: { address: { $ref: '#/components/schemas/Pubkey' }, handle: { type: string }, avatarAsset: { $ref: '#/components/schemas/Pubkey' }, firstSeen: { type: string, format: date-time }, country: { type: string } }
    Me:
      allOf:
        - $ref: '#/components/schemas/WalletProfile'
        - type: object
          properties:
            balances: { type: object, properties: { lamports: { type: string }, usdc: { type: string }, cg: { type: string }, skr: { type: string } } }
            pity: { type: object, properties: { counters: { type: array, items: { type: integer } }, toGuarantee: { type: array, items: { type: integer } }, boughtToday: { type: array, items: { type: integer } }, starterClaimed: { type: boolean } } }
            boosters: { type: integer }
            flags: { type: object, properties: { rewardsPaused: { type: boolean }, geoRestricted: { type: boolean, description: 'the shop is blocked for this buyer (legal gating of paid randomised packs). UI copy only — the answer comes from the edge country header, and enforcement is `403 geo_blocked` on POST /packs/quote, not this flag' }, accountAgeH: { type: integer }, hasPaidPack: { type: boolean }, deviceLimited: { type: boolean, description: '4th+ wallet on one device — earns no quest / PvP / season rewards (T-B-49)' } } }
            human: { $ref: '#/components/schemas/HumanStatus' }
            completedSets: { type: integer }
            isAdmin: { type: boolean, description: 'wallet ∈ ADMIN_WALLETS — the client shows the ops panel (/admin) only then; /admin/* enforces the same allowlist server-side' }
    ReferralSummary:
      type: object
      properties:
        link: { type: object, properties: { param: { type: string, example: ref }, wallet: { $ref: '#/components/schemas/Pubkey' } } }
        rules: { type: object, properties: { rewardBps: { type: integer }, capCgMicroPerReferee: { type: string }, refereeWelcomeCgMicro: { type: string }, countedCurrencies: { type: array, items: { type: string } }, rootKind: { type: integer } } }
        referees:
          type: array
