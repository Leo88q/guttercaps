components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: gc_session }
  parameters:
    cursor: { in: query, name: cursor, schema: { type: string, pattern: '^[0-9]+$' }, description: 'opaque pagination cursor — a non-negative integer offset as a string; anything else is 400 bad_request (SEC-B2: it used to fall back to offset 0, i.e. page 1 forever)' }
  responses:
    Error:
      description: error
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    RateLimited:
      description: rate_limited — retry after `Retry-After` seconds
      headers:
        Retry-After: { schema: { type: integer }, description: seconds }
        RateLimit-Policy: { schema: { type: string }, description: 'e.g. `10;w=60`' }
        RateLimit-Remaining: { schema: { type: integer } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  schemas:
    ApiError: { type: object, properties: { code: { type: string }, message: { type: string }, details: {} } }
    Pubkey: { type: string, pattern: '^[1-9A-HJ-NP-Za-km-z]{32,44}$' }
    Rarity: { type: integer, minimum: 0, maximum: 8, description: '0 Common … 8 Diamond' }
    WalletProfile:
      type: object
      properties: { address: { $ref: '#/components/schemas/Pubkey' }, handle: { type: string }, avatarAsset: { $ref: '#/components/schemas/Pubkey' }, firstSeen: { type: string, format: date-time }, country: { type: string } }
    Me:
      allOf:
        - $ref: '#/components/schemas/WalletProfile'
        - type: object
          properties:
            balances: { type: object, properties: { lamports: { type: string }, usdc: { type: string }, cg: { type: string }, skr: { type: string } } }
            pity: { type: object, properties: { counters: { type: array, items: { type: integer } }, toGuarantee: { type: array, items: { type: integer } }, boughtToday: { type: array, items: { type: integer } }, starterClaimed: { type: boolean } } }
            boosters: { type: integer }
            flags: { type: object, properties: { rewardsPaused: { type: boolean }, geoRestricted: { type: boolean, description: 'the shop is blocked for this buyer (legal gating of paid randomised packs). UI copy only — the answer comes from the edge country header, and enforcement is `403 geo_blocked` on POST /packs/quote, not this flag' }, accountAgeH: { type: integer }, hasPaidPack: { type: boolean }, deviceLimited: { type: boolean, description: '4th+ wallet on one device — earns no quest / PvP / season rewards (T-B-49)' } } }
            human: { $ref: '#/components/schemas/HumanStatus' }
            completedSets: { type: integer }
            isAdmin: { type: boolean, description: 'wallet ∈ ADMIN_WALLETS — the client shows the ops panel (/admin) only then; /admin/* enforces the same allowlist server-side' }
    ReferralSummary:
      type: object
      properties:
        link: { type: object, properties: { param: { type: string, example: ref }, wallet: { $ref: '#/components/schemas/Pubkey' } } }
        rules: { type: object, properties: { rewardBps: { type: integer }, capCgMicroPerReferee: { type: string }, refereeWelcomeCgMicro: { type: string }, countedCurrencies: { type: array, items: { type: string } }, rootKind: { type: integer } } }
        referees:
          type: array
          items: { type: object, properties: { wallet: { $ref: '#/components/schemas/Pubkey' }, handle: { type: [string, 'null'] }, joinedAt: { type: [string, 'null'], format: date-time }, paidPurchases: { type: integer }, spendUsd: { type: number }, earnedCgMicro: { type: string }, capLeftCgMicro: { type: string } } }
        totals: { type: object, properties: { referees: { type: integer }, paying: { type: integer }, earnedCgMicro: { type: string }, inRootsCgMicro: { type: string, description: already inside a published / pending kind-4 root }, awaitingRootCgMicro: { type: string }, unsettledPurchases: { type: integer, description: 'counted purchases not evaluated yet (not finalized / not opened / next oracle cycle)' } } }
        welcome: { type: [object, 'null'], properties: { amountCgMicro: { type: string }, inRoot: { type: boolean } }, description: this wallet's own referee welcome bonus (null when it was not referred or has not bought a paid pack) }
        asOf: { type: string, format: date-time }
    Chip:
      type: object
      properties:
        asset: { $ref: '#/components/schemas/Pubkey' }
        owner: { $ref: '#/components/schemas/Pubkey' }
        collection: { type: integer }
        rarity: { $ref: '#/components/schemas/Rarity' }
        level: { type: integer }
        xp: { type: integer, description: 'unspent ranked XP toward the next level' }
        xpToNext: { type: [integer, 'null'], description: 'XP cost of the next level; null at the rarity cap' }
        maxLevel: { type: integer, description: 'rarity cap (Common 12 … Diamond 50)' }
        xpToday: { type: integer, description: 'XP this cap earned during the current UTC day toward xpDailyCap' }
        xpDailyCap: { type: integer, description: 'per-cap UTC-day XP cap (CHIP_XP.dailyCap)' }
        lastPlayed: { type: [string, 'null'], format: date-time, description: 'last Cap Slam that used this cap; null = never — idle stake weight 25 %' }
        idle: { type: boolean, description: 'true when lastPlayed is older than STAKE_CLAIM_CAPS.aliveWindowDays' }
        xpGained: { type: integer, description: 'XP this cap earned from this match (match payloads only; 0 otherwise)' }
        leveledTo: { type: [integer, 'null'], description: 'new level if this match promoted the cap; null otherwise' }
        index: { type: [integer, 'null'], description: 'per-collection mint number (`Name #N`); null = not resolved on chain yet (core `open_pack` chips are back-filled by the crank within a sweep). Never a placeholder: #0 is a real chip' }
        flags: { type: object, properties: { staked: { type: boolean }, listed: { type: boolean }, fusing: { type: boolean }, soulbound: { type: boolean }, founder: { type: boolean, description: 'minted from a mainnet pre-sale pack — carries the permanent founder frame (docs/preorder-beta.md)' } } }
        lockUntil: { type: [string, 'null'], format: date-time }
        power: { type: integer }
        stakeWeight: { type: string }
        skin: { type: [string, 'null'], description: 'cosmetic skin id (economy SKINS); null = none. Written at claim, travels with the cap when sold' }
        art: { type: object, properties: { image: { type: string, format: uri }, video: { type: string, format: uri }, vfxTier: { type: integer } } }
        listing: { $ref: '#/components/schemas/Listing' }
        gridRoute: { type: [object, 'null'], properties: { nextLevel: { type: integer }, chargeDrops: { type: integer } }, description: 'Floodgrid route this cap walks (docs/13 §0.1 — the route travels with the cap on sale); null when the chip has no route row yet' }
    ChipPage: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Chip' } }, nextCursor: { type: [string, 'null'] }, total: { type: integer } } }
    ChipDetail:
      allOf:
        - $ref: '#/components/schemas/Chip'
        - type: object
          properties:
            provenance: { type: object, properties: { origin: { type: string, enum: [pack, fusion, voucher, compressed], description: 'voucher = free quest chip (#28) — VRF-rolled through the same open_pack as a pack; rollHex is its roll; compressed = minted from a compressed pack claim (projections: origin = compressed)' }, signature: { type: string }, rollHex: { type: string }, recipe: { type: integer } } }
            sales: { type: array, items: { $ref: '#/components/schemas/Sale' } }
            archetype: { $ref: '#/components/schemas/ChipArchetype' }
    ChipArchetype:
      type: object
      description: One of the 72 archetypes — lore from `packages/economy/src/lore.ts` (the single source of truth) plus live supply/floor/listing numbers.
      properties:
        collection: { type: integer }
        rarity: { $ref: '#/components/schemas/Rarity' }
        name: { type: string }
        lore: { type: string }
        symbol: { type: string, description: on-chain Core collection symbol }
        district: { type: string }
        rim: { type: string }
        supply: { type: integer }
        floorUsd: { type: [number, 'null'] }
        listed: { type: integer }
        basePower: { type: integer }
        maxLevel: { type: integer }
        sales: { type: array, items: { $ref: '#/components/schemas/Sale' }, description: most recent sales of this archetype }
    Stats:
      type: object
      description: Global counters for the landing page and ops dashboards (`GET /stats`); everything is derived from indexed events.
      properties:
        chipsMinted: { type: integer }
        chipsAlive: { type: integer }
        packsOpened: { type: integer }
        activeWallets: { type: integer }
        chipsCurrentlyStaked: { type: integer }
        tokenStakedMicro: { type: string }
        totalBattlesResolved: { type: integer }
        fusions: { type: integer }
        sales: { type: integer }
        burnedCgMicro: { type: string }
        servicesSold: { type: integer }
        skrRewardsPaidMicro: { type: string }
        lastSlot: { type: integer }
    RawEvent:
      type: object
      description: A stored chain event as the indexer saw it (`GET /wallet/{address}/events`) — for verifiers and support, not for the UI.
      properties:
        name: { type: string }
        data: { type: string, description: JSON string of the decoded event }
        block_time: { type: [integer, 'null'] }
        signature: { type: string }
    Collection:
      type: object
      properties:
        idx: { type: integer }
        symbol: { type: string }
        name: { type: string }
        element: { type: string, enum: [paint, steel, wheels, noise, shadow] }
        palette: { type: array, items: { type: string } }
        lore: { type: string }
        minted: { type: integer }
        mintedByRarity: { type: array, items: { type: integer } }
        floors: { type: array, items: { type: [number, 'null'] } }
        featured: { type: boolean }
    PackSku:
      type: object
      properties:
        sku: { type: integer }
        name: { type: string }
        chips: { type: integer }
        priceUsdCents: { type: integer }
        priceCgMicro: { type: [string, 'null'] }
        currencies: { type: array, items: { type: string, enum: [SOL, USDC, CG, SKR] } }
        oddsBps: { type: array, items: { type: integer }, minItems: 9, maxItems: 9 }
        floor: { $ref: '#/components/schemas/Rarity' }
        dailyCap: { type: [integer, 'null'] }
        pity: { type: [object, 'null'], properties: { tier: { type: integer }, softStart: { type: integer }, softStepBps: { type: integer }, hardAt: { type: integer } } }
        pool: { type: string, enum: [all, featured] }
        enabled: { type: boolean }
        pAtLeastLegend: { type: number }
        evPct: { type: number }
    PreorderCampaign:
      type: object
      required: [active, sku, priceLamports, treasury, total, remaining, sold, granted, memoPrefix, intentTtlS]
      properties:
        active: { type: boolean, description: 'campaign switched on AND treasury configured AND at least one offer remains' }
        sku: { type: integer, description: 'pack SKU of the drop (3 = Limited)' }
        priceLamports: { type: string, description: 'price of ONE single pack in lamports (decimal string, u64)' }
        treasury: { type: string, description: 'Squads multisig vault receiving the payments' }
        total: { type: integer, description: 'single-pack offer size (not including chests)' }
        remaining: { type: integer, description: 'single packs not yet reserved' }
        sold: { type: integer, description: 'paid + granted Limited packs across both offers' }
        granted: { type: integer, description: 'packs already delivered on-chain (PackGranted projection)' }
        memoPrefix: { type: string }
        intentTtlS: { type: integer }
        offers:
          type: array
          items:
            type: object
            required: [id, packs, priceLamports, prices, total, remaining, sold, maxPerWallet, maxQty]
            properties:
              id: { type: string, enum: [pack, chest] }
              packs: { type: integer, description: 'Limited packs granted per reserved unit' }
              priceLamports: { type: string }
              prices: { type: object, required: [SOL, USDC, SKR], description: 'the same price in every pay currency (native units)', properties: { SOL: { type: string }, USDC: { type: string }, SKR: { type: string } } }
              total: { type: integer }
              remaining: { type: integer }
              sold: { type: integer }
              maxPerWallet: { type: integer }
              maxQty: { type: integer }
    PreorderIntent:
      type: object
      required: [refId, wallet, sku, qty, offer, currency, lamports, amount, treasury, payTo, memo, expiresAt]
      properties:
        refId: { type: integer, description: 'the on-chain preorder_ref and the payment memo id' }
        wallet: { type: string }
        sku: { type: integer }
        qty: { type: integer, description: 'Limited packs this reservation grants (chest = 4)' }
        offer: { type: string, enum: [pack, chest] }
        currency: { type: string, enum: [SOL, USDC, SKR] }
        lamports: { type: string, description: 'total to send in the chosen currency (native units; lamports for SOL), decimal string' }
        amount: { type: string, description: 'same as lamports — the amount to send in the chosen currency' }
        treasury: { type: string, description: 'Squads multisig vault that owns the payment destination' }
        payTo: { type: string, description: 'the address to send to: the treasury for SOL, its associated token account for USDC / SKR' }
        mint: { type: string, description: 'SPL mint for USDC / SKR; absent for SOL' }
        memo: { type: string, description: 'attach to the payment, e.g. GC-PRE|42' }
        expiresAt: { type: integer, description: 'unix seconds; after that the intent stops accepting payments' }
    PreorderItem:
      type: object
      required: [ref_id, wallet, sku, qty, offer, currency, lamports, status, created_at]
      properties:
        ref_id: { type: integer }
        wallet: { type: string }
        sku: { type: integer }
        qty: { type: integer }
        offer: { type: string, enum: [pack, chest] }
        currency: { type: string, enum: [SOL, USDC, SKR] }
        lamports: { type: string }
        status: { type: string, enum: [intent, paid, granted, expired] }
        tx_sig: { type: string, nullable: true, description: 'the verified mainnet payment signature' }
        nonce: { type: string, nullable: true, description: 'PendingPack nonce once granted on-chain' }
        grant_sig: { type: string, nullable: true }
        created_at: { type: integer }
        paid_at: { type: integer, nullable: true }
        granted_at: { type: integer, nullable: true }
        memo: { type: string }
        expiresAt: { type: integer }
    PackQuote:
      type: object
      properties:
        sku: { type: integer }
        qty: { type: integer }
        currency: { type: string }
        amount: { type: string, description: 'lamports / micro-USDC / micro-CG / micro-SKR after discounts, frozen FX (SOL=$110, SKR=$0.016, USDC=$1)' }
        maxLamports: { type: string, description: 'exact SOL lamports / micro-SKR (0 for USDC/$CG); passed to buy_pack as max_lamports' }
        priceUsdCents: { type: integer, description: 'USD price after discounts (what the program converts)' }
        rentReserveLamports: { type: string }
        solUsd: { type: number, description: 'frozen SOL/USD ($110)' }
        skrUsd: { type: number, description: 'frozen SKR/USD ($0.016)' }
