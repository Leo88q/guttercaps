          properties:
            district: { type: integer }
            part: { type: string, description: 'the part a silver run pays this week — the first slot still missing from that district' }
            claimed: { type: boolean, description: 'the part for this week is already earned — one per week' }
            missing: { type: array, items: { $ref: '#/components/schemas/BoardSlotName' }, description: 'which slots of the week district are still empty' }
        weekProgress: { type: object, properties: { have: { type: integer }, total: { type: integer } } }
    MyWall:
