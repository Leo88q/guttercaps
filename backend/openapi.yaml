        chips: { type: integer }
        floor: { type: integer }
        pity: { type: [object, 'null'], properties: { tier: { type: integer }, hardAt: { type: integer }, softStart: { type: integer }, softStepBps: { type: integer } } }
        paramsChangedBefore: { type: boolean, description: 'an admin ParamsChanged event precedes this open, so the on-chain table may differ from the published one' }
    Service:
      type: object
      properties:
        id: { type: string }
        kind: { type: integer }
        name: { type: string }
        priceUsdCents: { type: integer }
        dailyCap: { type: integer }
        recurring: { type: boolean }
        quotes: { type: object, description: 'amount in base units per currency (SOL lamports incl. 1 % guard, USDC, CG, SKR)', additionalProperties: { type: string } }
    Entitlement:
      type: object
      properties: { id: { type: string }, kind: { type: integer }, payload: { type: object, additionalProperties: true }, signature: { type: string }, currency: { type: string }, amount: { type: string }, grantedAt: { type: string, format: date-time }, expiresAt: { type: string, format: date-time, nullable: true }, hintsGranted: { type: integer, description: 'Floodgrid Terminal marks granted with this entitlement (every 5th Season Pass tier)' } }
    PendingPack:
      type: object
      properties: { nonce: { type: string }, sku: { type: integer, description: '0..3; a quest chip voucher (#28) also reports sku 0 — see `voucher`' }, qty: { type: integer }, opened: { type: integer }, commitSlot: { type: integer }, currentSlot: { type: integer }, randomness: { $ref: '#/components/schemas/Pubkey' }, status: { type: string, enum: [awaiting_reveal, revealing, opening, stale] }, staleAt: { type: string, format: date-time }, voucher: { type: [object, 'null'], description: 'set when this pending is a free quest chip: { template, odds[9] bps, soulboundDays } — opened by the same open_pack crank; nothing to refund but the rent reserve', properties: { template: { type: integer }, odds: { type: array, items: { type: integer } }, soulboundDays: { type: integer } } } }
    PendingFusion:
      type: object
      properties: { nonce: { type: string }, recipe: { type: integer }, materials: { type: array, items: { $ref: '#/components/schemas/Pubkey' } }, boosted: { type: boolean }, status: { type: string } }
    CompressedSettlement:
      type: object
      properties:
        nonce: { type: string }
        totalClaims: { type: integer }
        registeredClaims: { type: integer }
        cancelledClaims: { type: integer }
        status: { type: string, enum: [pending, settled, refunded] }
        lastSlot: { type: integer }
        claims:
          type: array
          items:
            type: object
            properties:
              claimNonce: { type: string }
              packNo: { type: integer }
              status: { type: string, enum: [pending, minted, registered, cancelled] }
              asset: { type: [string, 'null'] }
    PackOpenResult:
      type: object
      properties:
        signature: { type: string }
        sku: { type: integer }
        chips: { type: array, items: { $ref: '#/components/schemas/Chip' } }
        rollHex: { type: string }
        pityBefore: { type: integer }
        pityAfter: { type: integer }
        highlights: { type: object, properties: { bestRarity: { $ref: '#/components/schemas/Rarity' }, newForSet: { type: array, items: { type: integer } }, completedSet: { type: [integer, 'null'] } } }
        voucher: { type: [object, 'null'], description: '(#28) set when this open was a quest chip voucher (sku 0, 1 chip rolled with the template odds, no floor / pity): { template, odds[9] bps, soulboundDays }', properties: { template: { type: integer }, odds: { type: [array, 'null'], items: { type: integer } }, soulboundDays: { type: [integer, 'null'] } } }
    Listing:
      type: object
      properties: { asset: { $ref: '#/components/schemas/Pubkey' }, seller: { $ref: '#/components/schemas/Pubkey' }, price: { type: string }, currency: { type: string, enum: [SOL, USDC, SKR] }, priceUsd: { type: number }, createdAt: { type: string, format: date-time } }
    ListingPage: { type: object, properties: { items: { type: array, items: { allOf: [{ $ref: '#/components/schemas/Listing' }, { type: object, properties: { chip: { $ref: '#/components/schemas/Chip' } } }] } }, nextCursor: { type: [string, 'null'] }, total: { type: integer } } }
    Sale:
      type: object
      properties: { asset: { $ref: '#/components/schemas/Pubkey' }, seller: { $ref: '#/components/schemas/Pubkey' }, buyer: { $ref: '#/components/schemas/Pubkey' }, price: { type: string }, currency: { type: string }, priceUsd: { type: number }, fee: { type: string }, royalty: { type: string }, signature: { type: string }, blockTime: { type: string, format: date-time } }
    SalePage: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Sale' } }, nextCursor: { type: [string, 'null'] } } }
    Offer: { type: object, properties: { asset: { $ref: '#/components/schemas/Pubkey' }, bidder: { $ref: '#/components/schemas/Pubkey' }, amountUsdc: { type: string }, expiresAt: { type: string, format: date-time }, chip: { $ref: '#/components/schemas/Chip' } } }
    Recipe:
      type: object
      properties: { from: { $ref: '#/components/schemas/Rarity' }, to: { $ref: '#/components/schemas/Rarity' }, rule: { type: string, enum: [any, same-collection] }, successBps: { type: integer }, refundOnFail: { type: integer }, feeCgMicro: { type: string }, resultLockSeconds: { type: integer }, boosterBonusBps: { type: integer }, boosterCapBps: { type: integer } }
    FusionPlan:
      type: object
      properties:
        materials: { type: array, items: { $ref: '#/components/schemas/Chip' } }
        recipe: { $ref: '#/components/schemas/Recipe' }
        resultCollection: { type: integer }
        resultRarity: { $ref: '#/components/schemas/Rarity' }
        successBps: { type: integer }
        feeCgMicro: { type: string }
        breaksSet: { type: boolean }
        warnings: { type: array, items: { type: string } }
        nonce: { type: string }
        accounts: { type: object, additionalProperties: { $ref: '#/components/schemas/Pubkey' } }
        needsRandomness: { type: boolean }
    FighterSpec:
      description: A chip by asset key (must be indexed) or by stats
      oneOf:
        - { $ref: '#/components/schemas/Pubkey' }
        - { type: object, required: [collection, rarity], properties: { collection: { type: integer, minimum: 0, maximum: 9 }, rarity: { type: integer, minimum: 0, maximum: 8 }, level: { type: integer, minimum: 1, maximum: 50 } } }
    Round:
      type: object
      description: 'effA = chipPower × synergyA × (1 + elementEdge) × luckA; effB = chipPower × synergyB × luckB; luck ~ U[0.5, 1.5] from the seed'
      properties: { lane: { type: integer }, attacker: { type: string }, defender: { type: string }, elementEdge: { type: number }, luckA: { type: number }, luckB: { type: number }, effA: { type: integer }, effB: { type: integer }, winner: { type: string } }
    Match:
      type: object
      properties:
        id: { type: string }
        season: { type: integer }
        a: { $ref: '#/components/schemas/Pubkey' }
        b: { type: string, description: 'opponent wallet, or `bot:<league>` for a bot fill' }
        squadA: { type: array, items: { $ref: '#/components/schemas/Chip' } }
        squadB: { type: array, items: { $ref: '#/components/schemas/Chip' } }
        powerA: { type: integer }
        powerB: { type: integer }
        league: { type: integer }
        commitA: { type: string }
        commitB: { type: string }
        nonceA: { type: [string, 'null'] }
        nonceB: { type: [string, 'null'] }
        seed: { type: [string, 'null'], description: 'hex sha256(matchId ‖ nonceA ‖ nonceB ‖ serverSecret); null until resolved' }
        seedFormula: { type: string }
        rounds: { type: array, items: { $ref: '#/components/schemas/Round' } }
        winner: { type: [string, 'null'] }
        status: { type: string, enum: [revealing, resolved, cancelled] }
        forfeit: { type: boolean }
        bot: { type: boolean }
        wagerCgMicro: { type: string }
        battlePda: { type: [string, 'null'] }
        resolveSignature: { type: [string, 'null'] }
        rewarded: { type: boolean }
        rewardA: { type: string }
        rewardB: { type: string }
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        serverSecretHash: { type: [string, 'null'] }
        serverSecret: { type: [string, 'null'], description: 'published once the season ended → anyone can re-run the fight' }
        emotes: { type: array, items: { $ref: '#/components/schemas/MatchEmote' }, description: 'spray-tags thrown by the fighters (kind-4 packs), oldest first, max 100' }
    MatchEmote:
      type: object
      properties:
        wallet: { $ref: '#/components/schemas/Pubkey' }
        side: { type: string, enum: [a, b] }
        emote: { type: string, description: 'emote id from economy EMOTE_PACKS' }
        at: { type: string, format: date-time }
    PackPerks:
      type: object
      properties:
        day: { type: integer }
        boosters: { type: integer }
        tickets: { type: integer }
        ticketsLeft: { type: integer }
        ticketXp: { type: integer }
    PassState:
      type: object
      properties:
        seasonId: { type: integer }
        xp: { type: integer, description: 'cumulative season XP (ranked play only — matches won/lost)' }
        tier: { type: integer, description: 'highest unlocked tier of economy PASS_TRACK (0..20)' }
        claimed: { type: array, items: { type: integer }, description: 'tiers already claimed this season' }
        hasPass: { type: boolean }
        passExpiresAt: { type: [string, 'null'], format: date-time }
    ArenaMe:
      type: object
      properties:
        rating: { type: number }
        rd: { type: number }
        league: { type: integer }
        games: { type: integer }
        wins: { type: integer }
        streak: { type: integer }
        rewardedMatchesLeft: { type: integer }
        seasonRank: { type: [integer, 'null'] }
        projectedBracket: { type: [string, 'null'] }
        season: { type: integer }
        openBattles: { type: array, items: { type: object, properties: { battle: { type: string }, wagerCgMicro: { type: string }, status: { type: string }, powerA: { type: integer }, league: { type: integer }, createdAt: { type: [string, 'null'] } } } }
        currentMatch: { type: [object, 'null'], properties: { id: { type: string }, opponent: { type: string }, iRevealed: { type: boolean }, revealDeadline: { type: string, format: date-time } } }
        queue: { type: [object, 'null'], properties: { ticket: { type: string }, league: { type: integer }, joinedAt: { type: string, format: date-time } } }
        recent: { type: array, items: { type: object, properties: { id: { type: string }, opponent: { type: string }, won: { type: boolean }, forfeit: { type: boolean }, reward: { type: string }, endedAt: { type: [string, 'null'] }, xp: { type: integer, description: chip XP this wallet's squad earned from the match }, leveled: { type: integer, description: how many of this wallet's squad caps promoted } } } }
        pendingRewardMicro: { type: string, description: 'match rewards + season payouts not yet in a published root' }
        seasonGames: { type: integer }
        minGamesForPayout: { type: integer }
        lastSeasonPayout: { type: [object, 'null'], properties: { season: { type: integer }, rank: { type: integer }, amount: { type: string } } }
    Season:
      type: object
      properties:
        id: { type: integer }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        poolCgMicro: { type: string, description: "live estimate — emission share (Σ guarded × 23 % × 40 %) + 20 % wager rake of resolved battles; both paid through the kind-3 root" }
        brackets: { type: array, items: { type: object, properties: { topPct: { type: number }, sharePct: { type: number } } } }
        serverSecretHash: { type: string }
        serverSecret: { type: [string, 'null'] }
        previous: { type: [object, 'null'], properties: { id: { type: integer }, serverSecretHash: { type: string }, serverSecret: { type: [string, 'null'] }, settled: { type: boolean }, paidPoolMicro: { type: [string, 'null'], description: "frozen ladder pool = emission share + rake share" }, rakeMicro: { type: [string, 'null'], description: "SEC-L5 — the 20 % wager-rake share of the pool, recycled by staking::fund_slice" }, rakeFunded: { type: boolean, description: "the reward oracle confirmed EmissionState.recycled_total covers this season" } } }
        weeks: { type: integer }
        chipRewardByLeague: { type: array, items: { type: string } }
        soulboundDays: { type: integer }
        minGamesForPayout: { type: integer, description: 'non-forfeit games needed to qualify for the ladder payout' }
    Tag:
      type: object
      description: A player's tag — the first user-generated content in the game (docs/16 §3.2)
      properties:
        id: { type: string }
        wallet: { type: string }
        sha256: { type: string, description: 'content hash — dedupe and provable authorship (§3.6)' }
        status: { type: string, enum: [pending, live, hidden, removed] }
        createdAt: { type: string, format: date-time }
        bytes: { type: integer, description: 'size after the server rebuilt the SVG' }
        commands: { type: integer, description: 'path commands (M/L), limit 400' }
        reports: { type: integer }
        svg: { type: string, description: 'present only when the tag is public or the viewer is the author' }
        mine: { type: boolean }
    WallSlot:
      type: object
      properties:
        slot: { type: integer, description: 0..199 }
        wallet: { type: string }
        tagId: { type: string }
        appliedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: '30 days from applied/renewed — then the slot fades' }
        renewedAt: { type: [string, 'null'], format: date-time }
    WallBoard:
      type: object
      required: [week, weekStart, weekEnd, drawnAt, slot, seedHex, tagsHash, candidates, items]
      properties:
        week: { type: integer, description: 'weekIndex (Monday 00:00 UTC)' }
        weekStart: { type: string, format: date-time }
        weekEnd: { type: string, format: date-time }
        drawnAt: { type: string, format: date-time }
        slot: { type: integer, description: finalized horizon baked into the seed }
        seedHex: { type: string, description: 'sha256(wall-board:v1:week:slot:tagsHash:candidates)' }
        tagsHash: { type: string, description: sha256 of the sorted candidate snapshot }
        candidates: { type: integer, description: how many tags took part }
        items:
          type: array
          items:
            type: object
            required: [tagId, wallet, district, slot]
            properties:
              tagId: { type: string, pattern: '^[0-9a-f]{32}$' }
              wallet: { $ref: '#/components/schemas/Pubkey' }
              district: { type: integer, minimum: 0, maximum: 7 }
              slot: { type: integer, minimum: 0, maximum: 199 }
    WallView:
      type: object
      properties:
        district: { type: integer }
        slots: { type: integer, description: 200 per district }
        taken: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/WallSlot' } }
        layers: { type: array, description: previous tags of a slot, shown as faded paint underneath, items: { type: object, properties: { slot: { type: integer }, wallet: { type: string }, tagId: { type: string }, appliedAt: { type: string, format: date-time }, releasedAt: { type: string, format: date-time } } } }
        me: { type: object, nullable: true, properties: { activeDays: { type: integer }, activeDaysNeeded: { type: integer }, stakedCaps: { type: integer }, stakedCapsNeeded: { type: integer }, eligible: { type: boolean }, reason: { type: [string, 'null'], enum: [need_active_days, need_staked_cap] }, mySlot: { type: [integer, 'null'] } } }
    Rider:
      type: object
      description: |
        docs/16 §4.6 — the rider: one of eight district silhouettes, lit in the colour of a profile theme
        the owner actually paid for. Presentation only, no stats. Shown on the public board (§4.5), which
        is the point: cosmetics are bought to be seen.
        `theme` comes back null when the cosmetic is not (or no longer) paid for — the board then lights the
        figure in its district colour instead of advertising a purchase that lapsed.
      properties:
        silhouette: { type: integer, minimum: 0, maximum: 7 }
        theme: { type: string, nullable: true }
    AchievementList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Achievement' } }
    Achievement:
      type: object
      description: |
        docs/16 §4.7. `have` never exceeds `target` — a counter reading «127 of 36» looks broken, and the
        reward depends on `done`, not on the number.
      properties:
        id: { type: string, example: 'set.first' }
        metric: { type: string, enum: [sets, caps, wallDays, tags, arenaWins, gridDepth, fusions, referrals] }
        target: { type: integer }
        have: { type: integer, description: 'progress, capped at target' }
        done: { type: boolean }
        claimed: { type: boolean }
        claimedAt: { type: string, format: date-time, nullable: true }
        icon: { type: string, description: 'file name in client/public/icons/gen — a real asset, not a drawn glyph' }
        reward: { $ref: '#/components/schemas/AchievementReward' }
        bannerCollection: { type: integer, nullable: true, description: 'for a banner reward: the finished district it will show (null until one is finished)' }
    AchievementReward:
      type: object
      description: |
        Cosmetics and existing items only — never $CG, and never above the quota (docs/02). Each kind is
        an entitlement the rest of the app already understands; `hints` is a Floodgrid item and lands in
        the same stock quests and the season pass use.
      properties:
        kind: { type: string, enum: [banner, emotes, stencils, fieldTheme, bench, skip, hints] }
        pack: { type: string, nullable: true }
        theme: { type: string, nullable: true }
        collection: { type: string, nullable: true, description: "'firstCompleted' — the district is taken from progress, not from config" }
        n: { type: integer, nullable: true, description: 'for `hints`: how many (capped by the normal hint stock)' }
    LineState:
      type: object
      required: [day, week, seed, ticks, length, freeRunsPerDay, freeLeft, paidLeft, runsToday, bestToday, tierToday, rewardsToday, bestWeek, extraRunCgMicro]
      properties:
        day: { type: integer, description: 'unix day index — the layout is a pure function of it' }
        week: { type: integer }
        seed: { type: integer, description: 'layout seed; the client must build the same bowl' }
        ticks: { type: integer }
        length: { type: integer }
        freeRunsPerDay: { type: integer }
        freeLeft: { type: integer }
        paidLeft: { type: integer }
        runsToday: { type: integer }
        bestToday: { type: integer }
        tierToday: { type: string, enum: [none, bronze, silver, gold] }
        rewardsToday:
          type: object
          required: [passXp, hints, valve]
          properties: { passXp: { type: integer }, hints: { type: integer }, valve: { type: integer } }
        bestWeek: { type: integer }
        extraRunCgMicro: { type: integer, description: 'price of one extra run in micro-$CG (burned)' }
    LineReplay:
      type: array
      description: 'The whole input: [tick, action] pairs, action 0 = hop, 1 = grab'
      maxItems: 400
      items:
        type: array
        minItems: 2
        maxItems: 2
        items: { type: integer }
    RunSubmit:
      type: object
      required: [run, granted, state]
      properties:
        run: { $ref: '#/components/schemas/RunRow' }
        granted:
          type: object
          required: [passXp, hints, valve, tier]
          properties:
            passXp: { type: integer }
            hints: { type: integer }
            valve: { type: integer }
            tier: { type: string, enum: [none, bronze, silver, gold] }
        state: { $ref: '#/components/schemas/LineState' }
    RunRow:
      type: object
      required: [id, day, week, score, tricks, bestCombo, bails, paid, tier, submittedAt]
      properties:
        id: { type: integer }
        day: { type: integer }
        week: { type: integer }
        score: { type: integer }
        tricks: { type: integer }
        bestCombo: { type: integer }
        bails: { type: integer }
        paid: { type: boolean }
        tier: { type: string, enum: [none, bronze, silver, gold] }
        submittedAt: { type: string, format: date-time }
    RunReplay:
      type: object
      required: [runId, day, seed, score, tricks, bails, wallet, at, inputs]
      properties:
        runId: { type: integer }
        day: { type: integer }
        seed: { type: integer }
        score: { type: integer }
        tricks: { type: integer }
        bails: { type: integer }
        wallet: { type: string }
        handle: { type: string, nullable: true }
        at: { type: string, format: date-time }
        inputs: { $ref: '#/components/schemas/LineReplay' }
    LineBoard:
      type: object
      required: [week, rows]
      properties:
        week: { type: integer }
        rows:
          type: array
          items:
            type: object
            required: [rank, wallet, score, tricks, bails, runId, at, hasReplay]
            properties:
              rank: { type: integer }
              wallet: { type: string }
              handle: { type: string, nullable: true }
              score: { type: integer }
              tricks: { type: integer }
              bails: { type: integer }
              runId: { type: integer }
              at: { type: string, format: date-time }
              hasReplay: { type: boolean, description: 'false once the 14-day sweeper wiped the inputs' }
    TournamentState:
      type: object
      required: [day, week, entries, best, rank, entrants, poolCgMicro, settled, schedule, prizesYesterday]
      properties:
        day: { type: integer }
        week: { type: integer }
        entries:
          type: object
          required: [bought, unused, left]
          properties:
            bought: { type: integer, description: 'entries bought today (spent or not)' }
            unused: { type: integer, description: 'entry credits not yet spent by a run' }
            left: { type: integer, description: 'how many more paid attempts fit under the shared daily cap' }
        best:
          type: object
          nullable: true
          required: [score, runId, at]
          properties: { score: { type: integer }, runId: { type: integer }, at: { type: string, format: date-time } }
        rank: { type: integer, nullable: true, description: 'my place on today’s board; null outside it' }
        entrants: { type: integer }
        poolCgMicro: { type: string, description: 'accounting model of the day’s prize pool (15% of entries); no $CG ever leaves it — the prize is parts' }
        settled: { type: boolean, description: 'the day has been closed and prizes granted' }
        schedule:
          type: array
          items:
            type: object
            required: [band, topPct, trophies, districtSlots]
            properties:
              band: { type: integer }
              topPct: { type: number, description: 'top percent of the field that takes this band' }
              trophies: { type: array, items: { type: string }, description: 'fixed trophy part ids' }
              districtSlots: { type: integer, description: 'missing district-of-week parts this band grants' }
        prizesYesterday:
          type: array
          items: { type: object, required: [rank, band, part], properties: { rank: { type: integer }, band: { type: integer }, part: { type: string } } }
    TournamentBoard:
      type: object
      required: [day, entrants, poolCgMicro, settled, rows]
      properties:
        day: { type: integer }
        entrants: { type: integer }
        poolCgMicro: { type: string }
        settled: { type: boolean }
        rows:
          type: array
          items:
            type: object
            required: [rank, wallet, score, runId, at, hasReplay, band]
            properties:
              rank: { type: integer }
              wallet: { type: string }
              handle: { type: string, nullable: true }
              score: { type: integer }
              runId: { type: integer }
              at: { type: string, format: date-time }
              hasReplay: { type: boolean }
              band: { type: integer, description: 'prize band of the rank (-1 = outside the prizes)' }
    CrewMonthBoard:
      type: object
      required: [month, rows]
      properties:
        month: { type: integer, description: 'calendar month YYYYMM' }
        rows:
          type: array
          items:
            type: object
            required: [rank, id, name, district, score, part]
            properties:
              rank: { type: integer }
              id: { type: integer }
              name: { type: string }
              district: { type: integer, description: 'wall district of the crew' }
              score: { type: integer, description: 'sum of the crew’s weekly board scores of the month' }
              part: { type: string, description: 'the crew deck part the top crews win' }
    CrewCheck:
      type: object
      required: [available, kind, refHash, priceUsdCents]
      properties:
        available: { type: boolean }
        reason: { type: string, nullable: true, enum: [taken, reserved, blocked, cooldown, invalid, format, null] }
        kind: { type: integer, description: '14 = charter a new crew ($1.99), 15 = rename ($0.99)' }
        refHash: { type: string, description: 'what the on-chain pay_service must commit to' }
        priceUsdCents: { type: integer }
        reservedUntil: { type: string, format: date-time, nullable: true }
    CrewMember:
      type: object
      required: [wallet, joinedAt, bestWeek, counting]
      properties:
        wallet: { type: string }
        handle: { type: string, nullable: true }
        joinedAt: { type: string, format: date-time }
        bestWeek: { type: integer, description: 'best Line score of this member for the week (0 = no run)' }
        counting: { type: boolean, description: 'their run is inside the crew’s five best' }
    CrewView:
      type: object
      description: |
        A crew: name, roster, wall segment and the week's score. `score` is the sum of the five best
        members' best runs — never the sum of the whole roster (docs/16 §5.6).
      required: [id, name, captain, district, segment, slots, createdAt, members, memberCount, minMembers, maxMembers, counts, week, score, tier, mine, iAmCaptain, reports]
      properties:
        id: { type: integer }
        name: { type: string }
        captain: { type: string }
        captainHandle: { type: string, nullable: true }
        district: { type: integer }
        segment: { type: integer, description: 'segment index inside the district wall' }
        slots:
          type: object
          required: [from, to, size]
          properties:
            from: { type: integer, description: 'first slot of the segment (inclusive)' }
            to: { type: integer, description: 'last slot of the segment (exclusive)' }
            size: { type: integer, description: 'slots per crew segment (20)' }
        createdAt: { type: string, format: date-time }
        members: { type: array, items: { $ref: '#/components/schemas/CrewMember' } }
        memberCount: { type: integer }
        minMembers: { type: integer, description: 'below this the crew is not ranked (5)' }
        maxMembers: { type: integer, description: 'roster cap (10)' }
        counts: { type: boolean, description: 'five members with a run this week — the crew is on the board' }
        week: { type: integer }
        score: { type: integer }
        tier: { type: string, enum: [none, bronze, silver, gold] }
        inviteCode: { type: string, nullable: true, description: 'members only' }
        mine: { type: boolean }
        iAmCaptain: { type: boolean }
        reports: { type: integer, description: 'open moderation reports against the name' }
    CrewBoard:
      type: object
      required: [week, rows]
      properties:
        week: { type: integer }
        rows:
          type: array
          items:
            type: object
            required: [rank, id, name, district, segment, members, score, tier]
            properties:
              rank: { type: integer }
              id: { type: integer }
              name: { type: string }
              district: { type: integer }
              segment: { type: integer }
              members: { type: integer }
              score: { type: integer }
              tier: { type: string, enum: [none, bronze, silver, gold] }
    AchievementClaim:
      allOf:
        - { $ref: '#/components/schemas/Achievement' }
        - type: object
          properties:
            granted:
              type: object
              properties:
                entitlement: { $ref: '#/components/schemas/Entitlement' }
                hints: { type: integer, nullable: true }
    RigView:
      type: object
      description: |
        Three exhibit slots. `caps` is the number of *distinct* caps collected (8 districts × 9 rarities) —
        the same number that opens slots 2 and 3 at 12 and 36.
      properties:
        wallet: { type: string }
        board:
          $ref: '#/components/schemas/BoardLoadout'
        rider:
          $ref: '#/components/schemas/Rider'
        public: { type: boolean, description: 'owner has switched the public board on (§4.5)' }
        caps:
          type: array
          description: |
            Distinct caps collected — those are the ones you can exhibit, and their count is what opens
            slots. Empty on the public board: someone else's board shows three caps, not their collection.
          items:
            type: object
            properties:
              asset: { $ref: '#/components/schemas/Pubkey' }
              collection: { type: integer }
              rarity: { $ref: '#/components/schemas/Rarity' }
              level: { type: integer }
              copies: { type: integer }

        slots: { type: array, items: { $ref: '#/components/schemas/RigSlot' } }
        next: { type: object, nullable: true, description: 'the next locked slot and how many caps are missing — the UI says «collect N more», not «soon»', properties: { slot: { type: integer }, need: { type: integer } } }
    RigSlot:
      type: object
      properties:
        slot: { type: integer }
        place: { type: string, enum: [deck, grip] }
        unlocked: { type: boolean }
        unlockAt: { type: integer, description: 'caps needed to open this slot (0 = open from the start)' }
        updatedAt: { type: [string, 'null'], format: date-time }
        chip:
          type: object
          nullable: true
          description: the exhibited cap — visual only, no weight / chance / yield (decisions 1 and 3)
          properties:
            asset: { $ref: '#/components/schemas/Pubkey' }
            collection: { type: integer }
            rarity: { $ref: '#/components/schemas/Rarity' }
            level: { type: integer }
            skin: { type: [string, 'null'] }
            founder: { type: boolean }
    BoardSlotName:
      type: string
      enum: [deck, trucks, wheels, grip, bolts, sticker]
      description: 'the six slots of the board (docs/16 §4.2): the first four make a district set'
    BoardLoadout:
      type: object
      description: |
        What is bolted on the board. Public: the showcase (§4.5) shows the built deck, not the inventory.
        A part is cosmetic — no weight, no chance, no yield (decision 1 in §0.3); a complete district set
        only lights the board in that district's colour.
      properties:
        deck: { type: string, description: 'part id, e.g. deck_d3 or deck_stock' }
        trucks: { type: string }
        wheels: { type: string }
        grip: { type: string }
        bolts: { type: string }
        sticker: { type: string }
        set: { type: integer, nullable: true, description: 'district index when all four main parts come from one district, else null' }
    BoardPartRow:
      type: object
      description: one earned part in the owner's inventory (private — never shown on a public board)
      properties:
        part: { type: string }
        qty: { type: integer, description: 'copies held, capped at 9' }
        source: { type: string, enum: [stock, run, achievement, crew, quest, track, shop], description: 'where it came from — the first source is kept, later duplicates do not rewrite it' }
        createdAt: { type: string, format: date-time }
    BoardView:
      type: object
      description: |
        My board (docs/16 §4.2): what is worn, what is earned, and what the week is offering.
        `week` is the district of the week — one for the whole city, so a player can see what a
        silver run pays this week and decide whether to ride for it.
