        violations: { type: array, items: { type: object, properties: { path: { type: string }, rule: { type: string, description: the program error the chain would raise (OddsGuardRail, FeeTooHigh, SplitGuard, …) or a shape rule }, message: { type: string }, i18n: { $ref: '#/components/schemas/AdminDiagnostic' } } } }
        warningDetails: { type: array, items: { $ref: '#/components/schemas/AdminDiagnostic' }, description: Structured warnings in the same order as warnings; the original message must match before localizing }
        warnings: { type: array, items: { type: string }, description: economy-model warnings that do not block (EV band, Legend faucet, treasury change) }
        instructions: { type: array, items: { type: object, properties: { program: { type: string }, name: { type: string }, accounts: { type: array, items: { type: object, properties: { pubkey: { type: string }, isSigner: { type: boolean }, isWritable: { type: boolean } } } }, data: { type: string, format: byte, description: base64 instruction data (discriminator + Borsh args) } } } }
        diff: { type: object, additionalProperties: { type: object, properties: { from: {}, to: {} } } }
    DailyFlows:
      type: object
      properties: { scheduleCapCg: { type: integer }, emissionCg: { type: integer }, burnedCg: { type: integer }, treasuryCg: { type: integer }, netInflationCg: { type: integer }, sinkRatio: { type: number }, perDauEmission: { type: number } }
    WorldMetrics:
      type: object
      description: Cohorts behind the rule-gate (docs/16 §0.2, §12) — per-wallet averages, not sums.
      properties:
        windowDays: { type: integer }
        asOf: { type: string, format: date-time }
        features:
          type: array
          description: one card per world feature — everyone who touched it vs everyone who played but did not
          items: { $ref: '#/components/schemas/WorldFeatureCohort' }
        slices:
          type: array
          description: |
            Narrower cuts, compared against a baseline that is not "everyone who played".

            `wall.board` (docs/16 §3.7) cuts *inside* a feature: every board author already holds a slot
            (§3.4), so measuring them against all players measures the slot, not the board — the
            baseline is slot holders who never made the board.

            `collection.mural` (docs/16 §2.3) is cut from game state, not from events: the cohort is
            wallets holding at least 8 of some district's 9 caps (a mural painted 80 % or more), and the
            baseline is players of the same window who never got that far. It carries no `series`: owning
            caps is not an event, and "how many murals were finished per day" is a different question.
          items: { $ref: '#/components/schemas/WorldFeatureCohort' }
        epicPlus:
          type: object
          description: 'docs/16 §12 row 1 — share of pack opens followed by another pack purchase within 24 h'
          properties:
            cohort:
              type: object
              description: opens that contained at least one Epic+ cap
              properties: { opens: { type: integer }, repeatRate: { type: [number, 'null'] } }
            baseline:
              type: object
              description: opens in the same window without an Epic+ cap
              properties: { opens: { type: integer }, repeatRate: { type: [number, 'null'] } }
            delta: { type: [number, 'null'], description: 'cohort / baseline − 1; null when there is nothing to divide by' }
        arenaRematch:
          type: object
          description: 'docs/16 §12 row 4 — share of battles followed by another battle within 30 minutes'
          properties:
            cohort:
              type: object
              description: battles the wallet lost
              properties: { opens: { type: integer }, repeatRate: { type: [number, 'null'] } }
            baseline:
              type: object
              description: battles the same wallets won in the same window
              properties: { opens: { type: integer }, repeatRate: { type: [number, 'null'] } }
            delta: { type: [number, 'null'], description: 'loss-rematch rate / win-rematch rate − 1' }
    WorldFeatureCohort:
      type: object
      description: one cohort card — per-wallet averages for the group, the baseline and the ratio between them
      properties:
        feature:
          type: string
          description: 'feature name, or `feature.kind` for a slice (e.g. `wall.board`, `collection.mural`)'
          enum: [wall, exhibit, tag, inspect, rider, achievement, 'wall.board', 'collection.mural']
        windowDays: { type: integer }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        cohort: { $ref: '#/components/schemas/WorldCohortStats' }
        baseline: { $ref: '#/components/schemas/WorldCohortStats' }
        delta:
          type: object
          description: 'cohort / baseline − 1 per metric; null when there is nothing to divide by — an empty cohort is null too, never −100 %'
          properties: { packs: { type: [number, 'null'] }, trades: { type: [number, 'null'] }, fusions: { type: [number, 'null'] }, loginDays: { type: [number, 'null'] }, stakedCaps: { type: [number, 'null'] }, referrals: { type: [number, 'null'] }, services: { type: [number, 'null'] } }
        series:
          type: array
          description: adoption curve — events and distinct wallets per day
          items: { type: object, properties: { day: { type: integer }, events: { type: integer }, wallets: { type: integer } } }
    WorldCohortStats:
      type: object
      properties:
        wallets: { type: integer }
        packsPerWallet: { type: number }
        tradesPerWallet: { type: number }
        fusionsPerWallet: { type: number }
        loginDaysPerWallet: { type: number }
        stakedCapsPerWallet: { type: number }
        referralsPerWallet: { type: number, description: 'wallets that arrived through this wallet’s link, per wallet' }
        servicesPerWallet: { type: number, description: 'paid services (cosmetics, handles, skins) per wallet — the item track the rider is supposed to feed (§4.6)' }
    AdminKpi:
      type: object
      properties:
        asOf: { type: string, format: date-time }
        players: { type: object, properties: { wallets: { type: integer }, dau: { type: integer }, payersLifetime: { type: integer }, payers30d: { type: integer }, conversionToFirstPack: { type: [number, 'null'] }, starterToPaidConversion: { type: [number, 'null'] } } }
        retention: { type: object, description: "dN = wallets whose first day ended N+1…N+8 days ago that were active (login or match) on their day N", additionalProperties: { type: object, properties: { cohort: { type: integer }, retained: { type: integer }, rate: { type: [number, 'null'] } } } }
        revenue: { type: object, properties: { usd30d: { type: number }, arppu30d: { type: [number, 'null'] }, packs30d: { type: integer }, services30d: { type: integer } } }
        economy: { type: object, properties: { burned7dMicro: { type: string }, emitted7dMicro: { type: string }, sinkRatio7d: { type: [number, 'null'] }, guardedDailyMicro: { type: string }, guardSource: { type: string, enum: [chain, schedule] }, floorIndexUsdPerCommonEq: { type: [number, 'null'] }, floorsByRarityUsd: { type: array, items: { type: object, properties: { rarity: { type: integer }, usd: { type: [number, 'null'] } } } } } }
        market: { type: object, properties: { listings: { type: integer }, volume7dUsd: { type: number } } }
        arena: { type: object, properties: { season: { type: integer }, endsAt: { type: integer }, poolCgMicro: { type: string }, matches7d: { type: integer }, botShare7d: { type: [number, 'null'] }, wagerBattles7d: { type: integer } } }
        fraud: { type: object }
        finality: { type: object }
        floodgrid: { type: object, properties: { onboardShown: { type: integer }, onboardClicked: { type: integer }, onboardCompleted: { type: integer }, onboardConversion: { type: [number, 'null'] }, ladderPlayers: { type: integer }, ladderPaidMicro: { type: string }, districtsGoalReachedPrevWeek: { type: integer }, prestigeChips: { type: integer }, masteredChips: { type: integer }, deepResultsThisWeek: { type: integer } } }
    ActivityPage:
      type: object
      properties: { items: { type: array, items: { type: object, properties: { kind: { type: string }, signature: { type: string }, blockTime: { type: string, format: date-time }, payload: {} } } }, nextCursor: { type: [string, 'null'] } }
