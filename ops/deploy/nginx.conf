# GUTTERCAPS edge: the SPA, the API proxy, the websocket proxy (docs/09 §4.1, runbook.md §1.3).
#
# Why this file exists instead of "let the app serve itself": three things a Node process does badly
# are one job nginx does well — `immutable` caching of hashed assets, HTTP/2 + compression for a
# ~500 KB gzip critical path, and holding 500 idle websockets without eating the API's heap. TLS is
# NOT here: see the block at the bottom for why (the certificate belongs to whoever owns the DNS).
#
# Port 8080, not 80: the container is expected to sit behind a TLS terminator (or `docker -p 443:8080`
# with a sidecar). Nothing in this file listens on 443, so nobody mistakes this for the HTTPS endpoint.

upstream api {
    server api:8787;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The API is same-origin-only for the browser, but /metrics is not for the world. Docker's default
# network is 172.16.0.0/12; add your own internal CIDR via the templated line below if that is wrong.
geo $metrics_allowed {
    default            0;
    127.0.0.1/32       1;
    172.16.0.0/12      1;
    10.0.0.0/8         1;
    192.168.0.0/16     1;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # One place for the headers the app cannot set for its own document (the API sets the JSON ones).
    # CSP is the version that lets the wallet adapters work: they inject styles at runtime and open
    # modal iframes, and a strict CSP without 'unsafe-inline' on style breaks the connect flow in a
    # way that looks like a wallet bug. Tighten only with the wallet matrix re-tested.
    #
    # SEC-B9 (SECURITY-AUDIT-2026-09-26.md): `script-src 'self'` used to block Cloudflare Turnstile —
    # HumanCheck.tsx injects challenges.cloudflare.com/turnstile/v0/api.js on demand, so in production the
    # proof-of-human widget could never render and no wallet could obtain a human pass (quests and SKR
    # rewards are settled only for verified wallets). A control that cannot run is a wall, and the failure
    # was client-side and silent. Turnstile needs script-src + frame-src (its official CSP reference);
    # connect-src carries its telemetry. The other half of the same fix: `wss:` was removed from
    # connect-src — a bare scheme-source allows a socket to *any* host, which is an exfiltration channel
    # for injected script, while the app's own socket is same-origin (`client/src/api/ws.ts` builds it
    # from window.location.host) and RPC subscriptions only go to the named providers below.
    # tests/security/csp.test.ts fails when the CSP and the client sources name different origins — keep
    # its ALLOWED list and this header in sync. Pointing the app at a different RPC provider means editing
    # both (runbook §1.2 says so).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://challenges.cloudflare.com https://*.solana.com https://api.mainnet-beta.solana.com https://*.helius-rpc.com https://*.triton.one wss://*.solana.com wss://api.mainnet-beta.solana.com wss://*.helius-rpc.com wss://*.triton.one; frame-src 'self' https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Vite hashes filenames, so a content-addressed asset never changes and can be pinned hard.
    # index.html must never be cached: it is the only file that names the hashed bundles.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Self-hosted webfonts (SEC-B4): the URL carries `?v=<content hash>` (client/src/shared/ui/fonts.css
    # is generated by `npm run fonts:vendor`), so the bytes behind a URL never change and this is as
    # pinnable as /assets/. Without the `?v=` the same `expires 1y` would serve a stale font after a
    # re-vendor — which is why the version is asserted by `npm run fonts:check`, not just written here.
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # A missing chunk must not fall back to index.html: the SPA would answer 200 with HTML for a
    # `<script type=module>` and the browser would report a MIME error, which reads like a broken
    # build. 404 is honest and self-explanatory in the console.
    location ~* \.(?:js|css|map|json|wasm|svg|png|jpg|jpeg|webp|woff2?)$ {
        try_files $uri =404;
        access_log off;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2 text/plain;
    # `zstd` needs nginx built with the module (the alpine package is not). If you precompress, do it
    # in the image build and serve with a map on $http_accept_encoding; brotli here is a comment, not a
    # lie: `gzip_types` alone is what this config actually does.

    client_max_body_size 32k;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # The API's own probes, for `curl` from the host. /readyz stays reachable through /v1 too, but the
    # deployment (compose healthcheck, uptime monitor) should hit these.
    location = /readyz {
        proxy_pass http://api/readyz;
        proxy_http_version 1.1;
        access_log off;
    }
    location = /metrics {
        if ($metrics_allowed = 0) { return 403; }
        proxy_pass http://api/metrics;
        proxy_http_version 1.1;
        access_log off;
    }

    location /v1/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # trust proxy + these two are what make req.ip the player, not the container. Without them the
        # rate limiter keys every user in the world as one IP and bans the whole origin.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        # Legal gating (backend/src/geo.ts). Assigning the header here — instead of `proxy_set_header
        # X-Geo-Country $http_x_geo_country` — is the whole security property: whatever the buyer sent is
        # dropped, and the only value that reaches the API is Cloudflare's own `cf-ipcountry` (which CF
        # overwrites on inbound requests, so a client cannot pick its region). No Cloudflare in front
        # means an empty header, and the API then treats the country as unknown rather than guessed.
        proxy_set_header X-Geo-Country $http_cf_ipcountry;
        proxy_read_timeout 30s;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        # SSE/long-poll paths do not exist here; if one is added, it needs `proxy_buffering off`.
    }

    location = /ws {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # A socket that only carries invalidation hints can idle; the client pings too, so 5 minutes of
        # silence really does mean the peer is gone. Too short and mobile browsers on a flaky network
        # reconnect every minute, which is a self-inflicted DDoS.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 404 for anything else that is not the SPA (dotfiles, /.git, uploads that do not exist here).
    location ~ /\. { deny all; }
}

# ── TLS ──────────────────────────────────────────────────────────────────────────────────────
# Not terminated in this container, on purpose: the key has to live where the DNS is, and a
# self-signed certificate baked into an image is how a project ends up with `nginx add_header
# Strict-Transport-Security` and no working HTTPS. Either put the app behind the platform's
# terminator (Fly/Cloudflare/ALB) and keep this file as the internal hop, or uncomment:
#
#   listen 443 ssl http2;
#   server_name app.guttercaps.gg;
#   ssl_certificate     /etc/letsencrypt/live/app.guttercaps.gg/fullchain.pem;
#   ssl_certificate_key /etc/letsencrypt/live/app.guttercaps.gg/privkey.pem;
#   ssl_protocols TLSv1.2 TLSv1.3;
#   ssl_prefer_server_ciphers off;
#   ssl_stapling on; ssl_stapling_verify on;
#   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#   # …and a :80 server block that only 301s to https, with ACME's challenge path exempted.
# Then flip COOKIE_SECURE/`SameSite=None` requirements in the backend config gate (they are already
# refused in production when missing, which is the point of that check).
