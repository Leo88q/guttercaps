[package]
name = "chip_core"
version = "0.2.0"
description = "GUTTERCAPS core: collections registry (Metaplex Core), VRF packs with pity, fusion, chip state"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "chip_core"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
# Cluster selects the Switchboard program id that must own randomness accounts (SEC-C1/H1):
#   mainnet (default) SBond… · devnet Aio4… · localnet the sb_mock program.
devnet = []
localnet = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.32.2"
# Metaplex Core: single-account NFTs + plugins (PermanentFreeze/Burn, Royalties, Attributes)
# `>=0.11.1, <0.12`: 0.12 requires solana-program ^3, whose manifests the platform cargo (1.79) cannot
# read; the anchor feature exists since 0.11.1. scripts/ci-cargo-lock.sh pins the exact version.
mpl-core = { version = ">=0.11.1, <0.12", default-features = false, features = ["anchor"] }
# Bubblegum V2 is pinned to the last line compatible with Anchor 0.31 / Solana 2.
# 3.x requires Anchor 1.x and solana-program 3.x; upgrading that graph is a separate migration.
mpl-bubblegum = "=2.1.1"
# Switchboard On-Demand randomness (commit-reveal). v2 VRF is deprecated.
switchboard-on-demand = { version = "0.13.0", features = ["anchor"] }
# Pyth pull oracle for SOL/USD at checkout
# 1.0.x is the last line built against anchor-lang 0.31 (2.0 → anchor 1.x)
pyth-solana-receiver-sdk = "=1.0.1"

[dev-dependencies]
proptest = "1"
