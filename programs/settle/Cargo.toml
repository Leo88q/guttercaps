[package]
name = "settle"
version = "0.1.0"
description = "GUTTERCAPS phase-V thin settlement program: oracle-authorized pack mints, Merkle reward claims, cNFT escrow market"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "settle"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"
# Bubblegum V2 pinned exactly like chip_core/market (last line on Anchor 0.31 / Solana 2).
mpl-bubblegum = "=2.1.1"
